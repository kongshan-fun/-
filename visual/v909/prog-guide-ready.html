/* V28: preserve all gameplay geometry, fix visual hierarchy and add true mono theme. */
:root{--ui-soft:#f4f6f0;--ui-accent:#52735d;--ui-border:#dfe5dc;--ui-faint:#738177}
.panel{border-radius:11px;border-color:var(--ui-border);box-shadow:0 10px 36px #24352a18}
.panel-head{height:42px;background:var(--surface);border-bottom-color:var(--ui-border);padding:0 12px}

.panel-close{border-radius:7px;border-color:var(--ui-border);background:var(--surface);font-size:20px}
.panel-toolbar{background:var(--ui-soft);border-bottom-color:var(--ui-border);gap:7px}
.panel-body{padding:12px 11px;scrollbar-gutter:stable;}

.panel .btn,.modal .btn,.event-choice{border-radius:7px;min-height:32px}
.panel input,.panel select,.modal input{border-radius:7px}
.modal{border-radius:12px;box-shadow:0 18px 60px #141f1830}
.modal h2{letter-spacing:.03em}
.guide-card,.help-chapter,.panel-card{border-radius:9px}
button{transition:background-color .12s ease,border-color .12s ease}
.theme-picker{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:7px 0 4px}
.theme-choice{white-space:nowrap;font-size:12px;font-weight:600;min-height:38px!important}

.manual-page{padding-bottom:18px}.manual-section-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 8px}.manual-section-header strong{font-size:13px;color:var(--ink,#222)}.manual-section-header span{font-size:10px;color:var(--muted,#777)}.manual-slots-v53{display:grid;gap:7px}.manual-slot-v53{display:flex;align-items:center;gap:10px;min-height:68px;border:1px solid var(--line,#ddd);border-radius:10px;padding:9px 10px;background:var(--panel-card,#fff)}.manual-seal{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:9px;background:var(--panel-subtle,#eff1eb);color:var(--ink,#354b3c);font:700 19px/1 "Noto Serif CJK SC",serif}.manual-slot-info{min-width:0;flex:1;display:grid;gap:2px}.manual-slot-info small,.manual-slot-info span{color:var(--muted,#777);font-size:10px}.manual-slot-info strong{color:var(--ink,#222);font-size:13px;overflow-wrap:anywhere}.manual-small-action{flex:none;border:1px solid var(--line,#ccc);border-radius:7px;min-height:31px;background:var(--panel-subtle,#fafafa);color:var(--ink,#333);padding:4px 8px;font-size:10px}

.manual-book{border:1px solid var(--line,#d5d9d1);border-radius:11px;padding:12px;margin:0 0 10px;background:var(--panel-card,#fff);box-shadow:0 2px 9px #00000007}.manual-book.is-equipped{border-color:#64a181;box-shadow:inset 3px 0 0 #64a181}.manual-book.is-unknown{opacity:.86}.manual-book-head{display:flex;align-items:center;gap:10px;min-width:0}.manual-book-icon{display:grid;place-items:center;width:38px;height:42px;flex:none;border:1px solid #9eac9e;border-radius:7px;background:var(--panel-subtle,#eef1e8);font:700 20px "Noto Serif CJK SC",serif;color:var(--ink,#344a40)}.manual-book-name{min-width:0;flex:1;display:grid;gap:2px}.manual-book-name strong{color:var(--ink,#222);font:650 15px "Noto Serif CJK SC","Songti SC",serif;overflow-wrap:anywhere}.manual-book-name small{font-size:10px;color:var(--muted,#777)}.manual-state{flex:none;font-size:9px;color:var(--muted,#777);background:var(--panel-subtle,#f3f3f3);border:1px solid var(--line,#ddd);border-radius:5px;padding:3px 5px}.is-equipped .manual-state{color:#2d8554;border-color:#64a181}.manual-book-desc{margin:9px 0!important;color:var(--ink,#333)!important;font-size:11px!important}.manual-book-metrics{display:flex;flex-wrap:wrap;gap:6px}.manual-book-metrics span{padding:3px 6px;border-radius:4px;background:var(--panel-subtle,#f4f5f1);color:var(--muted,#656565);font-size:10px}.manual-progress{height:5px;background:var(--line,#ddd);border-radius:30px;overflow:hidden;margin:9px 0}.manual-progress i{display:block;height:100%;background:#6a9e80;border-radius:30px}.manual-note{margin-top:7px;font-size:10px;line-height:1.6;color:var(--muted,#777)}.manual-book-actions{margin-top:10px;display:flex}.manual-card-btn{min-height:34px;border:1px solid var(--line,#bbb);border-radius:7px;background:var(--panel-subtle,#f3f3f3);color:var(--ink,#333);padding:7px 12px;font-size:11px}.manual-book-actions .manual-card-btn{width:100%}.manual-card-btn.primary{background:#355e48;color:#fff;border-color:#355e48}.manual-empty{padding:24px 1
