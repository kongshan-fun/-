<style id="v917-book-hierarchy">
/* V90.17 图鉴父子页：品类入口 → 条目 → 详情
   依据：图鉴原默认页是 12 行 × 42px 的折叠组（582px 固定高度，与屏宽无关），
   320/360 下必然 1.6–2.0 屏；密度压缩对它结构性无效。改为品类入口 + 同质条目列表。 */
#panel-root .book-home{display:flex;flex-direction:column;gap:8px}

 min-height:44px;padding:7px 10px;border:1px solid var(--line,#ddd);border-radius:8px;
 background:var(--surface,#fff);color:var(--ink,#222);text-align:left;cursor:pointer}

#panel-root .book-cat-cell b{font-size:12.5px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
#panel-root .book-cat-cell small{flex:none;font-size:9.5px;color:var(--muted,#555);white-space:nowrap;font-variant-numeric:tabular-nums}
#panel-root .book-cat-cell i{flex:none;font-style:normal;font-size:14px;line-height:1;color:var(--muted,#555)}
#panel-root .book-list-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
 padding:0 2px 6px;font-size:10.5px;color:var(--muted,#555);font-variant-numeric:tabular-nums}

@media (max-width:400px){
  #panel-root .book-cat-cell{min-height:40px;padding:6px 8px;gap:4px}

  #panel-root .book-cat-cell small{font-size:9px}
}
@media (max-width:340px){
  #panel-root .book-home{gap:6px}
  #panel-root .book-cat-grid{gap:5px}
  #panel-root .book-cat-cell{min-height:36px;padding:5px 7px}

}
</style>
<style id="v919-promo">
/* V90.19 一次性「评价 + 加群」入口（点过即消失）
   位置：场景卡标题行内（标题与危险度徽章之间）的一个小圆角标点。
   为什么不用贴边悬浮：320 宽实测 HUD 每个像素都被占用（资源格第 6 列到 x=308），
   贴在右缘会实打实盖住一颗资源；放进标题行则由 flex 天然让位，永不重叠。 */
#promo-slot{flex:none;display:flex;align-items:center}
#promo-slot .promo-chip{height:20px;padding:0 6px;border:1px solid var(--line-strong,#777);
 border-radius:4px;background:var(--panel-bg,#fff);color:var(--ink,#222);font-size:9.5px;
 line-height:1;white-space:nowrap;flex:none;letter-spacing:.01em}
#promo-slot .promo-chip:active{background:#eee}
#scene-content .location-head h1{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal .promo-group{display:flex;align-items:center;justify-content:space-between;gap:10px;
 border:1px solid #777;border-radius:6px;background:#fff;padding:10px 12px;margin:10px 0;font-size:12px}
.modal .promo-group b{font:650 20px/1.1 "Songti SC","SimSun",serif;letter-spacing:.08em}
.modal .promo-uses{font-size:11.5px;line-height:1.75;color:#444;margin:6px 0 8px}
.modal .promo-uses b{font-weight:600;color:#111}
</style>
<style id="v927-quest-narrow">
/* V90.27 主线父页在 ≤400px 的行高收敛（只收行高，不改字号下限、不裁文字） */

  #panel-root .q4-links{gap:5px}

  #panel-root .q3-actions{margin-top:5px}

  #panel-root .q3-note{padding:1px 0}
  #panel-root .q3-needs{margin:3px 0 0}

  #panel-root .q3{gap:4px}
}
</style>
<style id="v928-camp-frame">
/* V90.28 洞府外框收紧：只动留白与间距，不动字号与卡片内文字 */
#panel-root .camp-summary{padding-bottom:9px;margin-bottom:9px}

#panel-root .camp-build-title{margin:7px 0 4px}
#panel-root .build-grid{gap:5px}
#panel-root .build-grid .building-card{padding:6px}
</style>
<style id="v930-combat">
/* V90.30 战斗界面：全屏模态，三段式（敌 / 日志 / 我+技能） */
.combat-root{position:absolute;inset:0;z-index:63;display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--page);overflow:hidden}
.combat-root[hidden]{display:none!important}
.cb-foe,.cb-self{flex:none;border:1px solid var(--line);border-radius:8px;padding:7px 9px;display:flex;flex-direction:column;gap:4px;background:var(--panel-bg,var(--surface,#fff))}
.cb-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0}
.cb-name{font:650 15px/1.25 "Noto Serif CJK SC","Songti SC",serif;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-meta{flex:none;font-size:10px;color:#777;font-variant-numeric:tabular-nums}
.cb-bar{position:relative;height:13px;border-radius:7px;background:#e9e9e9;overflow:hidden}
.cb-bar>i{display:block;height:100%;background:#c0392b;transition:width .18s linear}
.cb-self .cb-bar>i{background:#2f855a}
.cb-bar>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#111;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.cb-hint{font-size:10.5px;color:#8a1c1c}
.cb-hint.normal{color:#555}
.cb-hint.recovery{color:#2f855a}
.cb-log{flex:1 1 auto;min-height:96px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:8px 9px;display:flex;flex-direction:column;gap:5px;font-size:11.5px;line-height:1.62;background:var(--surface,#fff);scrollbar-width:thin}
.cb-line{margin:0;color:#333}
.cb-line b{font-weight:650}
.cb-line.warn{color:#8a1c1c}
.cb-line.good{color:#2f855a}
.cb-line.dim{color:#888;font-size:10.5px}
.cb-skills{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.cb-actions{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.cb-skills .btn,.cb-actions .btn{min-height:38px;padding:4px 5px;font-size:11.5px;line-height:1.25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.cb-skills .btn small,.cb-actions .btn small{font-size:9px;color:#777;font-weight:400}
.cb-cost{flex:none;font-size:9.5px;color:#888;text-align:center}
@media (max-width:340px){.cb-log{font-size:11px;min-height:80px}.cb-skills .btn,.cb-actions .btn{min-height:34px;font-size:11px}}
</style>
<style id="v931-combat-layout">
/* V90.31 战斗界面：血条放大、技能上移到我方血条之上、日志折叠 */
.cb-foe,.cb-self{padding:9px 10px;gap:6px}
.cb-foe .cb-bar,.cb-self .cb-bar{height:24px;border-radius:12px}
.cb-skills{margin-top:auto}
.cb-foe{flex:1 1 auto;justify-content:flex-end;min-height:96px}
.combat-root.log-open .cb-foe{flex:0 0 auto;justify-content:flex-start}
.cb-log-wrap[open]{max-height:52vh;overflow:hidden}
.cb-log-wrap[open] .cb-log{max-height:calc(52vh - 34px)}
.cb-foe .cb-bar>span,.cb-self .cb-bar>span{font-size:12px;font-weight:600}
.cb-name{font-size:17px}
.cb-meta{font-size:10.5px}
.cb-log-wrap{flex:none;border:1px solid var(--line);border-radius:8px;background:var(--surface,#fff);overflow:hidden}
.cb-log-wrap>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:7px 9px;font-size:10.5px;color:#555;line-height:1.35}
.cb-log-wrap>summary::-webkit-details-marker{display:none}
.cb-log-wrap>summary .cb-sum-tag{flex:none;font-weight:650;color:#333}
.cb-log-wrap>summary .cb-sum-line{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#666}
.cb-log-wrap>summary .cb-sum-arrow{flex:none;color:#999;transition:transform .15s}
.cb-log-wrap[open]>summary{border-bottom:1px solid var(--line)}
.cb-log-wrap[open]>summary .cb-sum-arrow{transform:rotate(180deg)}
.cb-log-wrap .cb-log{border:0;border-radius:0;max-height:38vh;min-height:0}

<style id="v932-character-cover">

<style id="v933-combat-long">

.combat-root{padding:8px 8px calc(8px + env(safe-area-inset-bottom))}

<style id="v935-camp-cards">
/* V90.35 洞府设施卡：说明行去掉后收紧高度 */
#panel-root .building-card{min-height:0}

<style id="v941-panel-fullscreen">
/* V90.41 面板全屏：任何面板打开都让顶部 HUD 让位，标题行下补迷你资源条 */

<body>
<div id="phone" class="phone front-mode">
 <div id="game-shell" class="game-shell">
  <header class="topbar"><div class="wordmark">山野修仙记 <span>十二境 · 修仙生存</span></div><div class="top-buttons"><button data-a="panel" data-name="help">教程</button><button data-a="panel" data-name="settings">设置</button></div></header>
  <section id="status" aria-label="修行状态"></section>
  <div class="game-middle" id="game-middle">
  <button id="quest" class="quest" data-a="panel" data-name="quest" aria-label="查看主线任务"></button>
  <main id="scene" class="scene" aria-label="当前地点"><div id="scene-content"></div></main>
  <section class="inventory-peek" id="inventory-peek" aria-label="随身物品概览">
   <div class="peek-heading"><b>随身</b><span id="weight-caption"></span><button data-a="panel" data-name="pack">全部 ›</button></div>
   <div class="peek-grid" id="peek-grid"></div>
  </section>
  <section class="bottom-dock" aria-label="移动与补给">
   <div class="map-dock" id="map-dock" aria-label="以玩家为中心的九宫格">
    <div class="map-heading"><span id="map-caption">附近</span><button id="expand-map" data-a="expand-map" aria-controls="map-overlay" aria-expanded="false">展开</button></div>
    <div id="map" class="mini-grid" role="group" aria-label="九宫格移动盘，我固定在中心"></div>
   </div>
   <div class="field-controls">
    <div class="travel-row"><button id="travel-toggle" data-a="travel-toggle" aria-expanded="false" aria-controls="travel-menu"><span>出行</span><strong id="zone-label">青岚山麓</strong><span aria-hidden="true">⌄</span></button></div>
    <div class="journey-controls"><button id="home-button" data-a="home">定居</button><button id="stop-button" data-a="stop" disabled>停步</button></div>
    <div class="supplies"><button id="food-button" data-a="consume" data-id="berry">灵果 <small id="berry-count">4</small></button><button id="water-button" data-a="consume" data-id="water">饮水 <small id="water-count">3</small></button><button id="heal-button" data-a="consume" data-id="salve">回春 <small id="salve-count">2</small></button><button id="rest-button" data-a="quick-rest">调息</button></div>
   </div>
  </section>
  <section id="panel-root" aria-live="off"></section>
  </div>
  <nav class="quick-nav" aria-label="快捷操作">
   <button id="camp-button" data-a="panel" data-name="camp">洞府</button>
   <button id="craft-button" data-a="panel" data-name="craft">炼制</button>

  <div id="travel-menu" class="travel-menu" hidden></div>
 </div>
 <main id="entry-root" class="entry-root" aria-label="开始游戏"></main>
 <section id="map-overlay" class="map-overlay" hidden aria-label="本境完整地图" role="dialog" aria-modal="true">
  <div class="world-header"><div><small id="world-zone">青岚山麓</small><h2>本境地图</h2></div><button id="collapse-map" data-a="collapse-map" aria-label="收起完整地图">收起 ×</button></div>
  <p id="world-caption" class="world-caption"></p>
  <div class="world-map-frame"><div id="world-map" class="world-grid" role="group" aria-label="八乘八完整区域地图"></div></div>

   "你从青岚旧营坪出发。这里不是现成宗门，没有免费仓库、炼器室或丹房。初始随身物资为灵木2、低阶灵石1、青藤2、灵果4、清泉水3、回春散2；先采集、做工具，再选一处地方筑庐。",
   "第一次进入选「跟着学」，十一段实操依次是：采一份材料、制斧、择地筑庐、建仓房、亲手存取、建炼器室、炼剑并观察综合战力、建丹房并炼辟谷丸、查看新版图鉴、安全试剑、查看十二境出行。每段检查实际行为，不是翻完文字就结束。",
   "引导会检查你携带的工具、所缺材料、所在地、生命和饥渴状态；不够时先补给或找资源。已有设施和装备不要求重复建造。可收起、暂停、跳过或从教程继续；完成奖励只发一次，重播不重复发奖。"
  ]
 },
 {
  "id": "screen",
  "title": "九宫格、地图与按钮",
  "paragraphs": [
   "上方展示你在此地发现的物资和妖兽，点击灵草、树枝或石块即可尝试采集。左下方地图中的「我」代表当前位置，点击周围的地点即可前往；想去更远的地方，可展开地图选择目的地。",
   "「展开」显示本境完整8×8文字地图，点目的地后保持地图展开并逐格寻路，可以随时观察当前位置。遇敌、进入奇遇或到达界碑会停步；点「停步」、其他移动格或打开面板也会取消路线。未完成仪式不能进入首领格。",
   "地图「府」是你自己的洞府，「坪」只是未建设的旧营坪。「回府」沿路走回本境洞府，会正常耗时耗粮、也可能遇敌；没有洞府时这个按钮显示「定居」。出行菜单可以前往已开放的区域，跨境抵达该境自建洞府或旧营坪，不会自动送一套房。",
   "常用操作都在主界面。随身行囊可查看材料和补给；需要制造工具、整理仓库或修炼时，打开相应入口。遇到缺少工具或材料的提示，先查看具体要求再行动。"
  ]
 },
 {
  "id": "settle",
  "title": "选址、筑庐与迁居",
  "paragraphs": [
   "先走到候选格，再点「洞府 → 在此筑庐」。可定居的地形包括旧营坪、草坡、林地、石岗、花田；水域、矿洞、首领、祭坛、界碑、固定奇遇点不能覆盖。面板会显示已到访的合适地点，以及附近水源、林地、矿材的提示。邻近标签帮助选路，不代表自动产出加成。",
   "筑庐消耗随身灵木4、青藤2、低阶灵石2，耗时120游戏分钟。确认成功后才有一阶草庐，可休息、补给、吐纳和安全试剑；仓房、炼器室、丹房仍要各自修建。每个区域最多一座洞府，全图最多五座。",
   "迁居前在原仓取好材料，走到新的合适格，点洞府中的「迁居到此」。确认消耗随身灵木3、青藤2、灵石2和180分钟；原有建筑、仓物与灵田计时完整转移，旧地点恢复原标记，不产生第二座洞府或第二份物资。取消确认不扣料。",
   "选址失败、材料不足、战斗中或地点受保护时不会扣除建造材料和时间。正常建造会推进游戏时间并消耗生存状态，开工前先吃喝，避免工作期间负伤。"
  ]
 },
 {
  "id": "build",
  "title": "洞府与七类设施",
  "paragraphs": [
   "洞府入口把住所、仓房、炼器室、丹房、静室、灵田、山门集中在一个面板。每张建筑卡分别写清当前等级、下一级材料、前置要求和建成后的效果；点建造或升级后立即结算游戏时间，不要求在现实中等进度条。",
   "住所一阶为草庐，二阶为石筑洞府，三阶为灵脉道院。二、三阶住所分别开放对应等级的高级设施。升级住所不会免费升级其他房间；不同区域的建筑等级也不互相共享。",
   "二阶住所需木8、石5、玄铁矿2；三阶需木10、石8、赤铜晶3、阵纹1。仓房共有三阶，炼器室三阶，丹房三阶，静室三阶，灵田两阶，青岚山门一阶。所有等级材料与完整效果可在建筑卡和图鉴的建筑分类中查询。",
   "第一座府建议先仓房，再炼器室和丹房；升级住所、静室、灵田按资源安排，不必为了过第一境立即造满。后续可以把青岚发展为主要生产基地，也可以在新境建设当地工坊，减少搬运与折返。"
  ]
 },
 {
  "id": "storage",
  "title": "本地仓库与地上遗物",
  "paragraphs": [
   "仓房容量按物品重量计算，一至三阶分别为80、180、360。必须亲自在这一境的自建洞府，且建有仓房，才可存取。每境仓库独立：在碧溪不能用青岚仓里的矿，野外也不能隔空取料。",
   "府内营建、炼制等耗材行动自动合计随身和当前可用本仓，优先扣随身。物品留在仓中不必先拿出再造物；但伐木斧、石镐、钓竿必须随身，仓里的工具不能远程生效。没有仓房时只计算随身。",
   "「材料存仓」只批量存材料，保留食物和工具；单项按钮可存其他物品。仓容量不足会只存能容纳的部分，余物仍在身上。取1、取5同样受行囊负重约束，不会把物品吞掉。",
   "普通采集超重会整次拒绝，不消耗资源。战斗、奇遇、图鉴、灵田等奖励超重时，余物留在当前格，显示「原地待拾」。腾出空间后回到原地点点「拾遗」，或背包内拾取，不会自动飞到仓房。",
   "装备独立占用器囊36格，不计材料重量。器囊满的战利品进入带发现坐标的待领取列表，需要回原地点且腾位才能领取；最多64件待领取，继续溢出的装备转成灵尘。物资不会因为切地图而自动消失或复制。"
  ]
 },
 {
  "id": "gather",
  "title": "采集条件与资源刷新",
  "paragraphs": [
   "草得青藤，枝得灵木，石得低阶灵石；木一次得灵木2，须有粗木斧。矿、灵、铜、火、星使用石镐。鱼需要竹钓竿，药字对应当地药草，具体产物在图鉴查看。",
   "阵纹需炼气二层与12灵力；焰心砂需四层、石镐、10灵力；幽魂砂需五层与12灵力；毒草需五层；雷霆髓需六层与16灵力；残卷需六层与14灵力。特殊地形可能再增加环境耗灵，条件不足会明确提示。",
   "字格下的×N是当天可采次数。采尽保留格位、显示「—」，跨过游戏午夜恢复。每境、坐标和槽位独立保存；切境、建房、迁居不会把已经消耗的节点直接刷满。点自己所在的「我」不是采集。",
   "工具不消耗耐久，不需要装备到武器槽，只需在随身。工具、修为、灵力、负重不达标时，失败不扣时间、物资或节点次数。资源要求与建筑等级是两种不同门槛，不能用高级炼器室代替采矿工具。"

 {
  "id": "survival",
  "title": "吃喝、休息与时间",
  "paragraphs": [
   "普通步行一格耗30分钟、饱腹2、饮水3，不额外耗灵；特定危险地形仍会产生灵力负担。普通采集消耗时间、饱腹2和饮水2，不直接消耗灵力；阵纹、焰心砂等灵性资源及特定危险地形仍需灵力。赤岭每30分钟额外耗水1；幽沼和天阙额外耗灵1。昼夜与资源成长按行动推进，关闭网页不会自动生长。",
   "灵果补22饱腹，水补30饮水，回春散补32气血；辟谷丸补42饱腹和8饮水；灵鱼补28饱腹和6饮水；灵鱼干补45饱腹和12饮水；回灵丹补40灵力。满值时无效消耗会拦截。",
   "野外调息耗50分钟、5饱腹、6饮水；补给过低时不能恢复灵力。自建洞府休息3小时，实际回血回灵按时长、洞府等级和补给水平计算；饱腹与饮水严重不足时无法自然恢复。",
   "在自己的洞府消耗食物1份和清水1份补给，材料可来自本境仓房；也可安睡至18点或次日7点，但气血与灵力不再直接回满。安睡消耗饱腹、饮水与寿元，严重饥渴时只会持续掉血。",
   "饱腹归零每小时至少扣4气血，饮水归零每小时至少扣8气血；缺两项叠加计损，高境人物损失随气血上限增加。灵力耗尽后的强行耗灵也会随时间损伤气血。生命危险时先补给、备药，别反复无补给地安睡。"
  ]
 },
 {
  "id": "forge",
  "title": "炼器室与高级法器",
  "paragraphs": [
   "粗木斧、石镐、竹钓竿和便携回春散、灵鱼干不需要房间；其他剑、衣、探灵符要在自己的炼器室生产。配方所需房间等级与区域开放条件同时成立才可炼制。缺设施或缺材料时不会扣料。",
   "炼器室一阶：桃木灵剑、青藤道袍、妖皮护甲、探灵符，允许精炼+1。二阶：玄铁法剑、碧溪与赤铜武器防具，允许精炼+2。三阶：玄阴与天阙武器防具，允许精炼+3。造二、三阶炼器室还需先升级住所。",
   "合适设施只约束生产和精炼；装备成品只能在对应的炼器室炼出——战斗与秘境不再直接掉落成品，只给灵材、兽皮与灵尘，想要更强的装备就回府炼、回炉精炼。装备不是消耗一次的配方标记，每次炼器会生成独立实例，可比较、穿戴与分解。",
   "把高级材料运回低阶区域生产是可行的，只要房间和配方条件已满足；品质概率仍取决于你生产时所在区域。想在更高品质概率的区域持续刷器，可建设那一境的炼器室，而不是五境共享一个虚拟工坊。"
  ]
 },
 {
  "id": "alchemy",
  "title": "丹房与服丹次数",
  "paragraphs": [
   "丹房一阶制作辟谷丸、回灵丹、凝元丹；二阶制作避火丹、清瘴丹；三阶制作培元丹。部分丹方须先开放相应区域并取得材料。便携回春散不受丹房限制，新人受伤仍有补救途径。",
   "凝元丹配方为止血草3、灵石1，服用增加18修为与20灵力。培元丹配方为玄阴苔2、上古残卷1、碧灵露1，服用增加36修为与30灵力。两种修为丹合计每天最多服2次，跨区域或迁居不能重置次数。达到18层后不再消耗修为丹。",

   "丹药从炼制面板选择丹药分类，材料不足可在图鉴查来源。原地点击房间入口只切换同一个固定浮层，不会打开新网页。本版炼丹不另设随机失败与品质，配方条件达到后稳定产出。"
  ]
 },
 {
  "id": "quiet",
  "title": "静室、灵田与修为",
  "paragraphs": [
   "采集和实战得修为，达到10＋当前层数×5后自动突破。每层基础攻击+1、气血上限+9、灵力上限+2、负重上限+3，最高18层。基础行囊负重46。",
   "未建静室时，在自己的草庐也能吐纳，每次花灵石1和60分钟，得8修为、12灵力。静室一至三阶分别提升为12/16/22修为与24/28/36灵力。所有洞府共用每日3次吐纳，不因换地图重置。",
   "一阶灵田在建成24游戏小时后可收止血草2、灵果2；二阶收止血草3、灵果3、水灵草1。必须回到自己的田收获，满包部分落在当前府格。只积累一批，不会离线刷出多批。",
   "灵田收获后重新计时，升级后从升级完成时重新计时，迁居保留原有计时。新建灵田不能立即领取，反复点击、存读档和重进地图也不能提前领取。静室与灵田是便利选项，不是第一境必造前置。"

 },
 {
  "id": "quest",
  "title": "山门、祭坛与五境",
  "paragraphs": [

   "第二至第五境保留地图上的固定祭坛：碧溪净泉需碧灵露3、碧灵花3、止血草2；赤岭镇火需赤铜晶4、焰心砂2、玄铁矿2；幽沼镇魂需玄阴苔4、幽魂砂2、止血草2；天阙启门需星髓矿4、雷霆髓2、阵纹2。祭坛不能建府，任务材料必须随身带到现场。",

   "不必在每境把全部建筑造满才能打首领。已解锁配方可在具备等级的旧府制作，然后携装备前往新境；新境定居的价值在于休整、补给、独立仓储与更少折返。顶部任务可展开查看材料缺口与首领地点。"
  ]
 },
 {
  "id": "combat",
  "title": "斗法、试剑与负伤",
  "paragraphs": [
   "剑击不额外消耗技能灵力；剑诀需9灵力，基础倍率1.7。真实战斗每回合推进15分钟，并消耗饱腹1、饮水1、灵力2，还会受到地形额外消耗。战斗过程中不能建房、搬仓或跨境。",
   "敌方下次行动提前显示。重击约1.65倍攻击，防守把受击降至25%，回复10灵力并蓄势给下次攻击+4。敌人调息时适合出手。回春散占一个战斗回合；普通敌人撤离有80%成功率，首领不可撤离。",
   "气血为零返回本境自建洞府；尚未定居则退回旧营坪，不因此白送住所。损失一半随身普通材料，保留境界、工具、食物、装备、建筑、仓物、图鉴和进度，不删档。",
   "「修炼 → 试剑」仅在自己的洞府可用。练剑木傀不掉战利品，不得修为，不损失真实食物和药物；结束后还原训练前状态。教程会用这场练习教你识别重击，不能靠它刷宝。"
  ]
 },
 {
  "id": "gear",
  "title": "品质、词条与精炼",
  "paragraphs": [

   "武器词条包括破甲、会心、吸血、术威和焰伤；防具包括护元、回灵和回春。这些词条分别参与破防、暴击、伤害恢复、剑诀倍率、附加伤害、防伤和防守恢复，不是只显示文字。",
   "精炼+1/+2/+3需炼器室至少1/2/3阶，分别花4/8/12灵尘；每一级增加品质折算后基础属性的8%，保留品质与词条。只能在自己的足级炼器室精炼，未穿戴装备可分解，穿戴中的装备不能直接分解。",
   "普通/精良/灵器/法宝/仙器概率按所在境分别为：青岚70/25/5/0/0；碧溪60/30/9/1/0；赤岭50/33/15/2/0；幽沼42/35/19/3.8/0.2；天阙32/36/25/6/1，单位为百分比。首领掉装至少精良，部分遗迹另有保底。"
  ]
 },
 {
  "id": "events",
  "title": "奇遇、遗器与再战",
  "paragraphs": [
   "五境各有两处可重复奇遇，包括隐居石窟、旧匣、灵泉、鱼群、残炉、熔岩遗匣、古冢夜语、阴河渡口、残卷石台与宝库。到达点探查，两项选择只能完成其一；关闭不扣次数，完成后当天不能重复领奖。",

// V90.5 encounter calibration: fixed per-region enemy statistics, never scaled to live player power.
// Index 0-11 maps to the twelve regions; loot, XP, quests and equipment progression are preserved.
const COMBAT_BALANCE={version:'90.5',hp:[1.25,1.35,1.48,1.60,1.70,1.84,1.90,1.90,1.91,1.94,1.98,1.86],
 atk:[1.16,1.25,1.30,1.34,1.38,1.23,1.22,1.18,1.14,1.12,1.10,1.08],
 armor:[1.05,1.06,1.08,1.10,1.12,1.13,1.14,1.15,1.16,1.16,1.17,1.18]};
// One-time data calibration keeps fights deterministic for the same input save/seed.
for(let z=0;z<12;z++){
  const pool=z===0?['rabbit','sprite','wolf','guard']:z===1?['river','fishbeast']:z===2?['firebeast']:z===3?['wraith']:z===4?['sentinel']:['realm'+z];
  for(const id of ['boss'+z,'secretGuard'+z,...pool]){
    const enemy=ENEMIES[id];if(!enemy||enemy.training)continue;
    const boss=id==='boss'+z;
    const hp=COMBAT_BALANCE.hp[z]*(boss?1:z>=8?1.40:z>=5?1.25:.95);
    const atk=COMBAT_BALANCE.atk[z]*(boss?1:.96);
    const armor=COMBAT_BALANCE.armor[z];
    // Early mobs remain approachable; late guardians survive long enough to announce tactics.
    enemy.hp=Math.max(1,Math.round(enemy.hp*hp));
    enemy.atk=Math.max(1,Math.round(enemy.atk*atk));
    enemy.armor=Math.max(0,Math.round(enemy.armor*armor));
  }
}

  const ids=Object.keys(MANUALS).filter(id=>{const m=MANUALS[id];return !this.s.manuals.owned[id]&&(m.race==='any'||m.race===this.s.character)&&m.major<=Math.max(0,this.s.major+1);});
  if(!ids.length)return null;
  const index=(this.s.zone+(source==='boss'?3:0))%ids.length;
  const m=MANUALS[ids[index]];this.manualGrant(m.id,source==='boss'?'首领遗卷':'秘境传承');return m.id;
 }
 manualStudy(id){const m=MANUALS[id],v=this.s.manuals;if(!m||!v.owned[id])return this.fail('尚未获得此功法');
  if(!this.atCamp)return this.fail('需回本境洞府静修参悟');if(this.s.combat||this.s.secretRealm)return this.fail('斗法或秘境中无法参悟');
  if(this.s.major<m.major)return this.fail('学习境界不足：需'+(D.REALMS[m.major]||'对应境界'));
  if(v.study[id]>=m.study)return this.note('已经参透《'+m.name+'》');
  const cost={stone:1};if(!this.enough(cost))return this.fail('参悟需要灵石1');
  if(!this.tick(45,1,1,3))return {ok:false};this.spend(cost);v.study[id]++;this.log('参悟《'+m.name+'》 '+v.study[id]+'/'+m.study,'good');return this.note('参悟进度 '+v.study[id]+'/'+m.study,'ok');
 }
 manualEquip(id){const m=MANUALS[id],v=this.s.manuals;if(!m||!v.owned[id]||v.study[id]<m.study||this.s.major<m.major)return this.fail('尚未满足功法装备条件');
  if(this.s.combat)return this.fail('战斗中不能更换功法');v.equipped[m.slot]=id;return this.note('已配置《'+m.name+'》到'+m.type+'槽','ok');
 }
 manualUnequip(slot){if(!['attack','guard','utility'].includes(slot)||this.s.combat)return this.fail('当前不能卸下功法');this.s.manuals.equipped[slot]=null;return this.note('已卸下功法','ok');}
 manualJoin(id){
  const factions={sword:'青霄剑宗',herb:'百草丹谷',thunder:'玄雷道宫',beast:'万灵山庭'};
  if(!factions[id])return this.fail('未知宗门');
  if(this.s.combat||this.s.secretRealm||!['sect','bazaar'].includes(this.land()))return this.fail('请前往青岚山间坊市的宗门驻点入门');
  if(this.s.manuals.sect)return this.fail('已加入宗门：不可任意更换');
  if(id==='beast'&&this.s.character!=='demon')return this.fail('万灵山庭目前仅招收妖族');
  const cost={wood:1};if(!this.enough(cost))return this.fail('入门考核需提交灵木1');
  if(!this.tick(60,2,2,3))return {ok:false};this.spend(cost);this.s.manuals.sect=id;this.s.manuals.contribution=3;
  this.log('拜入'+factions[id]+' · 初获贡献3','good');return this.note('已拜入'+factions[id]+' · 可兑换功法','ok');
 }
 manualSect(){if(this.s.combat||this.s.secretRealm||!['sect','bazaar'].includes(this.land()))return this.fail('请前往青岚山间坊市的宗门驻点请教');
  if(!this.s.manuals.sect)return this.fail('请先参加入门考核、拜入宗门');
  const sectIds={sword:['wind','step','void','sky'],herb:['green','moon','life','turtle'],thunder:['turtle','fire','thunder','sky'],beast:['green','blood','step','iron','life']};
  const options=(sectIds[this.s.manuals.sect]||[]).map(id=>MANUALS[id]).filter(m=>m&&m.major<=this.s.major&&(m.race==='any'||m.race===this.s.character)&&!this.s.manuals.owned[m.id]);
  if(!options.length)return this.note('本境宗门暂无新的可传功法');
  const m=options[0],price={stone:3};if(this.s.manuals.contribution<3)return this.fail('宗门贡献不足3点，可通过采集和战斗积累');if(!this.enough(price))return this.fail('藏经阁传功需要灵石3');
  if(!this.tick(60,2,2,3))return {ok:false};this.spend(price);this.s.manuals.contribution-=3;return this.manualGrant(m.id,'宗门藏经阁');
 }
 bloodAbsorb(id){
  if(this.s.character!=='demon')return this.fail('仅妖族能够吞噬血脉');
  if(this.s.combat||this.s.secretRealm||!this.atCamp)return this.fail('请返回本境洞府安稳炼化精血');
  const m=MANUALS[id],v=this.s.manuals,b=this.s.blood;
  if(!m||m.race!=='demon')return this.fail('未知妖族血脉');
  if(this.s.major<m.major)return this.fail('境界不足，妖躯不能承受此血脉');
  if(v.owned[id])return this.note('已觉醒本命神通《'+m.name+'》');
  const price=2+Math.max(0,m.major)*2;
  if(b.essence<price)return this.fail('精血不足，需要'+price+'，现有'+b.essence);
  if(!this.tick(45,2,2,3))return {ok:false};
  b.essence-=price;b.absorbed+=price;b.stage=Math.min(9,Math.floor(b.absorbed/9));
  v.owned[id]=true;v.known[id]=true;v.study[id]=m.study;
  this.log('妖躯吞噬精血，觉醒《'+m.name+'》','good');
  return this.note('血脉觉醒 · '+m.name+' · 可配置本命神通','ok','unlock');
 }
 manualCast(slot){const id=this.s.manuals.equipped[slot],m=MANUALS[id],b=this.s.combat;
  if(!b||!m||m.slot!==slot||this.s.manuals.study[id]<m.study)return this.fail('未装备可用功法');
  if((b.cooldowns?.[id]||0)>b.turn)return this.fail('功法尚在冷却');if(this.s.spirit<m.spirit)return this.fail('灵力不足，需'+m.spirit);
  return {id,m};
 }
 // 境界法门只消耗已有物资；旧存档不加新必填字段。
 realmArt(id){
  if(this.s.combat||!this.atCamp)return this.fail('境界法门须回本境洞府施展');
  if(this.s.ascended)return this.fail('已飞升，法门修行暂歇');
  const defs={
   sustain:{name:'炼气·调和五谷',major:0,cost:{stone:1},limit:1,minutes:30},
   ward:{name:'筑基·护元调息',major:1,cost:{stone:2},limit:1,minutes:45},
   insight:{name:'金丹·凝神参道',major:2,cost:{stone:2},limit:2,minutes:75}
  },r=defs[id];
  if(!r)return this.fail('未知境界法门');
  if(this.s.major<r.major)return this.fail('境界不足：'+r.name);
  const rec=this.s.flags.realmArts||{day:0,counts:{}};
  const count=rec.day===this.day?(rec.counts[id]||0):0;
  if(count>=r.limit)return this.fail('今日此法门已达使用上限');
  if(!this.enough(r.cost))return this.fail(this.missing(r.cost));
  const startDay=this.day;
  if(!this.tick(r.minutes,2,2,2))return {ok:false};
  this.spend(r.cost);
  const next=this.s.flags.realmArts?.day===startDay?this.s.flags.realmArts:{day:startDay,counts:{}};
  next.counts[id]=(next.counts[id]||0)+1;this.s.flags.realmArts=next;
  if(id==='sustain'){
   this.s.hunger=Math.min(100,this.s.hunger+28);this.s.water=Math.min(100,this.s.water+28);
  }else if(id==='ward'){
   this.s.hp=Math.min(this.s.maxHp,this.s.hp+Math.ceil(this.s.maxHp*.38));
   this.s.spirit=Math.min(this.s.maxSpirit,this.s.spirit+Math.ceil(this.s.maxSpirit*.32));
  }else{
   this.xp(22+this.s.major*5);this.s.spirit=Math.min(this.s.maxSpirit,this.s.spirit+18);
  }
  return this.note('施展'+r.name+' · 消耗灵石'+r.cost.stone,'ok');
 }
 // P3: scripted thunder ordeal reuses the existing lifespan, exhaustion and defeat machinery.
 // The old breakthrough material cost is paid only by breakthrough(), never by these choices.
 get coreTrial(){return this.s.flags.coreTribulation||{phase:0,marks:0,started:false,complete:false};}
 coreTrialReason(){
  const s=this.s,t=D.ASCENSION_STAGES[0];
  if(s.combat||s.secretRealm)return '斗法或秘境中不能应劫';
  if(s.zone!==5||s.major!==1||s.ascended)return '此试炼仅限丹霞雷渊的筑基后期／通脉后期';
  if(!s.ritual[5]||!s.cleared[5])return '需先完成丹霞问道坛与结丹雷蛟试炼';
  if(s.level<18)return '需要修至筑基／通脉后期（累计18级）';
  if(!this.atCamp)return '需先回丹霞雷渊自己的洞府';
  if(s.daoXp<t.needDao)return '道行不足：'+s.daoXp+'/'+t.needDao;
  const cost={[t.primary]:2,[t.secondary]:1};
  if(!this.enough(cost))return '原破境道材尚未备齐：'+this.missing(cost);
  if(s.hunger<=2||s.water<=2)return '饱腹或饮水太低，请先用餐与补水，以免应劫时额外饥渴扣血';
  if(!this.coreTrial.started&&!this.coreTrial.complete&&s.spirit<3)return '启劫至少需要灵力3，请先调息';
  return '';
 }
 coreTrialDamage(mode){
  const state=this.coreTrial,phase=state.phase;
  if(!['ward','channel','endure'].includes(mode)||phase<0||phase>2)return 0;
  const base=Math.ceil(this.s.maxHp*[.18,.29,.42][phase]);
  const factor={ward:.34,channel:.64,endure:1}[mode];
  const humanGuard=this.s.character==='human'&&!!this.s.manuals?.equipped?.guard?.length;
  const demonBlood=this.s.character==='demon'?Math.min(.13,Math.max(0,(this.s.blood?.stage||0))*.025):0;
  const mitigation=Math.min(.25,(humanGuard?.10:0)+demonBlood+(state.marks||0)*.045);
  const armor=Math.min(11,Math.floor(this.armor*.055));
  return Math.max(1,Math.ceil(base*factor*(1-mitigation)-armor));
 }
 coreTrialStart(){
  const reason=this.coreTrialReason();if(reason)return this.fail(reason);
  if(this.coreTrial.complete)return this.fail('本世丹劫已经通过，直接回修炼界面破境即可');
  if(this.coreTrial.started)return this.fail('雷劫已经开始，请继续当前轮次');
  if(this.s.spirit<3)return this.fail('启劫需灵力3，请先调息');
  if(!this.tick(30,1,1,3))return {ok:false};
  this.s.flags.coreTribulation={phase:0,marks:0,started:true,complete:false};
  this.log(this.s.character==='demon'?'妖丹血雷已至，妖躯接受三重雷考。':'凝丹天雷已至，金丹接受三重雷考。','good');
  return this.note('雷劫开启 · 第一重雷息已现，可预测伤害后再选应对','warn');
 }
 coreTrialAct(mode){
  const reason=this.coreTrialReason();if(reason)return this.fail(reason);
  const trial=this.coreTrial;
  if(trial.complete)return this.fail('丹劫已平，可直接破境');
  if(!trial.started)return this.fail('请先引雷启劫，再选择承雷方式');
  if(trial.phase>=3)return this.fail('雷劫轮次已结束');
  if(!['ward','channel','endure'].includes(mode))return this.fail('无效雷劫应对');
  const spirit={ward:16,channel:9,endure:2}[mode];
  if(this.s.spirit<spirit)return this.fail('本次应劫需要灵力'+spirit+'，当前不足。可先回洞府调息再继续');
  const harm=this.coreTrialDamage(mode);
  if(!this.tick(50,2,2,spirit)){
   this.s.flags.coreTribulation={phase:0,marks:0,started:false,complete:false};return {ok:false};
  }
  this.s.hp-=harm;
  const names={ward:'护元承雷',channel:'纳雷淬丹',endure:'以躯硬抗'};
  this.log('凝丹雷劫 · 第'+(trial.phase+1)+'重 · '+names[mode]+'，气血-'+harm,'good');
  if(this.s.hp<=0){
   this.s.flags.coreTribulation={phase:0,marks:0,started:false,complete:false};
   this.collapse();
   return this.note('雷劫失利 · 沿用原重伤折寿；恢复后可重新试炼','warn');
  }
  trial.phase++;
  if(mode==='channel'||mode==='endure')trial.marks=Math.min(3,trial.marks+1);
  if(trial.phase===3){
   trial.complete=true;
   this.log('凝丹雷劫三重已过 · 丹息稳固，可以回府正式破境。','good');
   return this.note('三重丹劫已渡 · 现在可以依原成本破境','ok','unlock');
  }
  return this.note('第'+trial.phase+'重已渡 · 丹纹'+trial.marks+'，下一重雷息将至','ok');
 }
 // P4: three layers of mind-ordeal, using existing time, spirit, hunger, HP and loss rules.
 get heartTrial(){return this.s.flags.heartTrial||{phase:0,started:false,complete:false,choices:[]};}
 heartTrialReason(){
  const s=this.s,t=D.ASCENSION_STAGES[1];
  if(s.combat||s.secretRealm)return '斗法或秘境中无法问心';
  if(s.zone!==6||s.major!==2||s.ascended)return '须在婴灵古墟金丹／妖丹圆满后问心';
  if(!s.ritual[6]||!s.cleared[6])return '先修复婴灵问道坛并击败夺舍魂君';
  if(s.level<18)return '需修至筑基后期及以上';
  if(!this.atCamp)return '须回婴灵古墟本境洞府';
  if(s.daoXp<t.needDao)return '道行不足：'+s.daoXp+'/'+t.needDao;
  const cost={[t.primary]:2,[t.secondary]:1};
  if(!this.enough(cost))return '突破道材不足：'+this.missing(cost);
  if(s.hunger<=3||s.water<=3)return '饱腹／饮水不足，先补给再问心';
  if(!this.heartTrial.started&&!this.heartTrial.complete&&s.spirit<3)return '启问心需要灵力3';
  return '';
 }
 heartTrialPreview(mode){
  const phase=this.heartTrial.phase,base=Math.ceil(this.s.maxHp*[.11,.17,.23][Math.min(2,phase)]);
  const rate={observe:.42,anchor:.18,force:.8}[mode];
  if(rate===undefined)return 0;
  const subtle=this.s.flags.steleChoice===1&&phase===0&&mode==='observe'?3:0;
  const blood=this.s.character==='demon'&&mode==='anchor'?Math.min(7,this.s.blood?.stage||0):0;
  return Math.max(1,Math.ceil(base*rate)-subtle-blood);
 }
 heartTrialStart(){
  const reason=this.heartTrialReason();if(reason)return this.fail(reason);
  if(this.heartTrial.complete)return this.fail('问心三重已完成');
  if(this.heartTrial.started)return this.fail('心劫尚在，请继续当前幻象');
  if(!this.tick(25,1,1,3))return {ok:false};
  this.s.flags.heartTrial={phase:0,started:true,complete:false,choices:[]};
  this.log('婴灵古墟 · 第一重问心幻象出现。','good');
  return this.note('问心已开启，可离开洞府休整后再继续','ok');
 }
 heartTrialAct(mode){
  const reason=this.heartTrialReason();if(reason)return this.fail(reason);
  const state=this.heartTrial;
  if(!state.started||state.complete||state.phase>=3)return this.fail('当前没有可应对的问心幻象');
  const cost={observe:5,anchor:11,force:2}[mode];
  if(cost===undefined)return this.fail('未知问心抉择');
  if(this.s.spirit<cost)return this.fail('灵力不足，回府调息可继续当前层');
  const harm=this.heartTrialPreview(mode);
  if(!this.tick(40,2,2,cost))return {ok:false};
  this.s.hp-=harm;
  this.log('问心第'+(state.phase+1)+'重 · '+({observe:'辨真','anchor':'守心','force':'强破'}[mode])+'；气血-'+harm,'good');
  if(this.s.hp<=0){this.s.flags.heartTrial={phase:0,started:false,complete:false,choices:[]};this.collapse();return this.note('问心失利，沿用原有重伤折寿；恢复后可重试','warn');}
  state.choices.push(mode);state.phase++;
  if(state.phase===3){state.complete=true;this.log('三重问心皆过，元婴根基已稳。','good');return this.note('问心已通过，返回修炼按原有道材与时间破境','ok','unlock');}
  return this.note('已辨第'+state.phase+'重幻象，下一重可在休整后继续','ok');
 }

 // P5: a completely optional two-fold spatial detour on the original voidRift tile.
 get voidRift(){return this.s.flags.voidRift||{phase:0,complete:false,steps:[]};}
 riftReason(){
  const s=this.s;
  if(s.combat||s.secretRealm)return '先结束斗法或退出秘境，再观察裂隙';
  if(s.ended)return '此世修行已终结';
  if(s.zone!==8||s.pos.x!==2||s.pos.y!==4||s.major<4)return '需到炼虚裂隙第3列第5行的折界隙眼，并先具备化神修为';
  return '';
 }
 riftBearing(phase=this.voidRift.phase){
  return ((this.s.seed+phase)%2===0)?'left':'right';
 }
 riftPreview(mode){
  const phase=this.voidRift.phase;
  if(phase<1||phase>2||this.voidRift.complete)return null;
  if(!['left','right','anchor','force'].includes(mode))return null;
  const safe=this.riftBearing(phase),base=Math.ceil(this.s.maxHp*(phase===1?.10:.14));
  const aligned=mode===safe,spirit=mode==='anchor'?5:mode==='force'?2:10;
  const damage=mode==='anchor'
   ?Math.max(1,Math.ceil(base*.24)-Math.floor(this.armor*.025))
   :mode==='force'
   ?Math.max(12,Math.ceil(base*2.6)-Math.floor(this.armor*.07))
   :aligned
   ?Math.max(1,Math.ceil(base*.52)-Math.floor(this.armor*.05))
   :Math.max(8,Math.ceil(base*1.8)-Math.floor(this.armor*.07));
  return {damage,spirit,stone:mode==='anchor'?1:0,aligned,minutes:40,hunger:2,water:2};
 }
 riftScout(){
  const why=this.riftReason();if(why)return this.fail(why);
  if(this.voidRift.complete)return this.fail('两层空间隙路已经勘明，无须重复领取线索');
  if(this.voidRift.phase>0)return this.note('裂隙坐标已刻录，继续当前层即可');
  if(this.s.spirit<=4||this.s.hunger<=4||this.s.water<=4)return this.fail('勘察需灵力大于4且饱腹、饮水均大于4；请先补给，避免额外饥渴损伤');
  if(!this.tick(15,1,1,4))return {ok:false};
  this.s.flags.voidRift={phase:1,complete:false,steps:[]};
  this.log('折界隙眼 · 首次观潮。两层折痕的稳向已显露，随时可退。','good');
  return this.note('空间潮汐已辨：请选择第一层路线，亦可无代价撤离','ok');
 }
 riftAct(mode){
  const why=this.riftReason();if(why)return this.fail(why);
  const state=this.voidRift,preview=this.riftPreview(mode);
  if(!preview)return this.fail('尚未观潮或空间隙路已完成，请先观察当前线索');
  if(this.s.spirit<=preview.spirit)return this.fail('本次需灵力'+preview.spirit+'且必须保留1点余力，先调息再进入');
  if(this.s.hunger<=4||this.s.water<=4)return this.fail('饱腹与饮水需均大于4；先补给再跨越，避免未预告的饥渴损伤');
  if(preview.stone&&!this.enough({voidStone:1}))return this.fail('定锚需要随身或当前可用仓储的虚空石×1');
  if(!this.tick(preview.minutes,preview.hunger,preview.water,preview.spirit))return {ok:false};
  if(preview.stone)this.spend({voidStone:1});
  this.s.hp-=preview.damage;
  const label={left:'循左折光',right:'循右折光',anchor:'虚空石定锚',force:'强破缝隙'}[mode];
  this.log('折界隙眼 · 第'+state.phase+'层 · '+label+'，灵力-'+preview.spirit+'，气血-'+preview.damage,'good');
  if(this.s.hp<=0){
   this.s.flags.voidRift={phase:0,complete:false,steps:[]};
   this.collapse();
   return this.note('折界失步 · 按原有规则重伤折寿，空间进度重置；恢复后可再来','warn');
  }
  state.steps.push(mode);state.phase++;
  if(state.phase===3){
   state.complete=true;
   this.loot({riftEssence:1},'折界隙眼·裂痕余髓');
   this.log('两重错位隙路已破，寻得裂界髓一份；此地不再重复发放。','good');
   return this.note('折界归位 · 获得裂界髓×1（如负重不足则留在原地）；不影响原破境与首领','ok','unlock');
  }
  return this.note('第一层已通过，空间回潮已换向；可撤离修整并保留进度','ok');
 }

 // P6: static three-scroll puzzle. Two independent proofs remove forgeries;
 // the authentic name is seed-bound, not tied to a permanent bonus or a fixed race advantage.
 get mirrorTrial(){return this.s.flags.mirrorTrial||{started:false,clues:[],rejected:[],complete:false,choice:null,lockedUntil:0};}
 mirrorTruthIndex(){return (this.s.seed+(this.s.character==='demon'?1:0))%D.MIRROR_SCROLLS.length;}
 mirrorTruth(){return D.MIRROR_SCROLLS[this.mirrorTruthIndex()].id;}
 mirrorReason(){
  const s=this.s;
  if(s.combat||s.secretRealm)return '斗法或秘境中不可静观古镜';
  if(s.ended)return '此世修行已终结';
  if(s.zone!==7||s.pos.x!==3||s.pos.y!==3||s.major<3)return '请先具备元婴／化形修为，并到化神云海第4列第4行的镜台';
  return '';
 }
 mirrorProof(kind){
  const i=this.mirrorTruthIndex(),scrolls=D.MIRROR_SCROLLS;
  const fake=scrolls[(i+(kind==='seal'?1:2))%scrolls.length];
  if(kind==='seal')return '阵痕背面一笔错写：'+fake.name+'的落款被后人补刻，断口压在旧天阙原印之上。它虽字句工整，却是假传承。';
  if(kind==='echo')return '镜中残音错称「问心先于丹雷」，与古修次序相悖。残音正来自'+fake.name+'，那道回声并非先师真言。';
  return '';
 }
 mirrorHarm(){return Math.max(12,Math.ceil(this.s.maxHp*.16)-Math.floor(this.armor*.045));}
 mirrorCostReady(sp,h=2,w=2){
  if(this.s.spirit<=sp)return '灵力不足：需要'+sp+'点并保留至少1点余力，可先回府调息';
  if(this.s.hunger<=h+1||this.s.water<=w+1)return '饱腹与饮水不足，请先补给以免产生额外隐性伤害';
  return '';
 }
 mirrorBegin(){
  const why=this.mirrorReason();if(why)return this.fail(why);
  const state=this.mirrorTrial;
  if(state.complete)return this.fail('镜中真传已辨识，不可重复探查领取');
  if(state.started)return this.fail('镜台已观，请检查印痕与残音');
  const cost=this.mirrorCostReady(4,1,1);if(cost)return this.fail(cost);
  if(!this.tick(15,1,1,4))return {ok:false};
  this.s.flags.mirrorTrial={started:true,clues:[],rejected:[],complete:false,choice:null,lockedUntil:0};
  this.log('映心镜台浮出三道古修残卷。欲辨真传，须先核对阵印与残音。','good');
  return this.note('三卷皆似旧迹 · 先取证，再判断','ok');
 }
 mirrorInspect(kind){
  const why=this.mirrorReason();if(why)return this.fail(why);
  const state=this.mirrorTrial;
  if(!state.started||state.complete)return this.fail('先启镜台，已完成的真传不可反复探查');
  if(!['seal','echo'].includes(kind))return this.fail('未知的镜台证据');
  if(state.clues.includes(kind))return this.fail('此条证据已记入见闻，无需重复耗灵');
  const cost=this.mirrorCostReady(7,1,1);if(cost)return this.fail(cost);
  if(!this.tick(25,1,1,7))return {ok:false};
  state.clues.push(kind);
  this.log('映心镜台 · '+(kind==='seal'?'印痕考证':'残音核验')+'：'+this.mirrorProof(kind),'good');
  return this.note('已经辨出一份伪卷；'+(state.clues.length===2?'两份证据已齐，可判断真传':'仍需另一条独立证据'),'ok');
 }
 mirrorChoose(id){
  const why=this.mirrorReason();if(why)return this.fail(why);
  const state=this.mirrorTrial,known=D.MIRROR_SCROLLS.some(q=>q.id===id);
  if(!known)return this.fail('请选择镜台上现存的一部残卷');
  if(state.complete)return this.fail('此镜台已经辨得真传，奖励仅能领取一次');
  if(!state.started||state.clues.length!==2)return this.fail('须核验阵印与残音两份证据，不能凭空猜选');
  if(state.rejected.includes(id))return this.fail('此前已证伪此卷，无需重复冒险');
  if(this.day<state.lockedUntil)return this.fail('错镜封禁至第'+state.lockedUntil+'日，请先离开休整');
  const cost=this.mirrorCostReady(10,2,2);if(cost)return this.fail(cost);
  if(!this.tick(35,2,2,10))return {ok:false};
  if(id===this.mirrorTruth()){
   state.choice=id;state.complete=true;state.lockedUntil=0;
   this.loot({godFruit:1,ancient:1},'云海镜台·真传残卷');
   this.log('真镜留文：上古天阙以幻镜掩住断裂仙路，假传承乃后世借灾变伪刻；线索已入第五星卷。','good');
   return this.note('辨真成功 · 化神果×1、上古残卷×1（负重不足则原地待拾）；不新增永久战力','ok','unlock');
  }
  const hit=this.mirrorHarm();
  state.rejected.push(id);state.lockedUntil=this.day+1;
  this.s.hp-=hit;
  this.log('误信伪传承 · 神识受镜火反噬，气血−'+hit+'。留待次日再问。','bad');
  if(this.s.hp<=0){
   this.collapse();
   state.lockedUntil=this.day+1;
   return this.note('镜火反噬重伤 · 沿用原战败折寿；证据仍保留，次日可再探','warn');
  }
  return this.note('伪卷已记入错案，气血−'+hit+'，次日可再判断；你仍保有两条证据','warn');
 }

 // P7: two connected optional stories; never infer player memories from mere region unlocks.
 get karmaWitness(){return this.s.flags.karmaWitness||{stage:0,choice:0};}
 get karmaReckoning(){return this.s.flags.karmaReckoning||{ending:0,origin:0,source:0};}
 karmaReason(place){

  const p=place==='marsh'?{x:3,y:6}:place==='city'?{x:3,y:3}:null;

  if(place==='city'&&this.s.major<5)return '合体仙城的旧印追索须待炼虚境之后方能面见';
  return '';
 }
 karmaActionCost(sp,minutes){
  const region=this.extra(minutes);
  return {spirit:sp+region.spirit,water:region.water};
 }
 karmaReady(sp,h=1,w=1,minutes=0){
  const cost=this.karmaActionCost(sp,minutes);
  if(this.s.spirit<=cost.spirit)return '此行至少需要灵力'+(cost.spirit+1)+'（含当地环境耗灵），请先补足余力';
  if(this.s.hunger<=h+1||this.s.water<=w+cost.water+1)return '请先补给饱腹与饮水，避免未经预告的饥渴损伤';
  return '';
 }
 karmaOldMemory(){

  if(choice===2)return '你确曾从青岚失名碑取走护符。残灯与符背古纹相互感应，但这并不证明旧印司就该追杀你。';
  return '你从未在青岚失名碑作出守碑或取符的抉择。灯下旧事只是一段陌生证词，不能说成你当年的誓言。';
 }
 karmaRead(){
  const why=this.karmaReason('marsh');if(why)return this.fail(why);
  if(this.karmaWitness.stage!==0)return this.fail('残灯已查明，往事可以重读，但不会重复消耗或领奖');
  const supply=this.karmaReady(4,1,1,20);if(supply)return this.fail(supply);
  if(!this.tick(20,1,1,4))return {ok:false};

  return this.note('残灯证词已经照见 · 可择留下原证或收存魂印，不必立刻作答','ok');
 }
 karmaWitnessChoose(choice){
  const why=this.karmaReason('marsh');if(why)return this.fail(why);
  if(this.karmaWitness.stage!==1)return this.fail(this.karmaWitness.stage===2?'玄阴一誓已定，不能重选并领取':'先点亮残灯，读完旧证再作取舍');
  if(![1,2].includes(choice))return this.fail('未知的旧证取舍');
  const cost=choice===1?{herb:1}:{stone:1},sp=choice===1?6:4,time=choice===1?35:30;
  if(!this.enough(cost))return this.fail('本次取舍还缺：'+this.missing(cost));
  const supply=this.karmaReady(sp,1,1,time);if(supply)return this.fail(supply);
  if(!this.tick(time,1,1,sp))return {ok:false};
  this.spend(cost);
  this.s.flags.karmaWitness={stage:2,choice};
  if(choice===1){
   this.loot({rune:1},'渡魂残灯·守证者所留阵纹');
   this.log('你以药草护存旧印司证言，并允将真相留给后世。','good');
   return this.note('证言已保存 · 古阵残纹×1（如超重则原地待拾），可在未来向旧印司后裔出示','ok','unlock');
  }
  this.loot({dust:2},'渡魂残灯·封魂余尘');
  this.log('你以灵石封下追魂印，不曾代亡者作证；印中仍有可核对的旧纹。','good');
  return this.note('追魂印已封 · 灵尘×2（如超重则原地待拾），后续可选择交印或拒索','ok','unlock');
 }
 karmaReconcileCost(){
  const stele=this.s.flags.steleChoice||0,witness=this.karmaWitness.choice;
  return {herb:1+(witness===2?1:0)+(stele===1?0:1)};
 }
 karmaDefyDamage(){
  const stele=this.s.flags.steleChoice||0,witness=this.karmaWitness.choice;
  const factor=stele===2&&witness===2?.10:witness===2?.13:.18;
  return Math.max(12,Math.ceil(this.s.maxHp*factor)-Math.floor(this.armor*.035));
 }
 karmaEndingStory(){
  const end=this.karmaReckoning;
  if(!end.ending)return '';
  const prior=end.origin===1?'你昔日守下的亡者名讳成为核验的最后一笔。':end.origin===2?'对方最终承认你当年取下护符，曾令旧印流散。':'你当年未与青岚断碑订立誓约，今日只凭玄阴的确凿见证交涉。';
  if(end.ending===1)return prior+(end.source===1?'你出示保存的完整证言，旧印司后裔放弃寻仇，将古修往事归入城中史册。':'你当场解开封魂印并补交见证，旧印司后裔收手，答应不再为追符而杀。');
  return prior+(end.source===2?'你持魂印破解追索阵，迫使后裔退让，但彼此的旧账没有真正化解。':'你带着完整证词拒绝和解，破开追索阵脱身；追索虽暂止，旧怨尚在。');
 }
 karmaConclude(mode){
  const why=this.karmaReason('city');if(why)return this.fail(why);
  if(this.karmaReckoning.ending)return this.fail('这段城中因果已成定局，不能反悔、改选或重复获得旧物');
  if(this.karmaWitness.stage!==2)return this.fail('你尚未在玄阴渡魂残灯留下真实的证言或魂印。请先亲历该支线；原主线不受限制');
  if(!['reconcile','defy'].includes(mode))return this.fail('未知的追索处理方式');
  const agree=mode==='reconcile',sp=agree?6:10,time=agree?40:45;
  const supply=this.karmaReady(sp,2,2,time);if(supply)return this.fail(supply);
  const item=agree?this.karmaReconcileCost():null;
  if(item&&!this.enough(item))return this.fail('呈证和解需交止血草：'+this.missing(item));
  if(!this.tick(time,2,2,sp))return {ok:false};
  if(agree)this.spend(item);
  else{
   const harm=this.karmaDefyDamage();
   this.s.hp-=harm;
   this.log('旧印追索阵反扑，你决意拒索；气血-'+harm,'bad');
   if(this.s.hp<=0){
    this.collapse();
    return this.note('此回拒索失利 · 沿用原重伤折寿，旧案尚未结清，可恢复后再择','warn');
   }

  this.log('合体仙城 · '+(agree?'呈证止怨':'持印拒索')+'。'+this.karmaEndingStory(),'good');
  return this.note(agree?'追索已止，因果和解 · 上古残卷×1':'破阵脱身，旧怨未了 · 灵尘×2','ok','unlock');
 }

 // P8: one irrevocable Dao vow, with replay-safe staged costs and no permanent combat multiplier.
 get daoStele(){return this.s.flags.daoStele||{phase:0,path:null,complete:false,roots:{stele:0,mirror:false,karma:0}};}
 daoReason(){
  const s=this.s;
  if(s.combat||s.secretRealm)return '斗法或秘境中不可观大道残碑';
  if(s.ended)return '本世修行已终结';
  if(s.zone!==10||s.pos.x!==3||s.pos.y!==3||s.major<6)return '请先修至合体／妖尊之境，亲临大乘古道第4列第4行的残碑';
  return '';
 }
 daoCurrentRoots(){
  return {stele:this.s.flags.steleChoice||0,mirror:!!this.s.flags.mirrorTrial?.complete,karma:this.s.flags.karmaReckoning?.ending||0};
 }
 daoRoots(){return this.daoStele.phase>=2?this.daoStele.roots:this.daoCurrentRoots();}
 daoEchoes(){
  const v=this.daoRoots();
  return [
   v.stele===1?'青岚旧碑：当年你护存失名古修的名讳，古碑认得那段记忆。':v.stele===2?'青岚旧碑：当年你取走失名护符，碑面留有被揭下的旧纹。':'青岚旧碑：你没有在失名碑作过抉择，此处不将未做之事写作誓言。',
   v.mirror?'云海幻镜：你曾核实两条线索并识破伪传承。':'云海幻镜：你尚未取得真正的辨伪记录，不会因此丧失问道资格。',
   v.karma===1?'合体旧债：你已凭真实证据止息后裔追索。':v.karma===2?'合体旧债：你曾持印破阵脱身，双方旧怨仍未尽释。':'合体旧债：你没有结清旧印司之事，碑不会替你虚构和解。'
  ];
 }
 daoActionCost(sp,minutes){const e=this.extra(minutes);return {spirit:sp+e.spirit,water:e.water};}
 daoReady(sp,minutes,h,w){
  const e=this.daoActionCost(sp,minutes);
  if(this.s.spirit<=e.spirit)return '灵力不足：本次需'+e.spirit+'点（含环境耗灵）并留有一点余力';
  if(this.s.hunger<=h+1||this.s.water<=w+e.water+1)return '请先补充食物与饮水，以免行动出现额外饥渴损伤';
  return '';
 }
 daoPreview(path){
  if(!D.DAO_PATHS.some(q=>q.id===path))return null;
  const roots=this.daoStele.phase>=2?this.daoStele.roots:this.daoCurrentRoots();
  const preview=path==='preserve'?
   {name:'守铭道',cost:{ancient:1},spirit:roots.stele===1?7:9,minutes:45,hunger:2,water:2,damage:0,loot:{mahayaRune:1}}:
   path==='discern'?
   {name:'照妄道',cost:{mahayaJade:1},spirit:7,minutes:45,hunger:2,water:2,damage:Math.max(8,Math.ceil(this.s.maxHp*(roots.mirror?.07:.12))-Math.floor(this.armor*.04)),loot:{mahayaRune:1,ancient:1}}:
   {name:'归缘道',cost:{herb:roots.karma===1?1:2},spirit:11,minutes:50,hunger:2,water:2,damage:0,loot:{mahayaJade:1}};
  return {...preview,spirit:this.daoActionCost(preview.spirit,preview.minutes).spirit};
 }
 daoRead(){
  const why=this.daoReason();if(why)return this.fail(why);
  if(this.daoStele.phase!==0)return this.fail('残碑已经读过，本轮不重复消耗或领取');
  const can=this.daoReady(4,20,1,1);if(can)return this.fail(can);
  if(!this.tick(20,1,1,4))return {ok:false};
  this.s.flags.daoStele={phase:1,path:null,complete:false,roots:{stele:0,mirror:false,karma:0}};
  this.log('大乘残碑 · 三途同源，却不能同时为誓。旧事以你真正经历为据。','good');
  return this.note('古碑已读 · 可从守铭、照妄、归缘中选择一条道途','ok');
 }
 daoChoose(path){
  const why=this.daoReason();if(why)return this.fail(why);
  if(!D.DAO_PATHS.some(q=>q.id===path))return this.fail('此处没有该种道誓');
  if(this.daoStele.phase!==1)return this.fail(this.daoStele.phase<1?'先观碑，读懂三条路的取舍':'道誓已立，不能改投他途');
  const can=this.daoReady(3,20,1,1);if(can)return this.fail(can);
  if(!this.tick(20,1,1,3))return {ok:false};
  const roots=this.daoCurrentRoots();
  this.s.flags.daoStele={phase:2,path,complete:false,roots};
  const info=D.DAO_PATHS.find(q=>q.id===path);
  this.log('大道残碑 · 立下「'+info.name+'」之誓。此时的旧碑、云镜与因果记录已定，不随后来补做支线而改写。','good');
  return this.note('已择'+info.name+' · 可撤离准备材料后再来履行，三途不可重选','ok','unlock');
 }
 daoFulfill(){
  const why=this.daoReason();if(why)return this.fail(why);
  const vow=this.daoStele;
  if(vow.complete||vow.phase===3)return this.fail('此生道誓已完成，不能重复领取');
  if(vow.phase!==2||!vow.path)return this.fail('须先读碑并确定一条不可更改的道途');
  const p=this.daoPreview(vow.path);
  const whyCost=this.daoReady(p.spirit-this.extra(p.minutes).spirit,p.minutes,p.hunger,p.water);
  if(whyCost)return this.fail(whyCost);
  if(!this.enough(p.cost))return this.fail('履誓所需道材不足：'+this.missing(p.cost));
  if(!this.tick(p.minutes,p.hunger,p.water,p.spirit-this.extra(p.minutes).spirit))return {ok:false};
  this.spend(p.cost);
  if(p.damage){
   this.s.hp-=p.damage;
   this.log(p.name+' · 神识穿过碑中虚像，气血-'+p.damage,'bad');
   if(this.s.hp<=0){
    this.collapse();
    return this.note('照妄失利 · 道誓仍在、投入材料已经消耗；沿用原重伤折寿，休养后可再试','warn');
   }
  }
  vow.phase=3;vow.complete=true;
  this.loot(p.loot,'大乘古道·'+p.name+'履誓');
  this.log('大道残碑 · '+p.name+'已成。古碑仅留一份对应境界的道材，未擅增战力与破境等级。','good');
  return this.note('大道已定 · '+p.name+'履誓成功；本档奖励仅一次，超重依原规则留在当地','ok','unlock');
 }
 daoEndingText(){
  const v=this.daoStele,info=D.DAO_PATHS.find(q=>q.id===v.path);
  if(!info)return '';
  const paths={
   preserve:'古碑记得许多未被人记住的名字，你选择留下能够核验的旧证，而不是抹除那些本来真实的过往。',
   discern:'你看见伪印藏在残碑裂缝里，宁愿承受神识反噬，也要分清谁在灾变之后重写了史实。',
   compassion:'你没有否认旧怨，也不以一方的过错替所有后来者定罪，让证人与后裔保有重新相见的可能。'
  };
  return (v.complete?'已履行':'已经立下')+'「'+info.name+'」之誓。'+paths[v.path];
 }

 // P9: optional three-tier ruin. No ancient-god boss, no new ascension gate or permanent combat stats.
 get immortalEstate(){return this.s.flags.immortalEstate||{phase:0,choices:[],complete:false,resolution:null,origins:{stele:0,mirror:false,karma:0,dao:null,rift:false}};}
 estateReason(){
  const s=this.s;
  if(s.combat||s.secretRealm)return '请先结束斗法或退出原有秘境，再入仙人遗府';
  if(s.ended)return '本世修行已经终结';
  if(s.zone!==11||s.pos.x!==3||s.pos.y!==3||s.major<7)return '须具备大乘／妖圣修为并亲临渡劫天门第4列第4行的遗府';
  return '';
 }
 estateOrigins(){
  return {
   stele:this.s.flags.steleChoice||0,
   mirror:!!this.s.flags.mirrorTrial?.complete,
   karma:this.s.flags.karmaReckoning?.ending||0,
   dao:this.s.flags.daoStele?.complete?this.s.flags.daoStele.path:null,
   rift:!!this.s.flags.voidRift?.complete
  };
 }
 estateEchoes(){
  const state=this.immortalEstate;
  const h=state.phase?state.origins:this.estateOrigins();
  return [
   h.stele===1?'旧碑有名：你曾护下青岚无名古修，遗仙残响认得守名者。':h.stele===2?'旧纹有缺：你曾取下失名护符，这片仙府并不因此断言你的善恶。':'旧碑未定：你不曾在青岚选择守碑或取符，不会替你补写誓言。',
   h.mirror?'云镜辨真：你已在化神云海核对两份线索，识破伪卷。':'云镜未证：你没有辨真记录，仍可亲身探索古府。',
   h.karma===1?'旧印和解：你与旧印司后裔已释怨，遗府不再放大旧仇。':h.karma===2?'旧印未和：你以强力暂断追索，未将未解之怨写成和解。':'旧印未结：你还未在合体城完成这段往事。',
   h.dao?'大道已择：你曾在大乘古道完成「'+({preserve:'守铭道',discern:'照妄道',compassion:'归缘道'}[h.dao]||'道誓')+'」的选择。':'大道无誓：即使未完成大乘残碑支线，也不影响此处问心与撤离。',
   h.rift?'裂界见痕：你已穿过两层空间错位，认得残禁的危险征兆。':'裂界未探：空间裂隙的旧路尚未亲历，残禁风险仍会完整提示。'
  ];
 }
 estateBegin(){
  const reason=this.estateReason();if(reason)return this.fail(reason);
  if(this.immortalEstate.phase!==0)return this.fail('遗府已经启封，此次直接继续既有进度，无须重复支付开门代价');
  const need={minutes:20,hunger:1,water:1,spirit:4,damage:0,cost:null};
  const why=this.estateReady(need);if(why)return this.fail(why);
  if(!this.tick(need.minutes,need.hunger,need.water,need.spirit))return {ok:false};
  this.s.flags.immortalEstate={phase:1,choices:[],complete:false,resolution:null,origins:this.estateOrigins()};
  this.log('天门外阙起雾，遗仙已逝，残府里只有三重仍可应对的考验。','good');
  return this.note('遗府外阙已启 · 第一重遗仙问心，可以随时撤离保存进度','ok');
 }
 estatePreview(mode){
  const state=this.immortalEstate,phase=state.phase;
  if(state.complete||phase<1||phase>3||!D.ESTATE_TRIALS[phase-1].modes.includes(mode))return null;
  const orig=state.origins,base=this.s.maxHp;
  const rate=phase===1?
   {remember:.042,discern:.026,sever:.142}[mode]:
   phase===2?{survey:.085,anchor:.026,force:.245}[mode]:
   {return:.048,record:.085}[mode];
  const spiritual=phase===1?
   (mode==='remember'?(orig.dao==='preserve'?7:9):mode==='discern'?(orig.mirror||orig.dao==='discern'?10:13):4):
   phase===2?(mode==='survey'?(orig.rift?10:13):mode==='anchor'?8:4):
   mode==='return'?(orig.dao==='compassion'?9:11):9;
  const minutes=phase===1?mode==='sever'?35:40:phase===2?mode==='survey'?45:40:50;
  const cost=phase===2&&mode==='anchor'?{mahayaJade:1}:phase===3&&mode==='return'?{rune:1}:phase===3&&mode==='record'?{mahayaRune:1}:null;
  const loot=phase===3?(mode==='return'?{ancient:2,mahayaRune:1}:{ancient:2,mahayaJade:1}):null;
  const damage=Math.max(1,Math.ceil(base*rate)-Math.floor(this.armor*.035));
  const extra=this.extra(minutes);
  return {mode,minutes,hunger:2,water:2,spirit:spiritual,actualSpirit:spiritual+extra.spirit,actualWater:2+extra.water,damage,cost,loot};
 }
 estateReady(plan){
  const additional=this.extra(plan.minutes);
  const spirit=plan.actualSpirit??plan.spirit+additional.spirit;
  const water=plan.actualWater??plan.water+additional.water;
  if(this.s.spirit<=spirit)return '灵力不足：本次需要'+spirit+'点（含环境消耗），仍须保留一点余力';
  if(this.s.hunger<=plan.hunger+1||this.s.water<=water+1)return '饱腹或饮水不足；先补给，避免行动时产生未经预告的耗损';
  if(plan.cost&&!this.enough(plan.cost))return '道材不足：'+this.missing(plan.cost);
  return '';
 }
 estateAct(mode){
  const reason=this.estateReason();if(reason)return this.fail(reason);
  const state=this.immortalEstate,plan=this.estatePreview(mode);
  if(!plan)return this.fail(state.complete?'本档遗府三重已过，不得重复取奖':'请先启封遗府并选择当前考验允许的应对方式');
  const why=this.estateReady(plan);if(why)return this.fail(why);
  const stage=state.phase;
  if(!this.tick(plan.minutes,plan.hunger,plan.water,plan.spirit))return {ok:false};
  if(plan.cost)this.spend(plan.cost);
  this.s.hp-=plan.damage;
  const stages=['遗仙问心','残缺仙禁','传承终试'],names={remember:'寻名守念',discern:'照妄辨心',sever:'强断旧念',survey:'观禁寻隙',anchor:'道源玉稳禁',force:'强破仙禁',return:'归封遗书',record:'留存见证'};
  this.log('仙人遗府 · '+stages[stage-1]+' · '+names[mode]+'，气血-'+plan.damage,'good');
  if(this.s.hp<=0){
   this.collapse(); // Earlier completed stages persist. Failed stage remains retryable, no illusory progress.
   return this.note('遗府试炼失利，沿用原战败折寿；已经过的层次保留，本层可恢复后重试','warn');
  }
  state.choices.push(mode);
  state.phase=stage+1;
  if(stage===3){
   state.complete=true;state.resolution=mode;
   this.loot(plan.loot,'仙人遗府·'+(mode==='return'?'归封旧诏':'留存旧证'));
   this.log('三重已尽，府门复归沉寂；遗仙早已不在，仙界并未因此开放。','good');
   return this.note('三重终试已成 · 见闻第九卷更新，少量旧道材已一次结算；飞升仍循原主线','ok','unlock');
  }
  return this.note('第'+stage+'重已过 · 可撤回地图补给，下次从第'+(stage+1)+'重继续','ok');
 }
 estateConclusion(){
  const state=this.immortalEstate;
  if(!state.complete)return '遗府中的古修早已不在。尚未走完三重挑战，所见只是封阙残影。';
  return state.resolution==='return'?
   '你将旧仙路的残书归封于碑，留待真正看清灾变的后来者开启；遗府没有给你新的境界，却留下了一次不随意泄露古禁的承诺。':
   '你把残书见证拓为一份可核对的史页，允许后来者知道仙路曾断、封禁曾损；遗府没有赐予仙器，而是让真相重新有了见证。';
 }
 breakthrough(){
  if(this.s.combat)return this.fail('斗法中无法破境');
  if(this.s.ascended)return this.fail('飞升已成，仙界待后续版本开启');
  if(this.s.zone<5)return this.fail('请先完成天阙后续的凝丹试炼');
  if(!this.s.cleared[this.s.zone])return this.fail('先修复道坛并击败本境首领');
  const t=D.ASCENSION_STAGES[this.s.zone-5];
  if(!t||this.s.major!==this.s.zone-4)return this.fail('此境已突破，继续向下一境修行');
  if(this.s.level<18)return this.fail(this.character.second+'后期方可参悟大道，继续积累修为');
  if(!this.atCamp)return this.fail('需回本境洞府静修破境');
  if(this.s.daoXp<t.needDao)return this.fail('道行不足：'+this.s.daoXp+'/'+t.needDao);
  const cost={[t.primary]:2,[t.secondary]:1};if(!this.enough(cost))return this.fail(this.missing(cost));
  if(this.s.zone===5&&!this.coreTrial.complete)return this.fail('必须先在修炼→凝丹雷劫中渡过三重雷考');
  if(this.s.zone===6&&this.s.major===2&&!this.heartTrial.complete)return this.fail('必须先在修炼→元婴问心中完成三重问心');
    const dmg=this.tribDamage;
  if(this.s.hp<dmg)return this.fail('渡劫需气血 '+dmg+'，当前 '+this.s.hp+' —— 先回洞府补血再来');
  if(!this.tick(240,5,5,10))return {ok:false};
  const usedPills=this.tribPills;
  this.spend(cost);this.s.daoXp=0;this.s.major=this.s.zone-3;
  if(usedPills>0)this.s.inv.guardPill=Math.max(0,(this.s.inv.guardPill||0)-usedPills);
  this.s.attack+=t.atk;this.s.maxHp+=t.hp;this.s.maxSpirit+=t.spirit;
  this.s.hp=Math.max(1,this.s.maxHp-dmg);this.s.spirit=this.s.maxSpirit;
  this.s.life.left+=t.life*D.LIFE.yearMinutes;
  this.log('破境成功 · '+this.realm+'，延寿'+t.life+'年','good');
  if(this.s.zone===11)return this.note('渡劫境已成 · 前往天门完成飞升大劫','ok','unlock');
  this.s.unlocked=Math.max(this.s.unlocked,Math.min(D.ZONES.length,this.s.zone+2));
  return this.note('突破'+this.realm+' · 开放'+D.ZONES[this.s.zone+1].name,'ok','unlock');
 }

 // P10: optional final thunder ordeal beside the ORIGINAL ascension interface.
 // Deliberately never called by ascend(): existing gate, dao, cost, time and lifespan rules remain unchanged.
 get heavenTrial(){return this.s.flags.heavenTrial||{phase:0,choices:[],complete:false,scars:0,witness:{stele:0,court:false,mirror:false,rift:false,karma:0,dao:null,estate:null}};}
 heavenReason(){
  const s=this.s;
  if(s.combat||s.secretRealm)return '斗法或秘境中不能在飞升界碑前应九霄终劫';
  if(s.ended)return '本世修行已终结';
  if(s.ascended)return '飞升已成，九霄记闻可以回顾，不可重复应劫';
  if(s.zone!==11||this.land()!=='gate'||s.major!==8||!s.cleared.every(Boolean))return '须抵达渡劫天门的飞升界碑、达到渡劫境并平定十二境';
  return '';
 }
 heavenWitness(){
  const flags=this.s.flags;
  return {
   stele:flags.steleChoice||0,court:(flags.relicCourt||0)>0,
   mirror:!!flags.mirrorTrial?.complete,rift:!!flags.voidRift?.complete,
   karma:flags.karmaReckoning?.ending||0,
   dao:flags.daoStele?.complete?flags.daoStele.path:null,
   estate:flags.immortalEstate?.complete?flags.immortalEstate.resolution:null
  };
 }
 heavenOmenText(){
  const h=this.heavenTrial.phase>0?this.heavenTrial.witness:this.heavenWitness();
  const stele=h.stele===1?'你曾守住青岚断碑的失名古修，雷声里那一笔亡者姓名仍清晰。':h.stele===2?'昔日取走的失名护符在雷火里映出缺纹，旧事不能由此改写。':'青岚失名古碑未留下你的选择；这道天雷不替你虚构当日的誓约。';
  const karma=h.karma===1?'旧印司的仇怨已由你呈证化解，雷云不再将它写成仇杀。':h.karma===2?'你曾破阵摆脱旧印司，双方旧怨仍然未解。':'你尚未在旧印司的追索中留下终局记录。';
  const way=h.dao?'大乘残碑记得你已行的「'+({preserve:'守铭道',discern:'照妄道',compassion:'归缘道'}[h.dao]||'大道')+'」。':'大乘残碑未留已完成的道誓，本次天雷仍可独自面对。';
  const estate=h.estate==='return'?'你曾将遗仙残书归封于古府，终试留给你一份谨慎。':h.estate==='record'?'你曾在仙府留下见证，使被遮掩的旧史有迹可循。':'仙人遗府终试尚未在本世完成，天门不会假称你继承仙法。';
  return [stele,karma,way,estate][Math.min(3,Math.max(0,this.heavenTrial.phase?this.heavenTrial.phase-1:0))];
 }
 heavenReady(plan){
  const extra=this.extra(plan.minutes);
  const sp=plan.spirit+extra.spirit,w=plan.water+extra.water;
  if(this.s.spirit<=sp)return '灵力不足：需要'+sp+'点并保留至少1点余力';
  if(this.s.hunger<=plan.hunger+1||this.s.water<=w+1)return '饱腹或饮水不足，请先补给以免产生未预告的额外掉血';
  return '';
 }
 heavenPreview(mode){
  const phase=this.heavenTrial.phase;
  if(phase<1||phase>3||this.heavenTrial.complete||!['ward','channel','endure'].includes(mode))return null;
  const factor=[.085,.13,.19][phase-1],rate={ward:.34,channel:.7,endure:1.34}[mode];
  const minutes=[35,45,55][phase-1];
  const spirit=({ward:[10,14,19],channel:[6,8,10],endure:[2,2,3]}[mode])[phase-1];
  const blood=this.s.character==='demon'&&mode==='ward'?Math.min(12,(this.s.blood?.stage||0)*2):0;
  const guard=this.s.character==='human'&&mode==='ward'&&this.s.manuals?.equipped?.guard?8:0;
  const damage=Math.max(1,Math.ceil(this.s.maxHp*factor*rate)-Math.floor(this.armor*.032)-blood-guard);
  return {mode,minutes,spirit,actualSpirit:spirit+this.extra(minutes).spirit,
   hunger:2,water:2,damage,fatal:damage>=this.s.hp};
 }
 heavenStart(){
  const reason=this.heavenReason();if(reason)return this.fail(reason);
  if(this.heavenTrial.phase!==0)return this.fail('九霄终劫已启，继续当前天雷即可');
  const plan={minutes:15,spirit:4,hunger:1,water:1};
  const why=this.heavenReady(plan);if(why)return this.fail(why);
  if(!this.tick(plan.minutes,plan.hunger,plan.water,plan.spirit))return {ok:false};
  this.s.flags.heavenTrial={phase:1,choices:[],complete:false,scars:0,witness:this.heavenWitness()};
  this.log('九霄终劫已启：三重雷云照临，本次为可选的应劫经历，不改原飞升之法。','good');
  return this.note('问命天雷降下 · 可以回府准备，进度保留','ok');
 }
 heavenAct(mode){
  const reason=this.heavenReason();if(reason)return this.fail(reason);
  const trial=this.heavenTrial,plan=this.heavenPreview(mode);
  if(!plan)return this.fail(trial.complete?'九霄三重已渡，不再重复应劫':'先启劫，并选择当前允许的护元、纳雷或承劫方式');
  const why=this.heavenReady(plan);if(why)return this.fail(why);
  const stage=trial.phase;
  if(!this.tick(plan.minutes,plan.hunger,plan.water,plan.spirit))return {ok:false};
  this.s.hp-=plan.damage;
  const label={ward:'护元承雷',channel:'纳雷淬身',endure:'以躯硬抗'}[mode];
  this.log('九霄终劫 · 第'+stage+'重 · '+label+'，实际气血-'+plan.damage,'good');
  if(this.s.hp<=0){
   this.collapse();
   return this.note('天劫失利：沿用原重伤折寿，本重可再试，之前成功的雷关仍保存','warn');
  }
  trial.choices.push(mode);
  if(mode!=='ward')trial.scars=Math.min(3,trial.scars+1); // narrative only, not a combat bonus.
  trial.phase++;
  if(stage===3){
   trial.complete=true;
   this.log('九霄雷云散尽：三重终劫已过，飞升仍须按旧法交付道行与劫材。','good');
   return this.note('九霄三重已渡 · 可在同一界碑按原有条件飞升','ok','unlock');
  }
  return this.note('第'+stage+'重天雷已过 · 下一重风险更高，可先撤离修整','ok');
 }
 heavenStory(){
  const flags=this.s.flags,parts=[];
  const choice=flags.steleChoice||0;
  if(choice===1)parts.push('青岚无名碑下，你留下了古修的名讳。那笔未被遗忘的姓名，如今终于随着雷云远去。');
  else if(choice===2)parts.push('青岚断碑的旧符曾被你取走。你没有掩饰那次决定，也没有让后来的故事替你涂改它。');
  if((flags.relicCourt||0)>0)parts.push('天阙前庭的丹痕曾向你揭开旧仙路的一角，那座封闭古府不是无代价的捷径。');
  if(flags.mirrorTrial?.complete)parts.push('云海映心镜里，你亲自辨出了后人伪刻的传承，明白假经能借旧印蒙蔽来者。');
  if(flags.voidRift?.complete)parts.push('炼虚裂隙的两重错位已被你勘明，破碎空间并未为所有行者留下相同的路。');
  const karma=flags.karmaReckoning?.ending||0;
  if(karma===1)parts.push('旧印司后裔曾与你呈证释怨；仇敌之间仍可以选择让错误到此为止。');
  else if(karma===2)parts.push('旧印司的追索被你暂时阻断。胜过阵禁不等于消弭旧怨，这段裂痕仍留在人间。');
  const dao=flags.daoStele;
  if(dao?.complete){const name={preserve:'守铭道',discern:'照妄道',compassion:'归缘道'}[dao.path];if(name)parts.push('在大乘古道，你曾立下并履行「'+name+'」；大道不单是数值，也在你怎样回答过去。');}
  const estate=flags.immortalEstate;
  if(estate?.complete)parts.push(estate.resolution==='return'?'你选择将仙人遗府的残卷归封，不以破禁的知识换取一时强盛。':'你曾为仙人遗府的残文留存真证，让后来者知道仙路何以断裂。');
  if(!parts.length)parts.push('旧仙路的遗迹并未被你一一探明，凡界尚有许多名字等待后来者发现。');
  return parts;
 }
 heavenSummary(){
  return this.heavenTrial.complete?'你选择亲历九霄三重终劫，雷息已定；随后仍按原法度启开飞升天门。':
    this.heavenTrial.phase>0?'你曾进入九霄终劫，却选择沿用原有飞升法度直接启门；未完成的雷关不会被写成已渡。':
    '你沿用凡界既有飞升法度开启天门，没有另行挑战可选的九霄三重试炼。';
 }
 ascend(){
  if(this.s.ascended)return this.fail('已成功飞升，仙界篇章待更新');
  if(this.s.zone!==D.ZONES.length-1||this.land()!=='gate')return this.fail('请前往渡劫天门的飞升界碑');
  if(this.s.major!==8||!this.s.cleared.every(Boolean))return this.fail('先达到渡劫境，平定凡界十二境');
  if(this.s.daoXp<D.ASCENSION_RULE.dao)return this.fail('飞升道行不足：'+this.s.daoXp+'/'+D.ASCENSION_RULE.dao);
  if(!this.enough(D.ASCENSION_RULE.cost))return this.fail(this.missing(D.ASCENSION_RULE.cost));
  if(!this.tick(180,4,4,8))return {ok:false};this.spend(D.ASCENSION_RULE.cost);
  this.s.major=9;this.s.ascended=true;this.s.flags.complete=true;
  // Capture first finish before the 1000-year ascension grant. Time excludes the 420-minute birth clock.
  this.s.ascensionRecord={version:1,race:this.s.character,
   runId:[this.s.character,this.s.birth.seed,this.s.seed,this.s.minutes].join(':'),
   elapsedMinutes:Math.max(0,this.s.minutes-420),remainingLifeMinutes:this.s.life.left,defeats:this.s.life.losses};
  this.s.life.left+=D.ASCENSION_RULE.life*D.LIFE.yearMinutes;
  this.s.hp=this.s.maxHp;this.s.spirit=this.s.maxSpirit;
  this.log('飞升天门已启，凡界篇章完结。','good');
  return this.note('飞升成功 · 仙界未开放，角色进度保留','ok','victory');

 scout(){if(this.s.combat)return this.fail('斗法中不能勘察');if(this.s.scouted[this.key()])return this.fail('此处已勘察');const before=Object.keys(this.s.seen).length;if(!this.tick(30,2,3,5))return {ok:false};this.reveal(this.s.flags.talisman?3:2);this.s.scouted[this.key()]=true;this.s.stats.scouts++;const delta=Object.keys(this.s.seen).length-before;if(delta>=3)this.xp(2);return this.note('发现'+delta+'个地点','ok');}

 // Recovery is a positive healing budget earned only from time spent resting
 // while nutritionally supported; neither sleeping nor camping sets HP to max.
 restForecast(mode='camp'){
  const home=mode!=='field';
  let minutes=mode==='field'?50:180,h=mode==='field'?5:2,w=mode==='field'?6:3;
  if(mode==='night'||mode==='dawn'){
   const clockTarget=mode==='night'?1080:420;
   let target=Math.floor(this.s.minutes/1440)*1440+clockTarget;
   if(target<=this.s.minutes)target+=1440;
   minutes=target-this.s.minutes;h=Math.ceil(minutes/180);w=Math.ceil(minutes/150);
  }
  const cost=this.survivalForecast(minutes,h,w,0);
  const supply=Math.min(this.s.hunger,this.s.water,cost.hunger,cost.water);
  // <=10: zero restoration; >=35: full efficiency, interpolated in between.
  const factor=supply<=10?0:supply>=35?1:(supply-10)/25;
  const level=home?this.camp?.level||1:1;
  const hpHourly=14+5*(level-1)+Math.ceil(this.s.maxHp*.008);
  const spiritHourly=24+5*(level-1)+Math.ceil(this.s.maxSpirit*.015);
  const hpGain=home?Math.floor(hpHourly*minutes/60*factor):0;
  const spiritGain=home?Math.floor(spiritHourly*minutes/60*factor):Math.floor(28*factor);
  const willCollapse=cost.damage>=this.s.hp;
  const expectedHp=willCollapse?0:Math.min(this.s.maxHp,Math.max(0,this.s.hp-cost.damage)+hpGain);
  const expectedSpirit=Math.min(this.s.maxSpirit,cost.spirit+spiritGain);
  return {...cost,mode,minutes,factor,hpGain,spiritGain,willCollapse,
    expectedHp,expectedSpirit,netHp:expectedHp-this.s.hp,netSpirit:expectedSpirit-this.s.spirit};
 }
 rest(mode='field'){
  if(this.s.combat)return this.fail('斗法中请使用防守恢复灵力');
  if(mode==='field'){
   const p=this.restForecast('field'),before=this.s.hp;
   if(!this.tick(p.minutes,p.hungerCost,p.waterCost-this.extra(p.minutes).water,0))return {ok:false};
   this.s.spirit=Math.min(this.s.maxSpirit,this.s.spirit+p.spiritGain);
   return this.note(p.factor===0?'饥渴虚弱：野外调息无法回灵，气血'+(this.s.hp-before):'野外调息 · 灵力+'+p.spiritGain+' · 气血'+(this.s.hp-before),
    p.factor===0?'warn':'ok');
  }
  if(!this.workshop)return this.fail(this.camp?'请先回到洞府':'先选址筑庐，野外可调息');
  if(mode==='supply'){
   const food=this.has('berry')?'berry':this.has('meal')?'meal':this.has('fish')?'fish':this.has('pill')?'pill':null;
   if(!food||!this.has('water'))return this.fail('洞府补给需要食物1份和清水1份（可从本境仓房取用）');
   // Eating and drinking precede time passage; a near-death role can still eat.
   this.spend({[food]:1,water:1});
   const gain={berry:22,meal:45,fish:28,pill:42}[food];
   this.s.hunger=Math.min(100,this.s.hunger+gain);
   this.s.water=Math.min(100,this.s.water+30);
   if(!this.tick(30,1,1,0))return {ok:false};
   return this.note('已进食补水：'+D.ITEMS[food].name+'×1、清水×1；补给充足后休息才能恢复','ok');
  }
  if(!['camp','night','dawn'].includes(mode))return this.fail('未知休息方式');
  const p=this.restForecast(mode),beforeHp=this.s.hp,beforeSp=this.s.spirit;
  if(!this.tick(p.minutes,p.hungerCost,p.waterCost-this.extra(p.minutes).water,0))return {ok:false};
  this.s.hp=Math.min(this.s.maxHp,this.s.hp+p.hpGain);
  this.s.spirit=Math.min(this.s.maxSpirit,this.s.spirit+p.spiritGain);
  const hpDelta=this.s.hp-beforeHp,spDelta=this.s.spirit-beforeSp;
  const signed=x=>(x>=0?'+':'')+x;
  const label=mode==='night'||mode==='dawn'?'安睡至'+this.clock:'洞府休息'+p.minutes+'分钟';
  const msg=label+' · 气血'+signed(hpDelta)+' · 灵力'+signed(spDelta)
   +(p.factor===0?'；饥渴虚弱，未获得恢复，请先补给':p.factor<1?'；补给偏低，恢复效果下降':'');
  this.log(msg,hpDelta<0||p.factor===0?'bad':'good');
  return this.note(msg,hpDelta<0||p.factor===0?'warn':'ok');
 }
 consume(id){if(this.s.combat)return this.fail('斗法请使用战斗指令');if(!own(D.ITEMS,id)||D.ITEMS[id].type!=='food'||!(this.s.inv[id]>0))return this.fail('没有该消耗品');
 if(id==='lifespanPill'){

  const e=effects[id];if(!e)return this.fail('不能使用该物品');const cap=k=>k==='hp'?this.s.maxHp:k==='spirit'?this.s.maxSpirit:100;
  if(Object.keys(e).every(k=>this.s[k]>=cap(k)))return this.fail('状态已满，不消耗物品');this.s.inv[id]--;for(const [k,n] of Object.entries(e))this.s[k]=Math.min(cap(k),this.s[k]+n);if(id==='water')this.s.stats.drinks++;this.log('使用'+D.ITEMS[id].name,'good');return this.note(D.ITEMS[id].effect,'ok');
 }
 // Settlement state is keyed by region. No implicit camps or cross-region warehouse.
 get camp(){return this.s.settlements[this.s.zone]||null;}
 get atCamp(){const c=this.camp;return !!c&&c.pos.x===this.s.pos.x&&c.pos.y===this.s.pos.y;}
 get workshop(){return this.atCamp;}
 get storageReady(){return this.atCamp&&this.roomLevel('warehouse')>0;}
 get localStash(){return this.storageReady?this.camp.stash:{};}
 roomLevel(id,c=this.camp){return c?(id==='residence'?c.level:c.buildings[id]||0):0;}
 stashCapacity(c=this.camp){return [0,80,180,360,650,1100][this.roomLevel('warehouse',c)]||0;}
 stashWeight(c=this.camp){return Object.entries(c?.stash||{}).reduce((n,[k,q])=>n+(D.ITEMS[k]?.wt||0)*q,0);}
 get ground(){return this.s.caches[this.key()]||{};}
 campName(c=this.camp,z=this.s.zone){return c?D.ZONES[z].short+' · '+D.BUILDINGS.residence.levels[c.level-1].name:'尚未定居';}
 isCampTile(x,y,z=this.s.zone){const c=this.s.settlements[z];return !!c&&c.pos.x===x&&c.pos.y===y;}
 canSettle(x=this.s.pos.x,y=this.s.pos.y,z=this.s.zone){
  if(z>=this.s.unlocked||!pos({x,y}))return '尚不能前往此地';
  if(!this.s.visited[this.key(x,y,z)])return '先走到此地，再确定选址';
  if(!D.CAMP_LANDS.includes(D.ZONES[z].map[y][x]))return '这里不宜定居，寻找营坪、草坡、林地或石岗';
  if(D.SITES[this.key(x,y,z)]||D.EVENTS[this.key(x,y,z)])return '此地留作奇遇，不能覆盖';
  return '';
 }
 settle(relocate=false){
  if(this.s.combat)return this.fail('斗法中不能营建');
  const why=this.canSettle();if(why)return this.fail(why);
  if(this.camp&&!relocate)return this.fail('本境已有洞府，可选择迁居');
  if(relocate&&!this.camp)return this.fail('还没有可以迁移的洞府');
  if(this.atCamp)return this.fail('这里已经是你的洞府');
  const cost=relocate?D.MOVE_CAMP_COST:D.SETTLE_COST;
  // At a new site only carried materials are available. Never spend distant storage.
  if(!this.enough(cost))return this.fail(this.missing(cost));
  const destination=copy(this.s.pos),started=this.s.minutes;
  if(!this.tick(relocate?180:120,5,5,4))return {ok:false};
  this.spend(cost);
  if(relocate){this.camp.pos=destination;this.s.stats.relocations++;}
  else{this.s.settlements[this.s.zone]={pos:destination,level:1,buildings:{},stash:{},storedGears:[],foundedAt:started,farmAt:0};this.s.stats.settled++;}
  this.s.stats.built++;this.reveal();
  this.log((relocate?'迁居完成，建筑与仓库完整保留':'筑起草庐，终于有了落脚处')+' · '+(destination.x+1)+','+(destination.y+1),'good');
  return this.note(relocate?'迁居完成 · 物资与设施保留':'草庐落成 · 可修建仓房与炼器室','ok');
 }
 buildReason(id){
  const def=D.BUILDINGS[id];if(!def)return '未知建筑';
  if(!this.camp)return '先找地方筑庐';
  if(!this.atCamp)return '需要回到本境洞府营建';
  if(def.zone!==undefined&&def.zone!==this.s.zone)return '山门在青岚洞府修建';
  const old=this.roomLevel(id),next=def.levels[old];if(!next)return '已达本版上限';
  if(next.home&&this.camp.level<next.home)return '先将洞府升至'+next.home+'阶';
  if(!this.enough(next.cost))return this.missing(next.cost);
  return '';
 }
 build(id){
  if(this.s.combat)return this.fail('斗法中不能营建');const why=this.buildReason(id);if(why)return this.fail(why);
  const def=D.BUILDINGS[id],level=this.roomLevel(id)+1,next=def.levels[level-1];
  // Payment happens only after all checks and a successful work interval.
  if(!this.tick(next.minutes,3,3,3))return {ok:false};
  this.spend(next.cost);
  if(id==='residence')this.camp.level=level;else this.camp.buildings[id]=level;
  if(id==='farm')this.camp.farmAt=this.s.minutes;
  if(id==='gate'){
   this.s.ritual[0]=true;this.s.flags.repaired=true;this.xp(10);
   this.log('自建山门与护山阵落成，青岚妖窟已经开放。','good');
  }
  this.s.stats.built++;this.log(def.name+'升至'+level+'阶','good');
  return this.note(id==='gate'?'山门落成 · 妖窟封印解除':def.name+' · '+level+'阶落成','ok');
 }
 recipeRequirement(r){
  if(r.realmReq&&this.s.major<r.realmReq)return '需要先达到'+D.REALMS[r.realmReq]+'境';
  if(r.room){if(!this.atCamp)return '需在洞府的'+D.BUILDINGS[r.room].name+'炼制';
   if(this.roomLevel(r.room)<r.tier)return '需'+D.BUILDINGS[r.room].name+r.tier+'阶（当前'+this.roomLevel(r.room)+'阶）';}
  else if(r.home&&!this.atCamp)return '请回到洞府炼制';

 }
 farmRemaining(){if(!this.camp||!this.roomLevel('farm'))return null;return Math.max(0,1440-(this.s.minutes-this.camp.farmAt));}
 get farmBatches(){if(!this.camp||!this.roomLevel('farm'))return 0;return Math.min(3,Math.floor(Math.max(0,this.s.minutes-this.camp.farmAt)/1440));}
 get farmReady(){return this.farmBatches>0;}
 harvestFarm(){
  if(this.s.combat)return this.fail('斗法中不能收获');if(!this.atCamp)return this.fail('请回洞府收获');
  if(!this.roomLevel('farm'))return this.fail('先修建灵田');if(this.farmRemaining()>0)return this.fail('灵田尚需'+Math.ceil(this.farmRemaining()/60)+'游戏小时');
const batches=this.farmBatches,loot=Object.fromEntries(Object.entries(D.FARM_LOOT[this.roomLevel('farm')]).map(([k,v])=>[k,v*batches]));
   // Backlog caps at 3 batches, discarding older unsupervised cycles but preserving elapsed partial day.
   this.camp.farmAt=this.s.minutes-((this.s.minutes-this.camp.farmAt)%1440);this.s.stats.farms+=batches;
   const parts=[];for(const [k,n] of Object.entries(loot)){
    let remaining=n;
    if(this.storageReady){const w=D.ITEMS[k].wt||1;const stored=Math.min(remaining,Math.max(0,Math.floor((this.stashCapacity()-this.stashWeight())/w)));
     if(stored){this.camp.stash[k]=(this.camp.stash[k]||0)+stored;remaining-=stored;parts.push(D.ITEMS[k].name+'入仓'+stored);this.s.codex.items[k]=(this.s.codex.items[k]||0)+stored;}
    }
    if(remaining){const msg=this.loot({[k]:remaining},'灵田收获');if(msg)parts.push(msg);}
   }
   this.log('灵田结算 '+batches+'轮','good');return this.note('灵田'+batches+'轮 · '+parts.join(' · '),'ok');
 }
 pickup(id=null,qty=999){
  if(this.s.combat)return this.fail('斗法中不能拾取');let count=0;
  const ids=id?[id]:Object.keys(this.ground);
  for(const k of ids){if(!own(D.ITEMS,k))continue;const q=this.ground[k]||0,wt=D.ITEMS[k].wt;

  }

  return this.note('拾取 '+count+'件 · 已入行囊','ok');
 }
 storeGear(id){

 store(id=null,qty=999999){

  const ids=id?[id]:Object.keys(this.s.inv).filter(k=>D.ITEMS[k]?.type==='material');let moved=0,left=0;
  for(const k of ids){if(!own(D.ITEMS,k))continue;const q=this.s.inv[k]||0,wt=D.ITEMS[k].wt;
   const fit=Math.min(q,integer(qty,1,999999),wt?Math.max(0,Math.floor((this.stashCapacity()-this.stashWeight())/wt)):q);

  }

 provision(){

 recipe(id){return D.RECIPES.find(r=>r.id===id);}

  const record={runId,generation:ledger.generation+1,name:String(g.s.birth?.name||'无名修士').slice(0,16),realm:g.realm,zone:rank,cleared:completed,day:g.day,level:g.s.level,bestPower:globalThis.QCombatRating?.live(g)?.total||0,reward,at:new Date().toISOString()};
  ledger.balance+=reward;ledger.total+=reward;ledger.generation+=1;ledger.last=record;ledger.history=[record,...ledger.history].slice(0,30);this.putLegacy(id,n,ledger);return ledger;
 }

 leaderboardKey(){return 'shanye-v907-local-ascension-board-v1';}
 leaderboard(){
  const raw=this.readKey(this.leaderboardKey());
  if(!raw)return {schemaVersion:1,source:'local_unverified',records:[]};
  const b=JSON.parse(raw);
  if(b?.schemaVersion!==1||b.source!=='local_unverified'||!Array.isArray(b.records)||b.records.length>200)throw Error('本机资质榜格式无效，已停止覆盖');
  for(const r of b.records){
   if(!r||typeof r.runId!=='string'||r.runId.length>110||!['human','demon'].includes(r.race)||
      !Number.isInteger(r.slot)||r.slot<1||r.slot>100||
      !Number.isInteger(r.elapsedMinutes)||r.elapsedMinutes<0||r.elapsedMinutes>52560000||
      typeof r.name!=='string'||r.name.length>32)throw Error('资质榜记录损坏，已停止覆盖');
  }
  return b;
 }
 recordAscension(id,n,g){
  this.check(id);this.slot(n);const a=g.s.ascensionRecord;
  if(!g.s.ascended||!a||a.race!==id)return null;
  const board=this.leaderboard();
  const exists=board.records.find(r=>r.runId===a.runId);if(exists)return exists;
  const item={schemaVersion:1,source:'local_unverified',runId:a.runId,race:id,slot:n,
    name:String(g.s.birth?.name||'无名修士').slice(0,16),elapsedMinutes:a.elapsedMinutes,
    defeats:a.defeats,remainingLifeMinutes:a.remainingLifeMinutes,
    recordedAt:new Date().toISOString(),playerId:null,verification:'unverified'};
  board.records.push(item);
  board.records.sort((a,b)=>a.elapsedMinutes-b.elapsedMinutes||a.defeats-b.defeats||a.runId.localeCompare(b.runId));
  board.records=board.records.slice(0,200);
  this.storage.setItem(this.leaderboardKey(),JSON.stringify(board));
  return item;
 }
 previewAscendedReward(id,n,g){
  this.check(id);this.slot(n);if(!g?.s?.ascended||g.s.ended||g.s.race!==id)throw Error('只有已飞升、仍在修行的本世可以结算');
  const a=g.s.ascensionRecord;
  const years=a?a.elapsedMinutes/D.LIFE.yearMinutes:null;
  const speed=years===null?0:years<=40?400:years<=70?300:years<=110?200:years<=160?100:0;
  const deathless=a&&a.defeats===0?150:0;
  return {base:1000,speed,deathless,total:1000+speed+deathless,known:!!a,years};
 }
 retired(id,n=1){
  const raw=this.readKey(this.deathKey(id,n));
  if(!raw)return false;try{return JSON.parse(raw)?.reason==='飞升结算';}catch{return false;}
 }
 retireAscended(id,n,g){
  this.check(id);this.slot(n);if(this.dead(id,n))throw Error('此档位已经终结，不可重复结算');
  const found=this.read(id,n);if(!found||!found.game.s.ascended||!g.s.ascended)throw Error('请先保存飞升后的有效存档');
  const a=g.s.ascensionRecord,existing=found.game.s.ascensionRecord;
  if((a?.runId||'')!==(existing?.runId||'')||g.s.race!==id||g.s.character!==id)throw Error('飞升凭证与落盘进度不一致');
  const reward=this.previewAscendedReward(id,n,g);
  const ledger=this.legacy(id,n),runId=a?.runId||['legacy-ascended',id,g.s.birth.seed,g.s.birth.name].join(':');
  let record=ledger.history.find(r=>r.kind==='ascension_retire'&&r.runId===runId);
  if(!record){
   record={kind:'ascension_retire',runId,generation:ledger.generation+1,
    name:String(g.s.birth?.name||'无名修士').slice(0,16),realm:g.realm,
    zone:12,cleared:12,day:g.day,level:g.s.level,
    elapsedMinutes:a?a.elapsedMinutes:null,lifeRemainingMinutes:a?a.remainingLifeMinutes:null,
    deaths:a?a.defeats:g.s.life.losses,bestPower:globalThis.QCombatRating?.live(g)?.total||0,
    reward:reward.total,breakdown:{base:reward.base,speed:reward.speed,deathless:reward.deathless},
    at:new Date().toISOString()};
   ledger.balance+=reward.total;ledger.total+=reward.total;ledger.generation+=1;
   ledger.last=record;ledger.history=[record,...ledger.history].slice(0,30);
   this.putLegacy(id,n,ledger); // Award before tombstone; retry is idempotent if deletion is interrupted.
  }
  const marker={race:id,slot:n,reason:'飞升结算',runId,at:new Date().toISOString()};
  this.storage.setItem(this.deathKey(id,n),JSON.stringify(marker));
  this.storage.removeItem(this.key(id,n));this.storage.removeItem(this.backupKey(id,n));
  return {record,reward:record.reward,balance:ledger.balance,generation:ledger.generation};
 }
 buyLegacy(id,n,kind){this.check(id);this.slot(n);if(!['vigor','spirit','attack'].includes(kind))throw Error('未知遗泽');if(!this.dead(id,n)&&this.status(id,n).status!=='empty')throw Error('只可在本档开局前兑换');const ledger=this.legacy(id,n),price={vigor:35,spirit:35,attack:70}[kind],lv=ledger.upgrades[kind]||0;if(lv>=5)throw Error('此项强化已达到五级上限');const cost=price*(lv+1);if(ledger.balance<cost)throw Error('轮回玉不足，尚需'+(cost-ledger.balance));ledger.balance-=cost;ledger.upgrades[kind]=lv+1;this.putLegacy(id,n,ledger);return ledger;}

 deathKey(id,n=1){return this.key(id,n)+'-death';}
 readKey(k){return this.storage.getItem(k);}
 dead(id,n=1){return !!this.readKey(this.deathKey(id,n));}
 /* V90.43 旧档补偿阶梯：飞升 1000 / 大境界≥6 或首领≥8 → 600 / 其余 300 */
 tierOf(raw){try{if(raw&&raw.ascended)return 1000;const bosses=(raw&&Array.isArray(raw.cleared))?raw.cleared.filter(Boolean).length:0;if(Number((raw&&raw.major)||0)>=6||bosses>=8)return 600;}catch{}
  return 300;}
 read(id,n=1){this.check(id);this.slot(n);if(this.dead(id,n))throw Error(this.retired(id,n)?'此档已飞升结算，请重新轮回':'此档寿元已尽，请明确开启新轮回');
  let present=false;for(const [key,source] of [[this.key(id,n),'主存档'],[this.backupKey(id,n),'自动备份']]){
   const raw=this.readKey(key);if(!raw)continue;present=true;
   try{const obj=JSON.parse(raw);
    /* V90.43：重构前的档没有 rebuilt 标记 —— 不加载、不删除，交给重置流程 */
    if(obj.version===14&&!obj.rebuilt)return {reset:{tier:this.tierOf(obj),source,race:id,slot:n}};
    if(obj.version!==14||obj.race!==id||obj.character!==id)throw Error('种族身份不符');
    return {game:new Game(obj,261014,id),source};}catch{}
  }
  if(present)throw Error('此档数据损坏，已锁定防止覆盖');return null;
 }
 status(id,n=1){try{this.check(id);this.slot(n);if(this.dead(id,n))return {status:this.retired(id,n)?'retired':'dead',role:id,slot:n};const found=this.read(id,n);if(!found)return {status:'empty',role:id,slot:n};if(found.reset)return {status:'reset',role:id,slot:n,tier:found.reset.tier};const g=found.game,s=g.s;
  return {status:'ready',role:id,slot:n,name:s.birth.name,grade:B.gradeName(s.birth),realm:g.realm,day:g.day,years:g.lifeYears.toFixed(1),ascended:s.ascended,source:found.source};
 }catch(e){return {status:'invalid',role:id,slot:n,error:e.message};}}
 list(){return Object.keys(D.RACES).map(id=>this.status(id));}
 listSlots(id,start=1,count=100){this.check(id);this.slot(start);if(!Number.isInteger(count)||count<1||count>100)throw Error('读取档数无效');return Array.from({length:Math.min(count,101-start)},(_,i)=>this.status(id,start+i));}
 save(id,game,n=1){this.check(id);this.slot(n);if(this.dead(id,n))throw Error('此档已寿尽，不能保存');
  if(game.s.ended||game.s.race!==id||game.s.character!==id||game.s.version!==14)throw Error('拒绝写入错误种族或终结存档');
  const valid=new Game(game.state(),261014,id),raw=JSON.stringify(valid.state()),key=this.key(id,n),prior=this.readKey(key);
  if(prior&&prior!==raw){try{const old=JSON.parse(prior);new Game(old,261014,id);this.storage.setItem(this.backupKey(id,n),prior);}catch(e){/* If quota blocks a backup, primary remains intact until its own atomic write. */}}
  this.storage.setItem(key,raw);return true;
 }
 newGame(id,seed=261014,n=1,birth=null){this.check(id);this.slot(n);
  if(!this.dead(id,n)&&(this.readKey(this.key(id,n))||this.readKey(this.backupKey(id,n))))throw Error('该档位已有进度，禁止覆盖');
  const g=new Game(null,seed,id,birth);
  const legacy=this.legacy(id,n),up=legacy.upgrades;
  g.s.maxHp+=4*(up.vigor||0);g.s.hp+=4*(up.vigor||0);
  g.s.maxSpirit+=4*(up.spirit||0);g.s.spirit+=4*(up.spirit||0);
  g.s.attack+=up.attack||0;
  this.storage.setItem(this.key(id,n),JSON.stringify(g.state()));
  // Tombstone is removed only AFTER the new state was durably written.
  this.storage.removeItem(this.backupKey(id,n));this.storage.removeItem(this.deathKey(id,n));return g;
 }
 expire(id,n=1){this.check(id);this.slot(n);this.storage.setItem(this.deathKey(id,n),JSON.stringify({race:id,slot:n,reason:'寿元归零',at:new Date().toISOString()}));this.storage.removeItem(this.key(id,n));this.storage.removeItem(this.backupKey(id,n));return true;}
 sourceKeys(){const out=[];for(const role of ['sword','herb'])for(let n=1;n<=100;n++)out.push({key:'qinglan-wendao-v11-'+role+(n===1?'':'-slot-'+String(n).padStart(3,'0')),label:(role==='sword'?'旧剑修':'旧丹修')+' · '+String(n).padStart(3,'0')});
  if(!this.readKey(D.MIGRATION_KEY)&&!this.readKey(D.DEATH_KEY))for(const key of [D.SAVE,...D.LEGACY])out.push({key,label:'旧单角色进度'});return out;
 }
 migrationKey(source){return 'qinglan-wendao-v14-imported:'+encodeURIComponent(source);}
 legacyCandidates(){const out=[];for(const entry of this.sourceKeys()){
  if(this.readKey(entry.key+'-death')||this.readKey(this.migrationKey(entry.key)))continue;
  for(const key of [entry.key,entry.key+'-backup']){const raw=this.readKey(key);if(!raw)continue;
   try{const state=JSON.parse(raw);if(state.version>=14)break;const g=new Game(state,261014,'human');out.push({...entry,state,realm:g.realm,day:g.day});break;}catch{}
  }
 }return out;}
 legacyCandidate(){return this.legacyCandidates()[0]||null;}
 migrate(id,n=1,sourceKey=null){this.check(id);this.slot(n);if(id!=='human')throw Error('旧角色仅继承为人族，妖族需新建');
  if(this.dead(id,n))throw Error('寿尽档位须先选择新轮回，不可用旧档复活');
  if(this.readKey(this.key(id,n))||this.readKey(this.backupKey(id,n)))throw Error('目标档位非空，禁止覆盖');
  const candidates=this.legacyCandidates(),source=sourceKey?candidates.find(x=>x.key===sourceKey):candidates[0];if(!source)throw Error('没有可继承的旧版存档');
  const g=new Game(source.state,261014,'human'),marker=this.migrationKey(source.key);
  // Reserve source before writing the destination: failed source claims cannot duplicate a migration.
  this.storage.setItem(marker,JSON.stringify({race:id,slot:n}));
  try{this.save(id,g,n);}catch(e){try{this.storage.removeItem(marker);}catch{}throw e;}
  return g;
 }
}

 try{slots.settleLegacy(activeRole,activeSlot,game);slots.expire(activeRole,activeSlot);saveStatus='寿元已尽 · 仅当前档位已清除';deathBoot=true;return true;}
 catch{saveStatus='存储受限 · 无法保证删档';deathBoot=true;return false;}

function resetOldSlot(){const m=modal;if(!m||m.kind!=='rebuild-reset')return;
 try{
  const id=m.race,n=m.slot;
  localStorage.removeItem(slots.key(id,n));localStorage.removeItem(slots.backupKey(id,n));
  const before=slots.legacy(id,n);before.balance=(before.balance||0)+m.tier;slots.putLegacy(id,n,before);
  const next=slots.newGame(id,261014,n,null);
