function mapTile(x,y,small=false){
 const s=game.s,valid=x>=0&&x<8&&y>=0&&y<8;
 if(!valid)return '<button class="tile boundary" disabled aria-label="地图边界，不可通行">·</button>';
 const key=game.key(x,y),seen=!!s.seen[key],l=game.land(x,y),site=D.SITES[key],current=s.pos.x===x&&s.pos.y===y;
 const dest=objective().point,goal=!!dest&&dest.x===x&&dest.y===y,visible=seen||goal;
 const home=game.isCampTile(x,y),ground=Object.values(s.caches[key]||{}).some(v=>v>0),ev=s.highEvents?.[s.zone],evOn=ev?.status==='pending'&&ev.tile===key;
 const mark=home?'府':ground?'拾':evOn?'异':l==='boss'?game.zone.bossMark:site?.mark||(l==='shrine'?glyph(game.zone.altar):null)||D.NAMED[key]?.[1]||D.LAND[l].mark;
 const name=visible?(home?game.campName():site?.name||D.NAMED[key]?.[0]||dest?.name||D.LAND[l].name):'未知地点';
 const locked=l==='boss'&&!s.ritual[s.zone]||l==='gate'&&!s.cleared[s.zone];
 return '<button class="tile '+(visible?'seen':'fog')+' '+(s.visited[key]?'visited':'')+' '+(visible&&(home||site||goal||evOn||['campsite','shrine','boss','gate'].includes(l))?'landmark':'')+' '+(goal?'q3-target':'')+' '+(route.some(p=>p.x===x&&p.y===y)?'route':'')+' '+(current?'current':'')+' '+(visible&&locked?'locked':'')+'" data-a="'+(small?'mini-step':'map')+'" data-x="'+x+'" data-y="'+y+'" '+(current?'disabled aria-current="location"':'')+' title="'+esc(name+(goal?' · 主线目标':'')+(locked&&visible?' · 未解锁':''))+'" aria-label="'+esc(name)+'，'+(x+1)+'列'+(y+1)+'行'+(goal?'，主线目标':'')+(current?'，当前位置':locked&&visible?'，未解锁':'')+'">'+(current?'我':visible?mark:'?')+'</button>';
}

/* ===== V90.9 阶段成长指引（只读呈现层，不建立第二套进度账本） =====
   全部数据直接读取现有存档与现有配置表：
   game.s（ritual / cleared / level / daoXp / settlements / hunger / water / spirit）
   D.ASCENSION_STAGES、D.ITEMS、D.RES、D.RESOURCE_LAYOUT、D.ZONES
   任何判定都不写回存档，也不改变既有规则。 */

function progStage(){
  const s=game.s;
  if(s.zone<5) return null;
  const st=D.ASCENSION_STAGES[s.zone-5];
  const prev=D.ASCENSION_STAGES[s.zone-6];
  return st?{st,cur:prev?prev.realm:'筑基',goal:st.realm}:null;
}

/* 材料来源：由 RES.loot -> RESOURCE_LAYOUT -> ZONES.map 逐层真实推导 */
function progMatSource(id){
  const s=game.s, zi=s.zone;
  const hits=[];
  for(const [rid,res] of Object.entries(D.RES)){
    if(!res||!res.loot||!(id in res.loot))continue;
    hits.push({rid,res});
  }
  if(!hits.length)return null;
  const zones=[zi].concat(D.ZONES.map((_,i)=>i).filter(i=>i!==zi));
  for(const rid of hits.map(h=>h.rid)){
    for(const z of zones){
      const zz=D.ZONES[z];
      if(!zz||!zz.map)continue;
      const terrains=new Set();
      for(const row of zz.map)for(const t of row){
        const layout=D.RESOURCE_LAYOUT[t];
        if(layout&&layout.includes(rid))terrains.add(t);
      }
      if(terrains.size){
        const res=hits.find(h=>h.rid===rid).res;
        return {zone:z,zoneName:zz.name,res,terrainCount:terrains.size,
                tool:res.tool?D.TOOLS?.[res.tool]?.name||res.tool:null,minutes:res.minutes};
      }
    }
  }
  return null;
}

/* 条件清单：镜像 coreTrialReason / heartTrialReason 的判定项，但一次全部返回 */
function progRows(kind){
  const s=game.s, p=progStage(), rows=[];
  const ok=(label,pass,text,extra)=>({label,pass:!!pass,text,extra:extra||''});
  const zi=s.zone, z=D.ZONES[zi]||{};
  rows.push(ok('所在境域', s.zone===zi, (z.name||'')+(z.short?' · '+z.short:'')));
  rows.push(ok('本境问道坛', s.ritual[zi], s.ritual[zi]?'已完成':'未完成'));
  rows.push(ok('本境首领', s.cleared[zi], s.cleared[zi]?'已击败':'未击败'));
  if(p){
    rows.push(ok('等级要求', s.level>=18, s.level+'/18'));
    rows.push(ok('道行', s.daoXp>=p.st.needDao, s.daoXp+'/'+p.st.needDao));
 rows.push(ok('渡劫消耗', s.hp>=game.tribDamage, '气血 '+game.tribDamage+' / 当前 '+s.hp+(game.tribPills?'（护劫丹 '+game.tribPills+' 颗 · 减伤 '+Math.round(game.tribReduce*100)+'%）':'')));
    for(const [id,n] of [[p.st.primary,2],[p.st.secondary,1]]){
      const item=D.ITEMS[id]||{name:id};
      const inv=s.inv[id]||0, stash=(game.storageReady?s.settlements[zi]?.stash?.[id]:0)||0;
      const have=game.has(id);
      rows.push(ok(item.name, have>=n, have+'/'+n,
        '随身 '+inv+(stash?' · 仓库 '+stash:'')));
    }
  }
  const camp=s.settlements[zi];
  rows.push(ok('本境洞府', !!camp, camp?'已建立':'尚未建立'));
  rows.push(ok('位于本境洞府', game.atCamp, game.atCamp?'是':'否'));
  if(kind==='core'){
    const t=game.coreTrial;
    rows.push(ok('三重雷劫', t.complete, t.phase+'/3'+(t.complete?'（已渡）':t.started?'（进行中）':'（未启）')));
  }else if(kind==='heart'){
    const h=game.heartTrial;
    rows.push(ok('三重问心', h.complete, h.phase+'/3'+(h.complete?'（已过）':h.started?'（入定中）':'（未启）')));
  }
  rows.push(ok('饱腹', s.hunger>2, String(s.hunger)));
  rows.push(ok('饮水', s.water>2, String(s.water)));
  if(kind==='core'||kind==='heart'){
    rows.push(ok('灵力', s.spirit>=3, s.spirit+'/'+s.maxSpirit));
  }
  return rows;
}

/* 下一步：只在所有未完成项中取最关键的一条，避免多个同等醒目的按钮 */
function progNext(kind){
  const s=game.s, p=progStage(), zi=s.zone, z=D.ZONES[zi]||{};
  if(!p) return null;
  if(!s.ritual[zi]) return {label:'前往本境问道坛完成仪式',hint:(z.altar||'问道坛')+'需要 '+(z.need?Object.entries(z.need).map(([k,n])=>(D.ITEMS[k]?.name||k)+'×'+n).join('、'):'仪式材料'),act:null};
  if(!s.cleared[zi]) return {label:'前往本境首领处',hint:'首领：'+(p.st.bossName||z.boss||'本境首领'),act:null};
  if(s.level<18) return {label:'修炼提升等级',hint:'当前 '+s.level+'/18，可打坐或采集积累修为',act:'meditate'};
  if(s.daoXp<p.st.needDao) return {label:'继续积累道行',hint:'道行 '+s.daoXp+'/'+p.st.needDao+'，需先修到本境后期圆满才能破境；问道坛、试炼与主线推进都会增长道行',act:'meditate'};
  const miss=[];
  for(const [id,n] of [[p.st.primary,2],[p.st.secondary,1]]){
    if(game.has(id)<n){
      const it=D.ITEMS[id]||{name:id}, src=progMatSource(id);
      miss.push({name:it.name,need:n,have:game.has(id),src});
    }
  }
  if(miss.length){
    const m=miss[0];
    const where=m.src?(m.src.zoneName+'的'+m.src.res.name+'（约 '+(m.src.tool?'需'+m.src.tool+'，':'')+'每次 '+m.src.minutes+' 分钟）'):'详细来源见图鉴';
    return {label:'采集 '+m.name+'（缺 '+(m.need-m.have)+'）',hint:where,act:'codex-open',args:'book'};
  }
  if(!s.settlements[zi]) return {label:'在本境建立洞府',hint:'破境须在本境洞府静修',act:'build'};
  if(!game.atCamp) return {label:'返回本境洞府',hint:'当前不在洞府坐标，无法静修破境',act:null};
  if(kind==='core'&&!game.coreTrial.complete) return {label:game.coreTrial.started?'继续三重雷劫（第'+(game.coreTrial.phase+1)+'重）':'进入三重雷劫',hint:'雷劫未渡，无法正式破境',act:'tribulation-open'};
  if(kind==='heart'&&!game.heartTrial.complete) return {label:game.heartTrial.started?'继续三重问心（第'+(game.heartTrial.phase+1)+'重）':'进入三重问心',hint:'问心未过，无法正式破境',act:'heart-open'};
  if(s.hunger<=2||s.water<=2) return {label:'先用餐与补水',hint:'饱腹 '+s.hunger+'、饮水 '+s.water+'，过低会在破境时额外扣血',act:null};
  return {label:'正式突破 · '+p.goal,hint:'全部条件已满足，消耗道材后破境',act:'breakthrough'};
}

function progGuide(kind,opts){
  const s=game.s, p=progStage();
  if(!p) return '';
  const rows=progRows(kind), next=progNext(kind);
  const done=rows.filter(r=>r.pass).length;
  const btn=opts&&opts.noAct?'' : next?next.act
    ? `<button class="btn primary prog-act" data-a="${next.act}"${next.args?` data-name="${next.args}"`:''}>${esc(next.label)}</button>`
    : `<p class="prog-hint">${esc(next.hint)}</p>`
    : '';
  return `<section class="prog-card" aria-label="阶段成长指引">
<div class="prog-head"><span class="prog-realm">${esc(p.cur)} → ${esc(p.goal)}</span><span class="prog-prog">${done}/${rows.length}</span></div>
<p class="prog-where">${esc(D.ZONES[s.zone]?.name||'')} · 第 ${s.zone+1} 境</p>
<div class="prog-rows">${rows.map(r=>`<div class="prog-row ${r.pass?'ok':'no'}"><span class="prog-mark">${r.pass?'✓':'✗'}</span><span class="prog-label">${esc(r.label)}</span><span class="prog-val">${esc(r.text)}</span>${r.extra?`<small class="prog-extra">${esc(r.extra)}</small>`:''}</div>`).join('')}</div>
${next?`<div class="prog-next"><strong>下一步</strong><span>${esc(next.hint)}</span></div>`:''}
${btn}
</section>`;
}

function daoBody(){
 const s=game.s,vow=game.daoStele,phase=vow.phase,blocked=game.daoReason();
 const current=D.DAO_PATHS.find(q=>q.id===vow.path);
 const roots=game.daoRoots(),explanation=game.daoEchoes();
 const stats=`<div class="trial-stats dao-metrics"><span>气血 ${s.hp}/${s.maxHp}</span><span>${game.character.energy} ${s.spirit}/${s.maxSpirit}</span><span>旧碑 ${roots.stele===1?'守名':roots.stele===2?'取符':'未选择'}</span><span>道誓 ${phase===0?'未观':phase===1?'待择':phase===2?'待履':'已成'}</span></div>`;
 const header=`<div class="trial-intro"><small>大乘古道 · 第4列第4行 · 非强制支线</small><h3>大道残碑 · 三途问道</h3><p>古碑尚存三种不同的誓辞：留住证物、识破假相，或让因果止于自身。你只能走一条，但不必提前完成任何可选的旧事。此处不是新的突破门槛，也不会赐予跨境战力。</p></div>`;
 const steps=`<div class="trial-steps dao-steps">${[['观碑',phase>=1],['择道',phase>=2],['履誓',phase>=3]].map(([name,ok],i)=>`<div class="trial-step ${ok?'done':i===phase?'current':''}"><span>${i+1}</span><b>${name}</b></div>`).join('')}</div>`;
 const echoes=`<section class="dao-echoes"><div class="dao-section-label">古碑回响 <small>${phase>=2?'立誓时封存的经历':'此时确已发生的经历'}</small></div>${explanation.map((line,i)=>`<p><b>${['一','二','三'][i]}.</b> ${esc(line)}</p>`).join('')}</section>`;
 let controls='';
 if(phase===0){
  const why=blocked||game.daoReady(4,20,1,1);
  controls=`<section class="trial-stage"><div class="trial-note"><strong>先读残碑，再见三途</strong><p>观碑耗时20分钟、${game.character.energy}−${game.daoActionCost(4,20).spirit}、饱腹与饮水各−1。此步没有直接伤害、材料消耗或一次性奖励。</p>${why?'<p class="danger-text">'+esc(why)+'</p>':''}</div><button class="btn primary trial-start" data-a="dao-read" ${why?'disabled':''}>观碑 · 辨三途原文</button></section>`;
 }else if(phase===1){
  const ready=blocked||game.daoReady(3,20,1,1);
  const routes=D.DAO_PATHS.map(q=>{
   const preview=game.daoPreview(q.id);
   const prereq=Object.entries(preview.cost).map(([k,v])=>D.ITEMS[k].name+'×'+v).join('、');
   const loot=Object.entries(preview.loot).map(([k,v])=>D.ITEMS[k].name+'×'+v).join('、');
   const echo=q.id==='preserve'&&roots.stele===1?'守碑留名已发生，本次履誓所需灵力略减。':
    q.id==='discern'&&roots.mirror?'你确已辨明云海真卷，本次神识反噬较轻。':
    q.id==='compassion'&&roots.karma===1?'合体追索已真实和解，本次所需止血草减少。':
    '未经历对应旧事也能选择此道，但不会凭空获得既往优势。';
   return `<button class="trial-option dao-route" data-a="dao-choose" data-path="${q.id}" ${ready?'disabled':''}><span class="trial-option-top"><strong>${q.name} · ${q.tag}</strong><small>三途择一</small></span><span class="trial-option-desc">${q.story}</span><span class="dao-path-context">${echo}</span><span class="trial-option-risk">立誓20分钟、${game.character.energy}−${game.daoActionCost(3,20).spirit}；履誓材料：${prereq}；履誓受伤 ${preview.damage}；完成得${loot}</span></button>`;
  }).join('');
  controls=`<section class="trial-stage"><div class="trial-note"><strong>慎立道誓 · 选择即锁定</strong><p>立誓时不消耗正式履誓的材料。你可以先看清三路前置与风险，选定之后随时离开准备资源，却不能重选道途。</p>${ready?'<p class="danger-text">'+esc(ready)+'</p>':''}</div><div class="trial-options">${routes}</div></section>`;
 }else if(phase===2){
  const p=game.daoPreview(vow.path);
  const missing=Object.entries(p.cost).filter(([id,n])=>game.has(id)<n);
  const ready=blocked||game.daoReady(p.spirit-game.extra(p.minutes).spirit,p.minutes,p.hunger,p.water);
  const costText=Object.entries(p.cost).map(([id,n])=>`${D.ITEMS[id].name} ${game.has(id)}/${n}`).join('、');
  const rewardText=Object.entries(p.loot).map(([id,n])=>D.ITEMS[id].name+'×'+n).join('、');
  const fatal=p.damage>=s.hp;
  controls=`<section class="trial-stage"><div class="trial-note"><strong>${current.name} · 道誓已锁定</strong><p>${current.story}</p><p>可返回洞府收集材料并补足气血。之前的观碑与立誓无需重做；履誓前若资源不足不会扣费。</p></div><div class="dao-fulfill"><strong>履誓结算预览</strong><div class="dao-fulfill-meta"><span>需 ${costText}</span><span>${game.character.energy}−${p.spirit}</span><span>耗时${p.minutes}分钟 · 食水各−2</span><span class="${fatal?'danger-text':''}">预计气血−${p.damage}${fatal?' · 可能重伤折寿':''}</span><span>完成：${rewardText}</span></div><p class="micro">如因反噬重伤：按原规则折寿，已消耗的履誓材料不返还，但路线仍保留，可休整后再试。</p>${ready||missing.length?'<p class="micro danger-text">'+esc(ready||('仍缺道材：'+missing.map(([id,n])=>D.ITEMS[id].name+'×'+(n-game.has(id))).join('、')))+'</p>':''}<button class="btn primary dao-submit" data-a="dao-fulfill" ${ready||missing.length?'disabled':''}>确认履行 · 结算道誓</button></div></section>`;
 }else{
  const p=game.daoPreview(vow.path);
  const reward=Object.entries(p.loot).map(([id,n])=>D.ITEMS[id].name+'×'+n).join('、');
  controls=`<div class="trial-success"><strong>${current?.name||'大道'}已成 · 本档终局记录</strong><p>${esc(game.daoEndingText())}</p><p>履誓奖励：${reward}，已经由游戏原有负重与拾遗机制结算。此处不会再次扣费或发奖。</p></div>`;
 }
 return `<div class="trial-page dao-page">${header}${stats}${steps}${echoes}${controls}<p class="trial-footer">此道属于凡界古碑传承，不增加境界、永久伤害或战斗词条。所选路线记入本档，未来的天门故事可依据已经完成的道誓回应。</p><button class="btn dao-return" data-a="dao-return">← 返回大乘古道 · 保留记录</button></div>`;
}
function karmaBody(){
 const s=game.s,isMarsh=game.site?.id==='karma-marsh';
 const testimony=game.karmaWitness,final=game.karmaReckoning;
 const done=final.ending>0,read=testimony.stage>=1,taken=testimony.stage===2;
 const word=game.character.energy,reason=game.karmaReason(isMarsh?'marsh':'city');
 const intro=isMarsh
  ?'<small>玄阴幽沼 · 第4列第7行 · 因果前章</small><h3>渡魂残灯 · 谁曾守印</h3><p>幽沼尽头，一盏旧灯压着几页被水浸透的证词。它讲述古修如何封住旧仙路，却未写尽后裔所承受的流亡之苦。这里的一次决定，会在日后遇到追索者时产生不同回应。</p>'
  :'<small>合体仙城 · 第4列第4行 · 因果回收</small><h3>旧印问债台 · 旧怨未尽</h3><p>旧印司后裔在断裂的城墙下等待携带真证的人。他说城中传闻当年守印人背叛修士，才引来天阙灾变；你是否有证据、曾否碰过失名符，都决定他如何看待你。</p>';
 const header='<div class="trial-intro">'+intro+'</div>';
 const stats='<div class="trial-stats"><span>旧碑 '+(s.flags.steleChoice===1?'守名':s.flags.steleChoice===2?'取符':'未选择')+'</span><span>玄阴 '+(taken?(testimony.choice===1?'留证':'封印'):read?'已读证词':'未探')+'</span><span>城中 '+(done?(final.ending===1?'和解':'旧怨未了'):'未结')+'</span></div>';
 const memory='<div class="trial-note karma-memory"><strong>与旧事对应</strong><p>'+esc(game.karmaOldMemory())+'</p></div>';
 let content='';
 if(isMarsh){
  if(!read){
   const why=reason||game.karmaReady(4,1,1,20);
   content='<section class="trial-stage">'+memory+'<p>先验看残灯所存供词。观灯耗时20分钟、'+word+'−'+game.karmaActionCost(4,20).spirit+'（含当地环境）、饱腹与饮水各−1；只记录真实线索，不会领取高境装备。</p>'+ (why?'<p class="danger-text">'+esc(why)+'</p>':'')+
    '<button class="btn primary trial-start" data-a="karma-read" '+(why?'disabled':'')+'>照看残灯 · 读旧印证词</button></section>';
  }else if(!taken){
   const routes=[
    {choice:1,title:'保留亡者证言 · 留待后裔核对',text:'以一份止血草固灯芯，把亡者关于当年封路的证词传到后世。你承诺保存证据，并非保证所有人都会信服。',mat:'止血草×1',cost:{herb:1},sp:6,time:35,loot:'古阵残纹×1'},
    {choice:2,title:'封存追魂旧印 · 不替亡者立誓',text:'以一份低阶灵石封住残魂，记下可以核对的印痕。保住旧印，却不主动为任何一方作证。',mat:'低阶灵石×1',cost:{stone:1},sp:4,time:30,loot:'灵尘×2'}
   ];
   const choices=routes.map(q=>{
    const missing=!game.enough(q.cost),why=reason||game.karmaReady(q.sp,1,1,q.time);
    return `<button class="trial-option karma-choice" data-a="karma-witness" data-choice="${q.choice}" ${missing||why?'disabled':''}><span class="trial-option-top"><strong>${q.title}</strong><small>${q.mat}</small></span><span class="trial-option-desc">${q.text}</span><span class="trial-option-risk">耗时${q.time}分钟 · ${word}−${game.karmaActionCost(q.sp,q.time).spirit}（含环境） · 食水各−1 · 奖励${q.loot}${missing?' · 材料不足':''}${why?' · '+esc(why):''}</span></button>`;
   }).join('');
   content='<section class="trial-stage">'+memory+'<div class="trial-note"><strong>供词已读 · 最后一次取舍</strong><p>残灯留下两个互斥选择；这不是全局善恶值。今天做出的选择会冻结在当前种族与档位之中，不能反复领取。</p></div><div class="trial-options">'+choices+'</div></section>';
  }else{
   const route=testimony.choice===1?'你决定保留守印人的证言，曾交付止血草固定灯芯。':'你选择封存追魂旧印，留下可核对的旧纹，却未代亡魂立誓。';
   content='<div class="trial-success"><strong>玄阴旧事已记</strong><p>'+route+'</p><p>将来若遇上寻找守印遗物的后裔，你可以持当日的证据回答。此地不再扣费或重复领奖。</p></div>'+memory;
  }
 }else{
  const relation=s.flags.steleChoice===1?'后裔翻看你留下的旧名，想知道当年为何有人愿守一个亡者的清白。':s.flags.steleChoice===2?'你当年收取的符纹，与追索者的家印相合；对方的疑虑更深。':'后裔并不认识你；没有证据时，他不会将你当成昔日立誓者。';
  if(done){
   content='<div class="trial-success"><strong>'+(final.ending===1?'旧案归档 · 化怨为和':'旧印暂息 · 仍存仇怨')+'</strong><p>'+esc(game.karmaEndingStory())+'</p><p>此结局只在本档发生一次。已经选择的道路不会反悔或再次领取奖励。</p></div>';
  }else if(!taken){
   content='<div class="trial-note"><strong>追索者尚未见到可信凭据</strong><p>'+relation+'</p><p>你尚未在玄阴渡魂残灯留下证词或魂印，不能声称曾与亡魂达成约定。可前往第四图第4列第7行调查，也可以忽略本事件继续原有修行与破境。</p><p class="micro">此时不扣任何物资，也不强制打开其他地图。</p></div>';
  }else{
   const herb=game.karmaReconcileCost().herb,injury=game.karmaDefyDamage(),fatal=injury>=s.hp;
   const agreeReason=reason||game.karmaReady(6,2,2,40),fightReason=reason||game.karmaReady(10,2,2,45);
   const agreeMissing=!game.enough({herb}),agreeDesc=testimony.choice===1?'你将当日保存的完整证言递交旧印司，止住对方的追索。':'你亲手拆下封魂旧印，把事主的最后印痕交还后裔，允其核验。';
   const choices=`<button class="trial-option karma-choice" data-a="karma-final" data-mode="reconcile" ${agreeReason||agreeMissing?'disabled':''}><span class="trial-option-top"><strong>呈证解怨 · 不再互相追索</strong><small>止血草×${herb}</small></span><span class="trial-option-desc">${agreeDesc}此路代价受青岚旧碑与玄阴旧证的实际经历影响。</span><span class="trial-option-risk">耗时40分钟 · ${word}−6 · 食水各−2 · 无直接伤害 · 成功得上古残卷×1${agreeMissing?' · 止血草不足':''}${agreeReason?' · '+esc(agreeReason):''}</span></button>`+
   `<button class="trial-option karma-choice ${fatal?'danger':''}" data-a="karma-final" data-mode="defy" ${fightReason?'disabled':''}><span class="trial-option-top"><strong>持印破阵 · 拒绝旧印司追索</strong><small>${word}−10</small></span><span class="trial-option-desc">以修为破开索债阵，带着自己的旧事脱身。虽可击退来人，却不能将仇怨伪写为和解。</span><span class="trial-option-risk ${fatal?'fatal':''}">耗时45分钟 · 食水各−2 · 预计气血−${injury}${fatal?' · 可能重伤折寿':''} · 成功得灵尘×2${fightReason?' · '+esc(fightReason):''}</span></button>`;
   content='<section class="trial-stage">'+memory+'<div class="trial-note"><strong>追索者已见真凭</strong><p>'+relation+'</p><p>玄阴因果：'+(testimony.choice===1?'曾保存亡者证词':'曾封存追魂旧印')+'。你可和解，或拒绝追索。两种结局互斥且不能重选，失败不会强制替你完成。</p></div><div class="trial-options">'+choices+'</div></section>';
  }
 }
 return '<div class="trial-page karma-page">'+header+stats+content+'<p class="trial-footer">早期没有发生过的选择不会写成回忆；旧碑、玄阴证词与合体结局分别记录。离开没有额外代价，故事不影响十二境原有首领和突破条件。</p><button class="btn karma-return" data-a="karma-return">← 返回当前地图 · 保存进度</button></div>';
}
function mirrorBody(){
 const s=game.s,st=game.mirrorTrial,reason=game.mirrorReason(),clues=st.clues||[];
 const seenSeal=clues.includes('seal'),seenEcho=clues.includes('echo');
 const locked=!st.complete&&game.day<st.lockedUntil;
 const ready=st.started&&seenSeal&&seenEcho&&!st.complete&&!reason&&!locked&&!game.mirrorCostReady(10,2,2);
 const story=s.flags.steleChoice===1?'当初你为无名古修守护名讳，那段碑文竟与镜台封印有几分相似。':s.flags.steleChoice===2?'私藏的失名护符在镜前微动，但它无法代你认定真伪。':'你尚未结下青岚断碑的因果，也能凭自己的证据辨真。';
 const header=`<div class="trial-intro"><small>化神云海 · 第4列第4行 · 可选奇遇</small><h3>映心镜台 · 三卷辨真</h3><p>云海深处，三份上古残卷同时映在镜面，字句皆似正道。古修留下的三卷只是引子，真正要辨的是史书里后来补上的伪印。</p></div>`;
 const stats=`<div class="trial-stats"><span>气血 ${s.hp}/${s.maxHp}</span><span>${game.character.energy} ${s.spirit}/${s.maxSpirit}</span><span>证据 ${clues.length}/2</span><span>寿元 ${game.lifeYears.toFixed(1)}年</span></div>`;
 const phases=[['观镜',st.started],['验印',seenSeal],['核音',seenEcho],['辨真',st.complete]];
 const steps=`<div class="trial-steps mirror-steps">${phases.map(([n,ok],i)=>`<div class="trial-step ${ok?'done':i===0&&!st.started?'current':''}"><span>${i+1}</span><b>${n}</b></div>`).join('')}</div>`;
 let stage='';
 if(!st.started){
  const why=reason||game.mirrorCostReady(4,1,1);
  stage=`<section class="trial-stage"><div class="trial-note"><strong>先观镜，再取证</strong><p>${esc(story)}</p><p>观镜需要15分钟、${game.character.energy}−4、饱腹和饮水各−1。此步不直接扣血。</p>${why?'<p class="danger-text">'+esc(why)+'</p>':''}</div><button class="btn primary trial-start" data-a="mirror-begin" ${why?'disabled':''}>观镜 · 显现三卷古文</button></section>`;
 }else{
  const proofs=[
   {id:'seal',name:'核验封阵印痕',desc:'检查镜背刻痕是否出自同一年代',done:seenSeal},
   {id:'echo',name:'核验镜底残音',desc:'对照丹雷与元婴问心的修行次序',done:seenEcho}
  ];
  const evidence=proofs.map(q=>{
   const detail=q.done?game.mirrorProof(q.id):'尚未勘验。需25分钟、'+game.character.energy+'−7、饱腹和饮水各−1；不直接扣血。';
   const why=reason||game.mirrorCostReady(7,1,1);
   return `<article class="mirror-evidence ${q.done?'mirror-evidence-done':''}"><div class="mirror-evidence-head"><strong>${q.name}</strong><small>${q.done?'已查明':'待调查'}</small></div><p>${esc(detail)}</p>${q.done?'':`<button class="btn" data-a="mirror-proof" data-kind="${q.id}" ${why?'disabled':''}>查验此证 · ${q.desc}</button>`}${!q.done&&why?'<p class="micro danger-text">'+esc(why)+'</p>':''}</article>`;
  }).join('');
  stage=`<section class="trial-stage"><p class="mirror-section-label">镜台证据 · 可分次探查</p><div class="mirror-evidence-grid">${evidence}</div><p class="micro">每条证据只需查验一次，中途离开不抹除记录。两条线索全部查明才可定卷。</p></section>`;
 }
 let selection='';
 if(st.started){
  const candidates=D.MIRROR_SCROLLS.map((q,i)=>{
   const bad=st.rejected.includes(q.id),good=st.complete&&st.choice===q.id;
   const tag=good?'已证真':bad?'已证伪':'真伪待辨';
   return `<button class="mirror-candidate ${bad?'mirror-candidate-false':''} ${good?'mirror-candidate-true':''}" data-a="mirror-choose" data-id="${q.id}" ${ready&&!bad?'':'disabled'}><span class="mirror-index">卷${i+1}</span><span class="mirror-content"><strong>${q.name}</strong><small>${q.saying}</small><em>${q.seal}</em></span><span class="mirror-status">${tag}</span></button>`;
  }).join('');
  const title=st.complete?'真传已辨':locked?'镜火封禁中':clues.length<2?'证据仍不完整':'请根据证据判断';
  const why=locked?'本次错判后封至第'+st.lockedUntil+'日。离开休整，隔日再来。':clues.length<2?'还需 '+(2-clues.length)+' 项证据，不允许盲猜。':ready?'两条证据已经齐备，选择任意一卷将立即结算。':reason||game.mirrorCostReady(10,2,2)||'已完成本档辨识。';
  selection=`<section class="trial-stage mirror-judgement"><p class="mirror-section-label">三卷同现 · 哪一卷是真迹？</p><div class="mirror-candidates">${candidates}</div><div class="trial-note"><strong>${title}</strong><p>${esc(why)}</p><p>作出判断均耗35分钟、${game.character.energy}−10、饱腹和饮水各−2。<b>若选错，预计气血−${game.mirrorHarm()}，可能重伤折寿；正确则不额外扣血。</b></p></div></section>`;
 }
 const finished=st.complete?(()=>{const chosen=D.MIRROR_SCROLLS.find(x=>x.id===st.choice);return `<div class="trial-success"><strong>辨真成功 · ${chosen?.name||'古修真卷'}</strong><p>古修当年用镜阵隔绝破碎仙路，伪经则是灾变后有人借旧印冒名。镜后仍缺一位留名者的记录，留待后续因果回收。</p><p>获得化神果×1、上古残卷×1。仅可领取一次；负重不足时原地待拾，不增加永久战力。</p></div>`;})():'';

 const opt=[

 ];
 const options=(phase===1||phase===2)&&!done?opt.map(o=>{
  const p=game.riftPreview(o.mode);if(!p)return '';

 }).join(''):'';

 else if(!phase)middle=`<div class="trial-note"><strong>先观潮，再入隙</strong><p>${lore}</p><p>初次勘察耗15分钟、${game.character.energy}4、饱腹1、饮水1，不会直接扣血；探明后可以当天或日后再尝试穿越。</p>${hint?'<p class="danger-text">'+hint+'</p>':''}</div><button class="btn primary trial-start" data-a="rift-scout" ${canStart?'':'disabled'}>观察空间潮汐 · 留下方向线索</button>`;
 else middle=`<section class="trial-stage"><div class="trial-note"><strong>第${phase}层 · 稳向在${readable}</strong><p>${description}</p><p>每次跨越耗时40分钟、饱腹2、饮水2；方向与防具已计入损伤。站错方向会遭到空间反噬；选定锚可耗虚空石避险。</p>${hint?'<p class="danger-text">'+hint+'</p>':''}</div><div class="trial-options">${options}</div></section>`;

let craftTier=null;

const CRAFT_CATS_HELP=[
 {key:'all',name:'全部配方',sub:'按可炼制程度排序'},
 {key:'food',name:'丹药 · 食物',sub:'回血、灵机与补给'},
 {key:'tool',name:'工具',sub:'斧、镐等采集工具'},
 {key:'gear',name:'装备',sub:'武器与防具，品质随机'},
 {key:'bag',name:'储物袋',sub:'每档永久增加负重'}
];

function craftStat(r){
 const done=(r.storageBag&&game.hasStorageBag(r.storageBag))||(r.unique&&game.has(r.item))||(r.flag&&game.s.flags[r.flag]);
 const wrong=game.recipeRequirement(r);
 return {done,wrong,ok:!done&&!wrong&&game.enough(r.cost)};
}

function craftRowsFor(key){
 return D.RECIPES.filter(r=>(r.zone||0)<game.s.unlocked)
  .filter(r=>key==='all'||(key==='bag'?!!r.storageBag:key==='tool'?r.type==='工具':key==='gear'?!!(r.gear||r.flag):r.type==='丹药'||r.type==='食物'));
}

function craftCounts(rows){const c={ok:0,mat:0,other:0};for(const r of rows){const s=craftStat(r);if(s.ok)c.ok++;else if(!s.wrong)c.mat++;else c.other++;}return c;}

function craftBody(){
 const all=craftRowsFor('all'),total=craftCounts(all);
 const rows=CRAFT_CATS_HELP.map(c=>{
  const list=craftRowsFor(c.key),st=craftCounts(list);
  return `<button type="button" class="cult-nav-row" data-a="panel-step" data-name="craft-cat" data-cat="${c.key}">`+
   `<span class="cult-nav-main"><b>${c.name}</b><small>${c.sub}</small></span>`+
   `<span class="cult-nav-right">${list.length?'可炼 '+st.ok+' / '+list.length:'暂无解锁'}<i>›</i></span></button>`;
 }).join('');
 return `<div class="craft-summary"><span class="craft-ok">可炼制 ${total.ok}</span><span>缺材料 ${total.mat}</span><span>未就绪 ${total.other}</span><span class="craft-total">共 ${all.length}</span></div>`+
  `<p class="muted">按类型进入；每个类型内按「可炼制 → 缺材料 → 未就绪」排序，采集指路保留。</p>`+
  `<nav class="cult-nav" aria-label="炼制品类">${rows}</nav>`;
}

function craftListBody(){
 const all=craftRowsFor(filter);
 const tiers=[...new Set(all.map(r=>Number(r.tier)||1))].sort((a,b)=>a-b);
 if(craftTier===null&&all.length>6&&tiers.length>1){
  const cat=CRAFT_CATS_HELP.find(c=>c.key===filter)||CRAFT_CATS_HELP[0];
  const rowsHtml=tiers.map(t=>{
   const list=all.filter(r=>(Number(r.tier)||1)===t),st=craftCounts(list);
   return `<button type="button" class="cult-nav-row" data-a="panel-step" data-name="craft-tier" data-tier="${t}">`+
    `<span class="cult-nav-main"><b>${t} 阶</b><small>${cat.name}</small></span>`+
    `<span class="cult-nav-right">可炼 ${st.ok} / ${list.length}<i>›</i></span></button>`;
  }).join('');
  return `<div class="craft-summary"><span class="craft-ok">可炼制 ${craftCounts(all).ok}</span><span>共 ${all.length}</span></div>`+
   `<p class="muted">按品阶进入；同一阶内按「可炼制 → 缺材料 → 未就绪」排序。</p>`+
   `<nav class="cult-nav" aria-label="品阶段">${rowsHtml}</nav>`;
 }
 const rows=craftTier===null?all:all.filter(r=>(Number(r.tier)||1)===craftTier),counts=craftCounts(rows);
 const bar=`<div class="craft-summary"><span class="craft-ok">可炼制 ${counts.ok}</span><span>缺材料 ${counts.mat}</span><span>未就绪 ${counts.other}</span><span class="craft-total">共 ${rows.length}</span></div>`;
 const sorted=[...rows].sort((a,b)=>{const ra=craftStat(a),rb=craftStat(b);const ka=ra.ok?0:ra.wrong?2:1,kb=rb.ok?0:rb.wrong?2:1;return ka-kb;});
 if(!sorted.length)return bar+'<p class="muted">该类当前没有解锁的配方，提升境界或解锁新境域后会出现在这里。</p>';
 return bar+sorted.map(r=>{const s=craftStat(r),done=s.done,wrong=s.wrong;
   const miss=Object.keys(r.cost).filter(k=>game.has(k)<(r.cost[k]||0));
   const src=miss.length?progMatSource(miss[0]):null;
   const hint=src?`${(D.ITEMS[miss[0]]&&D.ITEMS[miss[0]].name)||miss[0]} 见于 ${src.zoneName} · ${src.res.name}`:'';
   return `<div class="recipe${s.ok?' recipe-ready':''}" id="recipe-${r.id}"><div class="recipe-top"><b>${r.name}</b><small>${r.storageBag?'负重 +'+D.STORAGE_BAGS.find(b=>b.id===r.storageBag).bonus:r.gear?'基础'+(r.gear==='weapon'?'攻击':'防御')+'+'+r.bonus:r.type}</small></div><div class="recipe-cost">${cost(r.cost)}</div><div class="recipe-bottom"><span>${r.room?D.BUILDINGS[r.room].name+' '+r.tier+'阶':r.home?'洞府炼制':'随身可制'}${wrong?' · '+wrong:r.storageBag?' · 本档永久生效，不叠加':r.gear?' · 品质随机':''}</span><button class="btn ${s.ok?'primary':''}" data-a="craft" data-id="${r.id}" ${done?'disabled':''}>${done?'已拥有':wrong?'缺设施':game.enough(r.cost)?'炼制':'缺材料'}</button></div>${hint?`<div class="recipe-hint">采集：${esc(hint)}</div>`:''}</div>`;}).join('');
}

function lifeRescueReady(){return !!(game&&game.s.ended&&game.s.life&&!game.s.life.rescued);}
function simulatedLifeRescue(){
 if(!lifeRescueReady()){notify('当前没有可续命的结算','warn');return false;}
 const ended=game.s.ended,hp=game.s.hp,left=game.s.life.left,used=game.s.life.rescued;
 game.s.ended=false;game.s.hp=Math.max(1,Math.round(game.s.maxHp*0.35));
 game.s.life.left=15*D.LIFE.yearMinutes;game.s.life.rescued=true;game.s.combat=null;
 if(!persist()){game.s.ended=ended;game.s.hp=hp;game.s.life.left=left;game.s.life.rescued=used;notify('保存未成功，未发放续命寿元','warn');return false;}
 modal=null;renderModal();render();notify('逆命续年 · 本世寿元+15年','ok');return true; }

}

<script id="visual-theme-r28">
(function(){
 const KEY='shan-ye-visual-theme-v1';
 window.applyVisualTheme=function(value,save){
  const theme=['mono','forest','immortal'].includes(value)?value:'forest';
  document.body.classList.toggle('theme-mono',theme==='mono');
  document.body.classList.toggle('theme-immortal',theme==='immortal');
  document.documentElement.setAttribute('data-visual-theme',theme);
  if(save){try{localStorage.setItem(KEY,theme)}catch(e){}}
  document.querySelectorAll('.theme-choice').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===theme)));
 };
 let preference='forest';try{preference=localStorage.getItem(KEY)||'forest'}catch(e){}
 window.applyVisualTheme(preference,false);
 new MutationObserver(()=>{const t=document.documentElement.getAttribute('data-visual-theme');document.querySelectorAll('.theme-choice').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===t)))}).observe(document.body,{subtree:true,childList:true});
})();
</script>

<script id="v47-ambient-fx">
(function(){
 const phone=()=>document.getElementById('phone');
 document.addEventListener('pointerup',function(ev){
  if(!document.body.classList.contains('theme-immortal')||document.body.classList.contains('fx-reduced')||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const target=ev.target.closest('button.resource,button.tile,.combat-actions button,.birth-attr-action button,.secret-cell');
  const host=phone();if(!target||!host||!host.contains(target))return;
  const h=host.getBoundingClientRect();const t=target.getBoundingClientRect();
  const x=Math.max(2,Math.min(h.width-2,t.left+t.width/2-h.left));const y=Math.max(2,Math.min(h.height-2,t.top+t.height/2-h.top));
  const palette=target.classList.contains('scene-monster')?['#ffb2cf','#ffcc8d']:target.classList.contains('scene-secret')?['#dcb4ff','#ffebad']:['#83f7e5','#e6d39a','#9fc7ff'];
  for(let i=0;i<7;i++){const p=document.createElement('i');p.className='v47-particle';p.style.left=x+'px';p.style.top=y+'px';p.style.setProperty('--dx',(Math.cos(i*Math.PI*2/7)* (18+(i%3)*9))+'px');p.style.setProperty('--dy',(Math.sin(i*Math.PI*2/7)* (18+(i%3)*9))+'px');p.style.setProperty('--particle-color',palette[i%palette.length]);host.append(p);p.addEventListener('animationend',()=>p.remove(),{once:true});}
 },{passive:true});
 const observer=new MutationObserver(()=>{const reduced=!!document.querySelector('#phone.reduced');document.body.classList.toggle('fx-reduced',reduced);});
 document.addEventListener('DOMContentLoaded',()=>{if(phone())observer.observe(phone(),{attributes:true,attributeFilter:['class']});});
})();
</script>
