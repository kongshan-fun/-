  if(c.enemy){this.startBattle(c.enemy);this.s.combat.siteReward={key,choice};return {ok:true,combat:true};}
  this.eventReward(key,choice);return this.note('奇遇完成 · '+e.name,'ok');
 }

 }
 train(){if(!this.workshop||this.s.combat)return this.fail('请归营后试剑');return this.startBattle('dummy');}
 hunt(){if(this.s.combat||this.land()!=='boss')return this.fail('需前往首领所在地点');if(!this.s.ritual[this.s.zone])return this.fail('先完成本境封印');if(this.s.cleared[this.s.zone]&&this.s.bossDaily[this.s.zone]===this.day)return this.fail('今日已挑战，次日再战');return this.startBattle(this.zone.boss,this.s.cleared[this.s.zone]);}
 finishTraining(won){const b=this.s.combat;if(!b?.training)return;Object.assign(this.s,b.before);this.s.combat=null;if(won)this.s.stats.training++;this.log(won?'试剑完成，未消耗真实物资。':'已结束练习。','good');this.note(won?'试剑完成 · 无损耗':'已结束练习','ok');}
 fight(mode){const b=this.s.combat;if(!b)return this.fail('当前没有战斗');if(!['attack','spell','guard','heal','escape','mana'].includes(mode))return this.fail('无效战斗指令');let guard=false;
  if(mode==='escape'){
   if(b.training){this.finishTraining(false);return {ok:true};}if(b.type.startsWith('boss'))return this.fail('首领战不能撤离');if(this.random()<.8){this.s.combat=null;this.s.pos=copy(this.s.last);this.reveal();this.tick(15,1,1,4);return this.note('成功撤离');}this.log('撤离失败。','bad');
  }else if(mode==='attack'||mode==='spell'){
   if(mode==='spell'&&this.s.spirit<this.spellCost)return this.fail('术法需'+this.spellCost+'灵力');if(mode==='spell')this.s.spirit-=this.spellCost;
   const base=this.s.attack+this.weapon+b.riposte,crit=this.random()*100<this.affix('crit'),boost=mode==='spell'?this.character.spellMult*(1+this.affix('spell')/100):1;
   const dmg=Math.max(1,Math.round(base*boost*(1+this.birthEffects.damage/100)*(.88+this.random()*.24)*(crit?1.5:1))-Math.max(0,b.armor-this.affix('pierce')))+this.affix('fire');
   const dealt=Math.min(b.hp,dmg);b.hp=Math.max(0,b.hp-dmg);b.riposte=0;const heal=Math.floor(dealt*this.affix('leech')/100);if(heal)this.s.hp=Math.min(this.s.maxHp,this.s.hp+heal);

   if(this.s.hp>=this.s.maxHp)return this.fail('气血已满');
   if(this.character.healSpell&&this.s.spirit>=14){this.s.spirit-=14;this.s.hp=Math.min(this.s.maxHp,this.s.hp+28);this.log('回春术 · 消耗灵力14，回复气血28','good');}
   else{if(b.training){if(!b.virtualHeals)return this.fail('练习药已用完');b.virtualHeals--;}else{if(!(this.s.inv.salve>0))return this.fail('回春散不足');this.s.inv.salve--;}
    const amount=Math.round((this.character.healSpell?40:32)*(1+this.birthEffects.heal/100));this.s.hp=Math.min(this.s.maxHp,this.s.hp+amount);this.log('回春散 · 气血+'+amount,'good');}

  }else if(mode==='mana'){
   if(this.s.spirit>=this.s.maxSpirit)return this.fail('灵力已满');if(b.training){this.s.spirit=Math.min(this.s.maxSpirit,this.s.spirit+40);}else{if(!(this.s.inv.mana>0))return this.fail('回灵丹不足');this.s.inv.mana--;this.s.spirit=Math.min(this.s.maxSpirit,this.s.spirit+40);}
  }

  if(b.intent==='recover'){b.hp=Math.min(b.maxHp,b.hp+7);this.log(D.ENEMIES[b.type].name+'调息恢复7。');}
  else{let damage=Math.max(1,Math.round(b.atk*(b.intent==='heavy'?1.65:1)*(.88+this.random()*.24))-this.armor-this.affix('ward'));if(guard)damage=Math.max(1,Math.floor(damage*.25));this.s.hp=Math.max(b.training?1:0,this.s.hp-damage);this.log(`受到${damage}伤害${guard?'（已防守）':''}`,'bad');if(!this.s.hp){this.collapse();return {ok:false};}}
  b.turn++;b.intent=b.turn%3===0?'heavy':b.turn%5===0?'recover':'attack';return {ok:true};
 }
 win(){const b=this.s.combat;if(!b)return;const e=D.ENEMIES[b.type],boss=b.type.startsWith('boss');this.s.combat=null;this.s.stats.kills++;this.s.codex.enemies[b.type]=(this.s.codex.enemies[b.type]||1)+1;this.xp(e.xp);const lootText=this.loot(e.loot,'战利品');for(const drop of e.bonusLoot||[]){if(this.random()<drop.chance)this.loot({[drop.item]:drop.count||1},'额外战利品');}
  this.log('战胜'+e.name+' · 修为+'+e.xp,'good');if(boss||this.random()<.22)this.dropGear(boss?1:0,'击败'+e.name);if(b.siteReward)this.eventReward(b.siteReward.key,b.siteReward.choice);
  if(boss){const i=Number(b.type.slice(4)),first=!this.s.cleared[i];this.s.cleared[i]=true;this.s.bossDaily[i]=this.day;this.s.stats.bossWins++;this.s.flags.boss=this.s.cleared[0];if(i<=4)this.s.unlocked=Math.max(this.s.unlocked,Math.min(D.ZONES.length,i+2));
   if(first&&i<4)this.note('已解锁 '+D.ZONES[i+1].name,'ok','unlock');else if(first&&i===4)this.note('筑道之路已通，已解锁丹霞雷渊','ok','unlock');else if(first&&i>=5)this.note('道坛试炼已过 · 回本境洞府破境','ok','unlock');
  }else this.note('战胜'+e.name+' · 修为+'+e.xp+(lootText?' · '+lootText.split('；')[0].slice(0,34):''),'ok');
 }
 get bookCount(){return ['items','enemies','gears'].reduce((n,k)=>n+Object.keys(this.s.codex[k]).filter(id=>id!=='dummy').length,0)+Object.keys(D.BUILDINGS).filter(id=>this.s.settlements.some(c=>this.roomLevel(id,c)>0)).length;}
 claimBook(id){if(this.s.combat)return this.fail('请先结束斗法');const r=D.BOOK_REWARDS.find(r=>r.id===id);if(!r)return this.fail('未知奖励');if(this.s.codex.claims[id])return this.fail('此奖励已经领取');if(this.bookCount<r.need)return this.fail('图鉴发现数量不足');this.s.codex.claims[id]=true;const msg=this.loot(r.loot,'图鉴奖励');return this.note('已领取 · '+msg,'ok');}
 guide(action){const g=this.s.guide;if(action==='start'||action==='replay'){g.status='active';g.step=0;g.base=copy(this.s.stats);}else if(action==='resume'){if(g.status==='new')g.base=copy(this.s.stats);g.status=g.step>=D.GUIDE.length?'done':'active';}else if(action==='pause')g.status='paused';else if(action==='skip')g.status='skipped';this.updateGuide();return {ok:true};}

  const tests=[
   ()=>st.gathers>(b.gathers||0),
   ()=>!!(this.s.inv.axe||this.s.settlements.some(c=>c?.stash.axe)),
   ()=>!!this.camp,
   ()=>this.roomLevel('warehouse')>=1,
   ()=>st.stores>(b.stores||0)&&st.withdraws>(b.withdraws||0),
   ()=>this.roomLevel('forge')>=1,
   ()=>!!this.s.equipped.weapon,
   ()=>this.roomLevel('alchemy')>=1&&st.pillsMade>(b.pillsMade||0),
   ()=>st.books>(b.books||0),
   ()=>st.training>(b.training||0),

 }
 act(name,args={}){this.effects=[];if(this.s.ended)return {ok:false,permadeath:true,msg:'寿元已尽，本轮已终结'};let result;
  switch(name){
   case 'settle':result=this.settle(!!args.relocate);break;case 'build':result=this.build(args.id);break;
   case 'farm':result=this.harvestFarm();break;case 'provision':result=this.provision();break;case 'pickup':result=this.pickup(args.id,Number(args.qty)||999);break;

   case 'travel':result=this.travel(Number(args.zone),!!args.home);break;case 'scout':result=this.scout();break;
   case 'rest':result=this.rest(args.mode);break;case 'consume':result=this.consume(args.id);break;
   case 'craft':result=this.craft(args.id);break;case 'store':result=this.store(args.id,Number(args.qty)||999999);break;case 'withdraw':result=this.withdraw(args.id,Number(args.qty)||1);break;
   case 'discard':result=this.discard(args.id);break;case 'equip':result=this.equip(args.id);break;case 'salvage':result=this.salvage(args.id);break;
   case 'refine':result=this.refine(args.id);break;case 'claim-gear':result=this.claimGear(args.id);break;

/* V14: race × numbered save slot. Old keys are read-only, migrations explicit. */
(function(root){
'use strict';
const D=root.QData||(typeof require==='function'?require('./data.js'):null);
const Game=root.QGame||(typeof require==='function'?require('./engine.js'):null);
const B=D.BIRTH;
class RaceSlots{
 constructor(storage){this.storage=storage;}
 check(id){if(!Object.hasOwn(D.RACES,id))throw Error('未知种族');return id;}
 slot(n=1){n=Number(n);if(!Number.isInteger(n)||n<1||n>100)throw Error('存档位必须为1至100');return n;}
 key(id,n=1){return D.SLOT_PREFIX+this.check(id)+'-slot-'+String(this.slot(n)).padStart(3,'0');}
 backupKey(id,n=1){return this.key(id,n)+'-backup';}
 deathKey(id,n=1){return this.key(id,n)+'-death';}
 readKey(k){return this.storage.getItem(k);}
 dead(id,n=1){return !!this.readKey(this.deathKey(id,n));}
 read(id,n=1){this.check(id);this.slot(n);if(this.dead(id,n))throw Error('此档寿元已尽，请明确开启新轮回');
  let present=false;for(const [key,source] of [[this.key(id,n),'主存档'],[this.backupKey(id,n),'自动备份']]){
   const raw=this.readKey(key);if(!raw)continue;present=true;
   try{const obj=JSON.parse(raw);if(obj.version!==14||obj.race!==id||obj.character!==id)throw Error('种族身份不符');return {game:new Game(obj,261014,id),source};}catch{}
  }
  if(present)throw Error('此档数据损坏，已锁定防止覆盖');return null;
 }
 status(id,n=1){try{this.check(id);this.slot(n);if(this.dead(id,n))return {status:'dead',role:id,slot:n};const found=this.read(id,n);if(!found)return {status:'empty',role:id,slot:n};const g=found.game,s=g.s;
  return {status:'ready',role:id,slot:n,name:s.birth.name,grade:B.gradeName(s.birth),realm:g.realm,day:g.day,years:g.lifeYears.toFixed(1),ascended:s.ascended,source:found.source};
 }catch(e){return {status:'invalid',role:id,slot:n,error:e.message};}}
 list(){return Object.keys(D.RACES).map(id=>this.status(id));}
 listSlots(id,start=1,count=100){this.check(id);this.slot(start);if(!Number.isInteger(count)||count<1||count>100)throw Error('读取档数无效');return Array.from({length:Math.min(count,101-start)},(_,i)=>this.status(id,start+i));}
 save(id,game,n=1){this.check(id);this.slot(n);if(this.dead(id,n))throw Error('此档已寿尽，不能保存');
  if(game.s.ended||game.s.race!==id||game.s.character!==id||game.s.version!==14)throw Error('拒绝写入错误种族或终结存档');
  const valid=new Game(game.state(),261014,id),raw=JSON.stringify(valid.state()),key=this.key(id,n),prior=this.readKey(key);
  if(prior&&prior!==raw){try{const old=JSON.parse(prior);new Game(old,261014,id);this.storage.setItem(this.backupKey(id,n),prior);}catch(e){/* If quota blocks a backup, primary remains intact until its own atomic write. */}}

 newGame(id,seed=261014,n=1,birth=null){this.check(id);this.slot(n);
  if(!this.dead(id,n)&&(this.readKey(this.key(id,n))||this.readKey(this.backupKey(id,n))))throw Error('该档位已有进度，禁止覆盖');
  const g=new Game(null,seed,id,birth);this.storage.setItem(this.key(id,n),JSON.stringify(g.state()));
  // Tombstone is removed only AFTER the new state was durably written.
  this.storage.removeItem(this.backupKey(id,n));this.storage.removeItem(this.deathKey(id,n));return g;
 }
 expire(id,n=1){this.check(id);this.slot(n);this.storage.setItem(this.deathKey(id,n),JSON.stringify({race:id,slot:n,reason:'寿元归零',at:new Date().toISOString()}));this.storage.removeItem(this.key(id,n));this.storage.removeItem(this.backupKey(id,n));return true;}
 sourceKeys(){const out=[];for(const role of ['sword','herb'])for(let n=1;n<=100;n++)out.push({key:'qinglan-wendao-v11-'+role+(n===1?'':'-slot-'+String(n).padStart(3,'0')),label:(role==='sword'?'旧剑修':'旧丹修')+' · '+String(n).padStart(3,'0')});
  if(!this.readKey(D.MIGRATION_KEY)&&!this.readKey(D.DEATH_KEY))for(const key of [D.SAVE,...D.LEGACY])out.push({key,label:'旧单角色进度'});return out;
 }
 migrationKey(source){return 'qinglan-wendao-v14-imported:'+encodeURIComponent(source);}
 legacyCandidates(){const out=[];for(const entry of this.sourceKeys()){
  if(this.readKey(entry.key+'-death')||this.readKey(this.migrationKey(entry.key)))continue;
  for(const key of [entry.key,entry.key+'-backup']){const raw=this.readKey(key);if(!raw)continue;
   try{const state=JSON.parse(raw);if(state.version>=14)break;const g=new Game(state,261014,'human');out.push({...entry,state,realm:g.realm,day:g.day});break;}catch{}
  }

 legacyCandidate(){return this.legacyCandidates()[0]||null;}
 migrate(id,n=1,sourceKey=null){this.check(id);this.slot(n);if(id!=='human')throw Error('旧角色仅继承为人族，妖族需新建');
  if(this.dead(id,n))throw Error('寿尽档位须先选择新轮回，不可用旧档复活');
  if(this.readKey(this.key(id,n))||this.readKey(this.backupKey(id,n)))throw Error('目标档位非空，禁止覆盖');
  const candidates=this.legacyCandidates(),source=sourceKey?candidates.find(x=>x.key===sourceKey):candidates[0];if(!source)throw Error('没有可继承的旧版存档');
  const g=new Game(source.state,261014,'human'),marker=this.migrationKey(source.key);
  // Reserve source before writing the destination: failed source claims cannot duplicate a migration.
  this.storage.setItem(marker,JSON.stringify({race:id,slot:n}));
  try{this.save(id,g,n);}catch(e){try{this.storage.removeItem(marker);}catch{}throw e;}
  return g;
 }
}
root.QCharacterSlots=RaceSlots;if(typeof module!=='undefined'&&module.exports)module.exports=RaceSlots;
})(globalThis);

function archives(id,all,page,active){const c=B.RACES[id],used=all.filter(x=>x.status==='ready').length,empty=all.filter(x=>x.status==='empty').length,dead=all.filter(x=>x.status==='dead').length;
 const cells=all.slice(page*20,page*20+20).map(v=>{let title='新建修行',detail='空白档案';if(v.status==='ready'){title=v.name;detail=v.realm;}if(v.status==='dead'){title='已陨落';detail='可重新轮回';}if(v.status==='invalid'){title='档案损坏';detail='已锁定保护';}
 return `<button class="entry-save-cell ${v.status}" data-a="slot-open" data-role="${id}" data-slot="${v.slot}" ${v.status==='invalid'?'disabled':''} aria-label="第${num(v.slot)}档，${esc(title)}，${esc(detail)}"><span class="entry-save-id">${num(v.slot)}</span><span class="entry-save-info"><b>${esc(title)}</b><small>${esc(detail)}</small></span>${v.status==='ready'?`<small class="save-life">寿 ${v.years}年</small>`:`<small class="save-life">${v.status==='empty'?'+':v.status==='dead'?'↻':'—'}</small>`}</button>`;}).join('');
 return header('02','characters',c.name+' · 独立修行档案')+heading('第二步 · 选择一生',c.name+'档案','已建档可继续，空档先抽取天赋。')+`<div class="archive-count"><span><b>${used}</b> 在修</span><span><b>${empty}</b> 空档</span><span><b>${dead}</b> 陨落</span><span>共100档</span></div><section class="entry-content entry-save-content" aria-label="第${page+1}页档位"><div class="entry-save-grid">${cells}</div></section><footer class="entry-footer entry-save-footer"><nav class="entry-pagination" aria-label="存档分页"><button data-a="slot-page" data-d="-1" ${page===0?'disabled':''}>← 上页</button><strong>${page+1}<small> / 5</small></strong><button data-a="slot-page" data-d="1" ${page===4?'disabled':''}>下页 →</button></nav><div class="entry-footer-tools"><button data-a="characters">返回种族</button>${active?'<button data-a="slot-back">返回游戏</button>':''}</div><p>陨落不波及其他档位 · 不覆盖旧版存档</p></footer>`;
}
function birth(b,slot,draws,hasLegacy,dead=false){const c=B.profile(b),e=B.effects(b);return header('03','birth-back',c.name+' · 第'+num(slot)+'档')+heading('第三步 · 定下此生命格','初入凡尘',dead?'新轮回将创建新天赋，旧角色不会复活。':'免费重抽；确认入世后天赋固定。')+
 `<section class="entry-content birth-content"><label class="birth-name-label">道号<input id="birth-name" maxlength="12" value="${esc(b.name)}" autocomplete="off" aria-label="道号，最多12字"></label><div class="birth-traits">${B.cards(b).map(([k,v,n])=>`<div class="birth-trait"><small>${k}</small><div><b>${esc(v)}</b><span>${esc(n)}</span></div></div>`).join('')}</div><h3 class="birth-subhead">这一世的起点</h3>${stats(c)}<div class="birth-effect-summary">修为获取 +${e.xp}% · 攻势 +${e.damage}%<br>装备品质判定 +${e.quality.toFixed(1)} · 药物恢复 +${e.heal}%</div><details class="birth-rates"><summary>查看抽取概率与规则</summary><p>${(b.race==='human'?B.ROOTS:B.BLOODS).map(x=>x.name+' '+x.weight+'%').join(' · ')}</p><p>${b.race==='human'?'灵根品阶独立抽取；五行偏性是灵根中的首属性。异灵根另标雷、冰或风，其当前属性效果仍按五行偏性结算。':'血脉品阶独立抽取；狼、狐、猿、蛇、鹤本相各20%。'}悟性/灵智、根骨/妖躯为40–90，气运为1–100。任何天赋都可以飞升；没有抽卡付费与现实等待。</p><p>气运只改善已有装备品质判定，不保证每次出稀有装备，不改变固定材料产量。天赋不改变地图、首领解锁和飞升门槛。</p></details></section><footer class="entry-footer birth-footer"><div class="birth-actions"><button data-a="birth-reroll">重新抽取<small>第 ${draws} 次</small></button><button class="entry-main-action" data-a="birth-confirm">确认入世<span>→</span></button></div><div class="entry-footer-tools">${hasLegacy&&b.race==='human'&&!dead?'<button data-a="legacy-list">继承本机旧档</button>':''}${!dead?'<button data-a="entry-import">导入JSON存档</button>':''}<button data-a="birth-back">返回档位</button></div><p>入世才写入档位 · 寿尽只终结本档</p></footer>`;}
function heritage(list,slot){return header('03','heritage-back','人族 · 旧世传承')+heading('保留旧世，不合并进度','选择旧档','迁入人族第'+num(slot)+'档；原文件保持不动。')+`<section class="entry-content heritage-content">${list.map(x=>`<button class="heritage-item" data-a="legacy-pick" data-source="${encodeURIComponent(x.key)}"><b>${esc(x.label)}</b><span>${esc(x.realm)} · 第${x.day}日</span><small>保留旧传承属性，不重抽天赋 →</small></button>`).join('')||'<p>本机没有可继承的旧档，可返回并导入JSON。</p>'}</section><footer class="entry-footer"><button class="entry-secondary-action" data-a="heritage-back">返回命格页</button><p>旧档只迁入空档；每个源档只自动继承一次。</p></footer>`;}
function imported(g,slot,label){return header('03','heritage-back','确认继承')+heading('独立迁移 · 不覆盖其他进度','核对存档',esc(label))+`<section class="entry-content heritage-content"><h2>${esc(g.s.birth.name)}</h2><p>${g.character.name} · ${g.realm} · 第${g.day}日</p><p>目标：第${num(slot)}档<br>寿元：${g.lifeYears.toFixed(1)}年<br>已通过：${g.s.cleared.filter(Boolean).length}/12境</p><p>${g.s.birth.origin==='legacy'?'旧传承与物资原样保留，不在已有角色上重新抽取天赋。':'恢复原有种族与天赋，不重新抽取。'}</p><p>原档不删除。目标非空、已陨落或浏览器写入失败时停止迁移。</p></section><footer class="entry-footer"><button class="entry-main-action" data-a="entry-import-confirm">确认继承至第${num(slot)}档<span>→</span></button><button class="entry-secondary-action" data-a="heritage-back">取消</button></footer>`;}
function sheet(g){return `<h3>${esc(g.s.birth.name)} · ${g.character.name}</h3><p class="muted">命格入世后固定，切换档位与读取不会重抽。</p><div class="birth-traits">${B.cards(g.s.birth).map(([k,v,n])=>`<div class="birth-trait"><small>${k}</small><div><b>${esc(v)}</b><span>${esc(n)}</span></div></div>`).join('')}</div><h3>修行路线</h3><p>${g.character.realms.join(' → ')}</p><p>当前：${g.realm}${g.s.character==='demon'&&g.s.major>=3?' · 已化形，仍保留妖族血脉':''}</p>`;}
root.QEntry={races,archives,birth,heritage,imported,sheet};
if(typeof module!=='undefined'&&module.exports)module.exports=root.QEntry;
})(globalThis);

<script>
/* Responsive phone UI, overlay-only feedback and state-driven onboarding. */
(function(){
'use strict';
const B=QBirth,E=QEntry;
const D=QData,$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let game,activeRole=null,activeSlot=1,selectedRole='human',slotPage=0,frontPage=null,slots,saveStatus='未保存',bootMessage='',saveAvailable=true,deathBoot=false,panel=null,travelOpen=false,mapOpen=false,modal=null,route=[],timer=null,toastTimer=null,guideRAF=null,focusBeforeModal=null,guideSignature='',importCandidate=null;
let mapFocus=null,draftBirth=null,draftSlot=1,drawCount=0,entryImport=null;
function seedNow(){const a=new Uint32Array(1);if(globalThis.crypto?.getRandomValues){crypto.getRandomValues(a);return a[0]||1;}return 1+Math.floor(Math.random()*4294967294);}
let filter='all',search='',panelScroll={},openEntries=new Set(),helpOpen=new Set(['start']);
// Store lifetime and backups by ROLE, never by game-global key.
try{slots=new QCharacterSlots(window.localStorage);}catch{saveAvailable=false;slots=new QCharacterSlots({getItem(){return null;},setItem(){throw Error('本地存储不可用');},removeItem(){throw Error('本地存储不可用');}});}
function clearAllSaves(){
 if(!activeRole)return false;
 try{slots.expire(activeRole,activeSlot);saveStatus='寿元已尽 · 仅当前档位已清除';deathBoot=true;return true;}
 catch{saveStatus='存储受限 · 无法保证删档';deathBoot=true;return false;}
}
function load(){game=new QGame();activeRole=null;activeSlot=1;deathBoot=false;saveStatus=saveAvailable?'请选择角色':'浏览器存储受限';}
function persist(){
 if(!activeRole)return true;
 if(game.s.ended){if(!deathBoot)return clearAllSaves();return true;}
 if(deathBoot)return true;
 try{slots.save(activeRole,game,activeSlot);saveAvailable=true;saveStatus='自动保存成功';return true;}
 catch(e){saveAvailable=false;saveStatus='未能落盘 · 请导出';notify('存储未成功，先导出当前进度：'+e.message,'warn');return false;}
}
function selectCharacter(id,mode='open',n=1){
 if(!D.RACES[id])return;
 try{n=slots.slot(n);let next;
  if(mode==='new'){
   if(!draftBirth||draftBirth.race!==id||draftSlot!==n)throw Error('请先在命格页抽取天赋');
   draftBirth.name=B.nameOf($('birth-name')?.value??draftBirth.name,id);
   next=slots.newGame(id,draftBirth.seed,n,draftBirth);
  }else{const found=slots.read(id,n);if(!found){beginBirth(id,n);return;}next=found.game;}
  game=next;activeRole=id;activeSlot=n;saveAvailable=true;saveStatus='已保存 · '+game.character.name+'第'+String(n).padStart(3,'0')+'档';deathBoot=false;panel=null;modal=null;frontPage=null;stop();travelOpen=false;mapOpen=false;search='';filter='all';
  try{localStorage.setItem(D.ACTIVE_KEY,id);}catch{}
  renderPage();renderModal();render();if(game.s.guide.status==='new')showModal({kind:'intro'});
 }catch(e){notify('档位操作失败：'+e.message,'warn');}
}
function beginBirth(id,n){
 if(!D.RACES[id])return;const st=slots.status(id,n);if(!['empty','dead'].includes(st.status)){notify('档位非空，不可重新抽取','warn');return;}
 selectedRole=id;draftSlot=slots.slot(n);draftBirth=B.roll(id,seedNow());drawCount=1;entryImport=null;showPage({kind:'birth',role:id,slot:n});
}
function birthBack(){entryImport=null;slotPage=Math.floor((draftSlot-1)/20);showPage({kind:'slots',role:selectedRole});}
function completeImport(){
 if(!entryImport)return;try{const id=entryImport.game.s.race,n=draftSlot;
  if(slots.status(id,n).status!=='empty')throw Error('目标必须是空档');
  if(entryImport.source)slots.migrate(id,n,entryImport.source);else slots.save(id,entryImport.game,n);
  entryImport=null;selectCharacter(id,'open',n);notify('已继承到独立档位，原档未删除','ok');
 }catch(e){notify('继承未完成：'+e.message,'warn');}
}
function showCharacters(){
 if(activeRole&&!deathBoot&&game&&!game.s.ended&&persist()===false)return;
 stop();panel=null;travelOpen=false;mapOpen=false;showPage({kind:'characters'});
}
function notify(message,tone='info'){
 clearTimeout(toastTimer);const tool=message.includes('缺少')&&(/木斧|石镐|钓竿/.test(message));const room=/需.*(炼器室|丹房|洞府)|先.*(筑庐|仓房|洞府)/.test(message);
 $('toast').className='toast show'+(tone==='warn'?' warn':'');
 $('toast').innerHTML=`<span>${esc(message)}</span>${tool?'<button class="toast-link" data-a="panel" data-name="craft">炼制</button>':room?'<button class="toast-link" data-a="panel" data-name="camp">洞府</button>':''}`;
 toastTimer=setTimeout(()=>$('toast').classList.remove('show'),tone==='warn'?3500:2200);
}
function stop(){if(timer!==null)clearTimeout(timer);timer=null;route=[];}
function flush(result){
 const effects=game.effects.slice();game.effects=[];
 if(game.s.ended){stop();panel=null;travelOpen=false;mapOpen=false;persist();render();showModal({kind:'permadeath'});return result;}
 if(effects.some(e=>e.kind==='victory'))showModal({kind:'victory'});
 const show=effects.find(e=>['unlock','guide-complete'].includes(e.kind))||effects.at(-1);
 if(show)notify(show.msg,show.tone);
 persist();render();return result;
}
function run(name,args={}){const result=game.act(name,args);return flush(result);}
function bar(k,label,value,max){const pct=Math.max(0,Math.min(100,value/max*100));return `<div class="bar"><div class="bar-label"><span>${label}</span><b>${value}/${max}</b></div><div class="track"><div class="fill ${k} ${pct<=20?'low':''}" style="width:${pct}%"></div></div></div>`;}
function renderStatus(){const s=game.s;$('status').innerHTML=`<div class="status-line"><b>${game.realm}<span class="xp">${game.character.short} · ${s.level>=18?'道 '+s.daoXp+'/'+(game.tribulationNeed||'—'):'修 '+s.xp+'/'+game.required}</span></b><span class="life-label" title="寿元归零将清除存档">寿 ${game.lifeYears.toFixed(1)}年 · ${game.day}日 ${game.clock}</span></div><div class="bars">${bar('hp','气血',s.hp,s.maxHp)}${bar('spirit',game.character.energy,s.spirit,s.maxSpirit)}${bar('hunger','饱腹',s.hunger,100)}${bar('water','饮水',s.water,100)}</div>`;
 $('zone-label').textContent=game.zone.name;
 const short={wood:'木',stone:'石',rune:'纹',dew:'露',blossom:'花',herb:'药',copper:'铜',cinder:'火',ore:'矿',moss:'苔',soul:'魂',star:'星',thunder:'雷'};
 const text=s.ascended?'飞升已成 · 仙界待续':s.cleared[s.zone]?(s.zone>=5?(s.major===s.zone-4?'返回洞府 · 破境':s.zone===11?'前往天门 · 飞升':'已突破 · 前往下一境'):'已开 '+D.ZONES[s.zone+1].name):s.ritual[s.zone]?(game.bossReadiness()?'猎妖炼器 · 战备尚未完成':'前往「'+game.zone.bossMark+'」挑战首领'):Object.entries(game.zone.need).map(([id,n])=>(short[id]||D.ITEMS[id].name)+' '+game.has(id)+'/'+n).join('　');
 $('quest').dataset.name=game.camp?'quest':'camp';
 if(!game.camp){$('quest').innerHTML='<b>定居</b><span>寻找营地 · 择地筑庐</span><em>›</em>';}else $('quest').innerHTML=`<b>${s.cleared[s.zone]?'已平定':game.zone.verb}</b><span>${esc(text)}</span><em>${s.zone+1}/${D.ZONES.length} ›</em>`;
 $('berry-count').textContent=s.inv.berry||0;$('water-count').textContent=s.inv.water||0;$('salve-count').textContent=s.inv.salve||0;$('rest-button').textContent=game.workshop?'休息':'调息';$('home-button').textContent=game.camp?'回府':'定居';
 document.querySelectorAll('.quick-nav [data-name]').forEach(b=>b.classList.toggle('active',b.dataset.name===panel));
}
function resourceStyle(k){return ['copper','cinder'].includes(k)?'fire':['dew','blossom','spring','fish','waterherb'].includes(k)?'aqua':['soul','moss','venom'].includes(k)?'yin':['star','thunder','ancient'].includes(k)?'star':['stone','ore','spiritStone','rune'].includes(k)?'mineral':'';}
function locationActions(){const l=game.land(),s=game.s,hasGround=Object.values(game.ground).some(n=>n>0);
 if(l==='gate'&&s.zone===11&&s.major===8&&s.cleared.every(Boolean))return '<button data-a="ascend" class="important">飞升</button>';
 const pickup=hasGround?'<button data-a="pickup">拾遗</button>':'';
 if(game.atCamp)return `<button data-a="panel" data-name="camp" class="important">洞府</button>${hasGround?pickup:'<button data-a="rest" data-mode="camp">休息</button>'}`;
 if(l==='shrine')return `<button data-a="rest" data-mode="field">调息</button><button class="important" data-a="repair">${s.ritual[s.zone]?'已完成':game.zone.verb}</button>`;
 if(l==='boss')return `<button data-a="rest" data-mode="field">调息</button><button class="important" data-a="hunt">${s.cleared[s.zone]?'再战':'挑战'}</button>`;
 if(l==='gate')return `<button data-a="rest" data-mode="field">调息</button><button data-a="zone" data-zone="${s.zone===4?0:s.zone+1}" class="important">${s.zone===4?'归途':'下一境'}</button>`;
 if(game.site)return '<button data-a="site" class="important">探查</button>'+(pickup||'<button data-a="rest" data-mode="field">调息</button>');
 if(l==='bazaar')return '<button data-a="barter">交易</button>'+(pickup||'<button data-a="rest" data-mode="field">调息</button>');
 if(!game.canSettle())return '<button data-a="panel" data-name="camp">'+(game.camp?'选址':'筑庐')+'</button>'+(pickup||'<button data-a="scout">勘察</button>');
 return '<button data-a="scout">勘察</button>'+(pickup||'<button data-a="rest" data-mode="field">调息</button>');
}
const SCENE_LABELS={grass:'灵草',twig:'枯枝',fruit:'灵果',stone:'灵石',wood:'灵木',ore:'铁矿',spiritStone:'灵矿',spring:'清泉',herb:'止血草',rune:'阵纹',dew:'灵露',blossom:'碧花',copper:'赤铜',cinder:'焰砂',moss:'阴苔',soul:'魂砂',star:'星髓',thunder:'雷髓',fish:'灵鱼',waterherb:'水灵草',venom:'毒草',ancient:'古卷'};
function renderScene(){
 const old=$('scene-content').scrollTop;
 if(game.s.combat){$('scene-content').innerHTML=renderCombat();$('scene-content').scrollTop=old;return;}
 const t=game.atCamp?{...D.LAND[game.land()],risk:'安全'}:D.LAND[game.land()],s=game.s;
 const resources=game.sceneNodes().map((node,i)=>{
  if(node.enemy){const mob=D.ENEMIES[node.enemy],left=game.enemyLeft(i);return `<button class="resource scene-monster ${left?'':'exhausted'}" data-a="challenge" data-index="${i}" aria-label="${esc(mob.name)}，${left?'点击挑战':'今日已挑战'}" title="${esc(mob.name)}"><b>${esc(mob.short||mob.name.slice(-2))}</b><small>${left?(mob.tier===2?'强敌':'挑战'):'次日'}</small></button>`;}

  const tag=r.tool&&!s.inv[r.tool]?({axe:'斧',pick:'镐',rod:'竿'}[r.tool]):r.level&&s.level<r.level?r.level+'层':'';
  return `<button class="resource ${left?'':'exhausted'}" data-a="gather" data-index="${i}" aria-label="${esc(r.name+'，'+(left?'剩余'+left+'次':'已采完')+(why?'，'+why:''))}" title="${esc(r.name+(why?' · '+why:''))}"><b>${esc(SCENE_LABELS[k]||r.name.slice(0,3))}</b><small>${left?'×'+left:'—'}</small>${left&&tag?'<i>'+tag+'</i>':''}</button>`;
 }).join('');
 $('scene-content').innerHTML=`<article class="scene-card"><div class="location-head"><h1>${esc(game.name)}</h1><span class="risk ${t.risk==='高'||t.risk==='极高'?'danger':''}">${t.risk==='安全'?'安全':t.risk+'危'}</span></div><div class="location-tools"><span>斧${s.inv.axe?'✓':'—'}　镐${s.inv.pick?'✓':'—'}${s.inv.rod?'　竿✓':''}</span><div class="location-actions">${locationActions()}</div></div><div class="resources" id="resources" role="group" aria-label="资源采集和主动挑战">${resources}</div></article>`;
 $('scene-content').scrollTop=old;

document.addEventListener('keydown',e=>{
 if(mapOpen&&e.key==='Tab'){const f=[...$('map-overlay').querySelectorAll('button:not(:disabled)')],first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}return;}
 if(frontPage&&!modal&&e.key==='Tab'){const f=[...$('entry-root').querySelectorAll('button:not(:disabled),input,summary')];if(f.length){const first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}
 if(modal&&e.key==='Tab'){const f=[...$('modal-root').querySelectorAll('button:not(:disabled),input,[tabindex="0"]')];if(f.length){const first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}
 if(e.key==='Escape'){e.preventDefault();if(modal&&['new-character-confirm','slot-migrate-confirm'].includes(modal.kind)){closeModal();return;}if(frontPage&&!modal){if(['birth','legacy','entry-import'].includes(frontPage.kind)){birthBack();}else if(frontPage.kind==='slots')showPage({kind:'characters'});else if(activeRole&&!deathBoot){frontPage=null;renderPage();render();}return;}if(modal?.kind==='permadeath')return;if(modal){if(modal.kind==='intro')game.act('guide',{mode:'skip'});closeModal();persist();}else if(mapOpen){setMap(false);}else if(travelOpen){travelOpen=false;render();}else if(panel){panel=null;render();}else if(game.s.guide.status==='active')run('guide',{mode:'pause'});else{stop();render();}return;}
 if(frontPage||modal||mapOpen||panel||travelOpen||game.s.combat||e.target.closest('input,textarea,select,button'))return;
 const moves={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};if(moves[e.key]){e.preventDefault();stop();const [dx,dy]=moves[e.key];run('move',{x:game.s.pos.x+dx,y:game.s.pos.y+dy});}
});
window.addEventListener('resize',()=>{renderTravel();renderCoach();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();persist();}});
window.addEventListener('pagehide',()=>{stop();persist();});
load();render();showPage({kind:'characters'});if(bootMessage)setTimeout(()=>notify(bootMessage,saveAvailable?'ok':'warn'),300);
window.QinglanDemo={getState:()=>activeRole?game.state():null,getSlots:()=>slots.list(),getSlotPage:(role,page=0)=>slots.listSlots(role,page*20+1,20),getActiveSlot:()=>activeSlot,getActiveRole:()=>activeRole,metadata:{version:14,appVersion:'V16',saveKeyPrefix:D.SLOT_PREFIX,width:8,height:8,regions:D.ZONES.map(z=>({name:z.name,need:z.need,boss:z.boss})),recipes:D.RECIPES.map(r=>r.id),bookTotal:bookRows().length},getNode:i=>({kind:game.resource(i),left:game.left(i),condition:game.resource(i)?game.requirement(game.resource(i)):null}),getBirthDraft:()=>draftBirth?JSON.parse(JSON.stringify(draftBirth)):null,getUI:()=>({panel,travelOpen,mapOpen,modal:modal?.kind||null,frontPage:frontPage?.kind||null,route:route.length,saveStatus,deathBoot,activeRole})};
})();
