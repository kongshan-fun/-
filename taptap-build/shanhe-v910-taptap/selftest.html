<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>山野修仙记 V90.16 · TapTap 环境自检</title>
<style>
 body{margin:0;padding:16px;font:14px/1.6 system-ui,-apple-system,"Microsoft YaHei",sans-serif;background:#f6f6f4;color:#1a1a1a}
 h1{font-size:17px;margin:0 0 4px} .sub{color:#666;font-size:12px;margin-bottom:14px}
 .row{display:flex;justify-content:space-between;gap:10px;padding:9px 11px;background:#fff;border:1px solid #e2e2e2;border-radius:8px;margin-bottom:6px}
 .ok{color:#1b7a3f;font-weight:600} .no{color:#b3261e;font-weight:600} .warn{color:#8a6d00;font-weight:600}
 code{background:#eee;padding:1px 5px;border-radius:4px;font-size:12px}
 .code{margin-top:14px;padding:11px;background:#141414;color:#fff;border-radius:8px;font-size:13px;word-break:break-all}
 .note{margin-top:12px;font-size:12px;color:#666;line-height:1.7}
</style></head><body>
<h1>TapTap 环境自检</h1>
<div class="sub">山野修仙记 V90.16 · 界面密度与检索优化</div>
<div id="rows"></div>
<div class="code">BUILD 测试码：SHANYE-V916-TT-D7C2F9B2</div>
<div class="note">
普通浏览器里 tap 相关项会显示「缺失 / MOCK」，这是正常的降级；<br>
要在 TapTap 容器内打开本页，五项应全部显示「可用」且 MOCK 为 否。
</div>
<script>
function row(name, value, cls){
  var d=document.createElement('div'); d.className='row';
  d.innerHTML='<span>'+name+'</span><span class="'+(cls||'')+'">'+value+'</span>';
  document.getElementById('rows').appendChild(d);
}
var t = window.tap || null;
var q = window.QTap || null;
var mock = (q && typeof q.isMock==='function') ? q.isMock() : null;

row('TapTap 运行环境 tap', t ? '可用' : '缺失', t?'ok':'no');
row('适配层 QTAP', q ? '已初始化' : '未加载', q?'ok':'no');
row('MOCK 降级模式', mock===null ? '未知' : (mock ? '是（非 TapTap 容器）' : '否（真实容器）'),
    mock===false?'ok':(mock===true?'warn':'no'));
row('云存档 getCloudSaveManager', (t && typeof t.getCloudSaveManager==='function') ? '可用' : '缺失',
    (t && typeof t.getCloudSaveManager==='function')?'ok':'no');
row('排行榜 getLeaderboardManager', (t && typeof t.getLeaderboardManager==='function') ? '可用' : '缺失',
    (t && typeof t.getLeaderboardManager==='function')?'ok':'no');
row('文件系统 getFileSystemManager', (t && typeof t.getFileSystemManager==='function') ? '可用' : '缺失',
    (t && typeof t.getFileSystemManager==='function')?'ok':'no');
row('激励视频 createRewardedVideoAd', (t && typeof t.createRewardedVideoAd==='function') ? '可用' : '缺失',
    (t && typeof t.createRewardedVideoAd==='function')?'ok':'no');
row('成就 createAchievementManager', (t && typeof t.createAchievementManager==='function') ? '可用' : '缺失',
    (t && typeof t.createAchievementManager==='function')?'ok':'no');
</script>
</body></html>
