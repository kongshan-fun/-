name: Build Shanye Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - release/shanye-v30-android
    paths:
      - 'shanye-xiuxianji/android-app/**'
      - '.github/workflows/build-shanye-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shanye-xiuxianji/android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Generate Android project and sync web assets
        run: |
          npx cap add android
          npx cap sync android
      - name: Build unsigned-release-independent debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shanye-xiuxianji-v30-debug-apk
          path: shanye-xiuxianji/android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
