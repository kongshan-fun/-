name: V90.75 Candidate Acceptance
on:
  push:
    branches: [feat/v90.75-global-home-progression]
    paths: ['_delivery/v975.ready', 'src/v975/**', 'tests/**', 'tools/**', 'README.md', 'docs/v975/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v975-candidate
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import hash-locked reviewed source transfer when present
        run: |
          python - <<'PY'
          import pathlib,base64,lzma,json,hashlib,subprocess
          marker=pathlib.Path('_delivery/v975.ready')
          if marker.exists():
              expected=marker.read_text().strip()
              packed=base64.b64decode(''.join(p.read_text().strip() for p in sorted(pathlib.Path('_delivery').glob('v975-input-*.b64'))),validate=True)
              assert hashlib.sha256(packed).hexdigest()==expected,'Source transfer integrity mismatch'
              data=json.loads(lzma.decompress(packed))
              def check(name):
                  p=pathlib.PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in name
                  assert name=='README.md' or name.startswith(('src/v975/','docs/v975/','tests/','tools/'))
                  assert not pathlib.Path(name).is_symlink()
              for name,patch in data['patches'].items():
                  check(name)
                  subprocess.run(['git','apply','--check','-'],input=patch,text=True,check=True)
                  subprocess.run(['git','apply','-'],input=patch,text=True,check=True)
              for name,text in data['files'].items():
                  check(name);p=pathlib.Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text,encoding='utf-8')
              print('Imported reviewed files:',len(data['files'])+len(data['patches']))
          PY
      - name: Build exact candidate and persist sources only to feature branch
        run: |
          python tools/build_v975_from_main.py
          python tools/check_entry_consistency.py --rebuild
          git config user.name 'Development verification bot'
          git config user.email 'development-verification@users.noreply.github.com'
          git add README.md src/v975 tests tools/build_v975_from_main.py tools/package_v975.py docs/v975 index.html releases/山野修仙记_V90.75_洞天十二阶完整版.html
          if [ -f _delivery/v975.ready ]; then git rm -- _delivery/v975.ready _delivery/v975-input-*.b64; fi
          if ! git diff --cached --quiet; then
            git commit -m 'feat(V90.75): materialize reviewed global-home, twelve-tier and supply changes [skip ci]'
            git push origin HEAD:feat/v90.75-global-home-progression
          fi
          git rev-parse HEAD > /tmp/v975-source-sha
      - name: Current-entry engine, migration and failure regression
        run: |
          set -o pipefail
          mkdir -p artifacts/v975
          node tests/run_v975_acceptance.cjs | tee artifacts/v975/acceptance.log
      - name: Install actual Chromium and Chinese layout fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-wqy-zenhei
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Actual HTTP origin, localStorage, downloads and six viewports
        run: |
          set -o pipefail
          python tests/v975_browser.py | tee artifacts/v975/browser-native.log
      - name: Record exact source verification
        run: |
          python - <<'PY'
          import pathlib,json,hashlib,os
          r=pathlib.Path('.')
          x={'version':'V90.75','verifiedSourceCommit':pathlib.Path('/tmp/v975-source-sha').read_text().strip(),'workflowRun':os.environ['GITHUB_RUN_ID'],'entrySha256':hashlib.sha256((r/'index.html').read_bytes()).hexdigest(),'engine':json.loads((r/'artifacts/v975/current-regression.json').read_text()),'browser':json.loads((r/'artifacts/v975/browser/results.json').read_text())}
          (r/'docs/v975/CI验收摘要.json').write_text(json.dumps(x,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Verified H5 and complete source delivery ZIPs
        run: python tools/package_v975.py
      - name: Publish verification summary to feature branch only
        run: |
          git add docs/v975/CI验收摘要.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs(V90.75): retain exact native-browser and current-source acceptance [skip ci]'
            git push origin HEAD:feat/v90.75-global-home-progression
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v975-evidence-${{ github.run_id }}
          path: artifacts/v975/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: v975-delivery-${{ github.run_id }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
