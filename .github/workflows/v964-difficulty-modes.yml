name: V90.64 Difficulty Modes Candidate
on:
  push:
    branches: [feat/v90.64-three-difficulty-modes]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: V90.64 difficulty rules, combat and isolated slots
        run: node tests/v964_difficulty_modes.cjs
      - name: Candidate reproducible build
        run: |
          python3 tools/check_entry_consistency.py
          python3 tools/check_entry_consistency.py --rebuild
          git diff --exit-code -- index.html releases/
      - name: V90.62 save and combat regression
        run: |
          node tests/v962_p0_save_integrity.cjs
          node tests/v959_combat_save.cjs
          node tests/v960_breakthrough_split.cjs
      - name: Install Chromium
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Mode selection mobile Chromium browser check
        run: python3 tests/v964_browser_modes.py
