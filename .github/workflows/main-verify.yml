name: Main Verify (current release)
on:
  push:
    branches: [main]
    paths: ['index.html', 'releases/**', 'src/v975/**', 'tools/**', 'tests/**', 'docs/**', '.github/workflows/main-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Current entry, frozen release and deterministic rebuild
        run: |
          python3 tools/check_entry_consistency.py --rebuild
          git diff --exit-code -- index.html releases/
      - name: Current-entry engine, 600-slot migration and 100-run progression
        run: |
          set -o pipefail
          mkdir -p artifacts/v975
          node tests/run_v975_acceptance.cjs | tee artifacts/v975/acceptance.log
      - name: Install Chinese layout fonts and Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-wqy-zenhei
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Native HTTP localStorage, downloads and six-viewport UI
        run: |
          set -o pipefail
          python3 tests/v975_browser.py | tee artifacts/v975/browser-native.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-release-evidence-${{ github.run_id }}
          path: artifacts/v975/
          retention-days: 14
          if-no-files-found: error
