name: Main Verify (current release)

# P0-1：旧工作流把 V90.8 的文件名、标题、哈希全部写死在 YAML 里，发版即红。
# 现在改成「按当前版本反查」：版本号从 index.html 标题读，发布文件靠字节比对找，
# 构建器靠 OUT_NAME 反查 —— 以后升版本不需要动这个文件。

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'releases/**'
      - 'tools/**'
      - 'tests/**'
      - 'docs/**'
      - '.github/workflows/main-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 默认入口 / 发布文件 / 构建器 三者一致
        run: python3 tools/check_entry_consistency.py

      - name: 版本链可复现（从冻结基线重建，产物必须字节一致）
        run: python3 tools/check_entry_consistency.py --rebuild

      - name: 重建产物与仓库内文件必须零差异
        run: git diff --exit-code -- index.html releases/

      - name: 语法与引擎回归（不需要浏览器）
        run: |
          node tests/syntax_check.cjs
          node tests/run_v908_regression.cjs
          node tests/v923_gear_drop.cjs
          node tests/v908-character-gear-layout.test.cjs

      - name: 安装 Playwright 与 Chromium
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m playwright install --with-deps chromium

      - name: 全 H5 Chromium 响应式验收（含截图）
        run: python3 tests/browser_responsive.py

      - name: 上传截图与 metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-responsive-${{ github.run_id }}
          path: artifacts/browser-responsive/
          retention-days: 14
          if-no-files-found: warn
