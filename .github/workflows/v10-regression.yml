name: V12 mortal realm and ascension regression
on:
  push:
    branches: [main, 'chore/**', 'feat/**', 'release/**']
  pull_request:
    branches: [main, 'chore/**', 'feat/**']
permissions:
  contents: read
jobs:
  core:
    name: Gameplay, independent characters, lifespan, 12 maps and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: JS syntax
        run: |
          node --check src/data.js
          node --check src/engine.js
          node --check src/slots.js
          node --check src/ui.js
      - name: Existing rule and storage regressions
        run: |
          node tests/smoke.test.js
          node tests/v10_regression.test.js
          node tests/v10_lifespan.test.js
          node tests/v11_characters.test.js
      - name: Six old region full campaigns (3 seeds x 2 roles)
        run: node tests/v10_campaign.test.js --all --both-roles
      - name: Actual mortal-world ascension (two roles)
        run: node tests/v12_ascension.test.js
      - name: Rebuild manual and standalone
        run: |
          python build_docs.py
          python build.py
      - name: Verify committed HTML and tutorial match source
        run: |
          git diff --exit-code -- '青岚问道_V12_凡界飞升.html' 'docs/完整文字教程.html' 'docs/完整文字教程.md' 'docs/营建与炼制数值.md' 'docs/当前游戏数据.json'
  browser:
    name: Chromium mobile layout, storage and ascension UI (test adapter)
    runs-on: ubuntu-latest
    needs: core
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Reconstruct genuine player save fixtures from actual campaigns
        run: node tests/v12_ascension.test.js
      - name: Historical browser regression
        run: |
          python tests/v10_browser_smoke.py
          python tests/v10_lifespan_browser.py
          python tests/v11_browser.py
      - name: V12 character slots, ascension, maps and layout
        run: python tests/v12_browser.py
