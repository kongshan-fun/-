name: V15 24-node scene + legacy regression
on:
  push:
    branches: [main, 'chore/**', 'feat/**', 'fix/**', 'release/**']
  pull_request:
    branches: [main, 'chore/**', 'feat/**', 'fix/**']
permissions:
  contents: read
jobs:
  validate:
    name: V14 current source, two races, saves and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify and unpack one-time authored source delivery
        run: python tools/apply_v14.py
      - name: Syntax and deterministic builds
        run: |
          for f in src/*.js; do node --check "$f"; done
          python build_docs.py
          python build.py
      - name: 76 rule, lifespan, race and slot checks
        run: |
          node tests/v14_core.test.js
          node tests/v14_lifespan.test.js
          node tests/v14_races.test.js
          node tests/v15_scene.test.js
      - name: Six natural initial-resource campaigns and both ascensions
        run: |
          node tests/v14_campaign.test.js --all --both-roles
          node tests/v14_ascension.test.js
      - name: Chromium setup
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Current V14 interface, slots and injected quota failures
        run: python tests/v14_browser.py
      - name: Real HTTP origin storage and reloads in desktop Chromium
        env:
          QINGLAN_REAL_ORIGIN: '1'
        run: python tests/v14_browser.py
      - name: Both races complete all eleven tutorial steps using real controls
        run: python tests/v14_onboarding.py
      - name: V15 Chromium 24-node checks
        run: python tests/v15_browser.py
      - name: Materialized source has reproducible standalone and manual
        shell: bash
        run: |
          if git cat-file -e HEAD:docs/V14_source_manifest.json 2>/dev/null; then
            git diff --exit-code -- '青岚问道_V14_人妖同途.html' 'docs/完整文字教程.html' 'docs/完整文字教程.md' 'docs/当前游戏数据.json' 'docs/V14_种族与命格数值.md'
          fi
  publish_verified_source:
    name: Materialize verified source on the authorized V14 branch only
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/v14-races-talents'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Commit exact tested sources once without force or main changes
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if git cat-file -e HEAD:docs/V14_source_manifest.json 2>/dev/null; then
            echo 'Already materialized; no automatic write.'
            exit 0
          fi
          python tools/apply_v14.py
          python build_docs.py
          python build.py
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          names = list(json.loads(Path('docs/V14_source_manifest.json').read_text())['files'])
          names += ['docs/V14_source_manifest.json', 'docs/完整文字教程.html', 'docs/完整文字教程.md', 'docs/当前游戏数据.json', 'docs/V14_种族与命格数值.md', '青岚问道_V14_人妖同途.html']
          subprocess.run(['git', 'add', '--', *names], check=True)
          PY
          REMOTE_SHA=$(git ls-remote origin refs/heads/feat/v14-races-talents | cut -f1)
          test "$REMOTE_SHA" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(v14): materialize tested human and demon races, talents and save pages'
          git push origin HEAD:refs/heads/feat/v14-races-talents
