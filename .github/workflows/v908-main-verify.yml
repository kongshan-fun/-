name: V90.8 Main Consistency
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'releases/**'
      - 'patches/**'
      - 'tools/build_v908_from_main.py'
      - 'tools/extract_v908_tests.py'
      - 'tools/v908-sync-tests-*.json'
      - 'tests/**'
      - '.github/workflows/v908-main-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published V90.8 title and identical entry points
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('index.html').read_bytes()
          b=Path('releases/山野修仙记_V90.8_五阶洞府与高阶炼制版.html').read_bytes()
          assert a==b, "main index and V90.8 release differ"
          assert a.count('<title>山野修仙记 V90.8 · 五阶洞府与高阶炼制</title>'.encode())==1, "wrong V90.8 title"
          PY
      - name: Rebuild from hash-checked frozen baseline
        run: python3 tools/build_v908_from_main.py
      - name: Extract pinned regression scripts
        run: python3 tools/extract_v908_tests.py
      - name: Run full regressions
        run: node tests/run_v908_regression.cjs
      - name: Check 0-36 equipment and inspector layout contract
        run: node tests/v908-character-gear-layout.test.cjs
      - name: Ensure release artifacts remain reproducible
        run: |
          git diff --exit-code -- index.html             "releases/山野修仙记_V90.7_飞升结算与本机资质榜.html"             "releases/山野修仙记_V90.8_五阶洞府与高阶炼制版.html"
